<!DOCTYPE html>
<html lang="da" data-theme="default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match par – demo</title>
  <!-- LOCAL DEMO ONLY. Not in the deployed bundle (tools/ is outside tools/cloudflare-build-static.mjs's
       allowlist) and never talks to Supabase. Serve the repository root over HTTP and open
       /tools/match-pairs/demo.html. The real control is js/match-pairs.js with the quiz's own CSS;
       the "server" below is a stand-in that only compares positions, to show the feedback states.
       Real grading is process_question_attempt (supabase/functions/_shared/match-pairs.ts). -->
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/match-pairs.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: var(--bg-main); color: var(--text-main); min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; }
    .game-shell { width: 100%; max-width: 480px; padding: 16px 16px 64px; display: flex; flex-direction: column; gap: 14px; }
    .demo-bar { display: flex; flex-wrap: wrap; gap: 6px; }
    .demo-bar button { padding: 6px 12px; min-height: 36px; border-radius: 18px; border: 1px solid var(--border-btn);
      background: var(--btn-bg); color: var(--text-dim); font: inherit; font-size: 13px; cursor: pointer; }
    .demo-bar button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: transparent; }
    .demo-note { font-size: 12px; color: var(--text-label); }
    #question { font-size: 19px; font-weight: bold; line-height: 1.35; color: var(--text-bright); }
    #feedback { min-height: 22px; font-size: 16px; }
    .feedback-correct { color: var(--success-text); }
    .feedback-error { color: var(--error-bright); }
    /* The quiz page's #options button rules (index.html), copied so the demo looks like the app. */
    .answer-area { display: flex; flex-direction: column; gap: 8px; }
    #options button { display: flex; align-items: center; width: 100%; min-height: 52px; padding: 14px 18px; margin: 0;
      background: var(--btn-bg); color: var(--text-dim); border: 1.5px solid var(--border-btn); border-radius: 12px;
      cursor: pointer; font-family: inherit; font-size: 16px; text-align: left; line-height: 1.3; }
    #options button:hover:not(:disabled) { background: var(--btn-bg-hover); color: var(--text-main); border-color: var(--border); }
    #options button:disabled { opacity: 0.45; cursor: not-allowed; }
    #options button.submit-btn { justify-content: center; background: var(--accent); color: #fff; border-color: transparent; font-weight: bold; }
  </style>
</head>
<body>
  <main class="game-shell">
    <p class="demo-note">Demo af opgaveformen Match par — lokale eksempler, ingen server.</p>
    <div class="demo-bar" id="demo-levels" role="group" aria-label="Eksempler pr. niveau"></div>
    <div id="question">Indlæser…</div>
    <div id="feedback" role="status" aria-live="polite"></div>
    <div id="options" class="answer-area"></div>
  </main>
  <script type="module">
    import { buildMatchPairsAnswer } from "../../js/match-pairs.js";

    // Example content per difficulty band: more pairs and more abstract pairs as the band rises
    // (RECOMMENDED_PAIRS_BY_BAND in supabase/functions/_shared/match-pairs.ts). The key is what the server
    // would have drawn for the instance: left position → right display position.
    const EXAMPLES = [
      { band: 1, question: "Forbind det engelske ord med det danske", key: "0:2,1:0,2:1",
        pairs: [["dog", "hund"], ["cat", "kat"], ["house", "hus"]] },
      { band: 3, question: "Forbind landet med hovedstaden", key: "0:2,1:3,2:0,3:1",
        pairs: [["Danmark", "København"], ["Norge", "Oslo"], ["Sverige", "Stockholm"], ["Finland", "Helsinki"]] },
      { band: 5, question: "Forbind begrebet med forklaringen", key: "0:4,1:2,2:5,3:0,4:1,5:3",
        pairs: [["Enevælde", "Kongen har al magt"], ["Demokrati", "Folket vælger"], ["Grundlov", "Landets øverste lov"],
          ["Magtdeling", "Lovgivende, udøvende og dømmende magt adskilt"], ["Stavnsbånd", "Bønder bundet til gården"],
          ["Reformation", "Brud med den katolske kirke"]] },
    ];

    const question = document.getElementById("question");
    const feedback = document.getElementById("feedback");
    const options = document.getElementById("options");
    const bar = document.getElementById("demo-levels");

    function layoutOf(ex) {
      const positions = ex.key.split(",").map((p) => Number(p.split(":")[1]));
      const right = [];
      positions.forEach((pos, i) => { right[pos] = ex.pairs[i][1]; });
      return { left: ex.pairs.map((p) => p[0]), right };
    }

    function show(index) {
      const ex = EXAMPLES[index];
      [...bar.children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === index)));
      question.textContent = ex.question;
      feedback.textContent = "";
      feedback.className = "";
      options.innerHTML = "";
      const control = buildMatchPairsAnswer(document, {
        layout: layoutOf(ex),
        describedBy: "question",
        onSubmit: (answer, btn) => {
          options.querySelectorAll("button").forEach((b) => { b.disabled = true; });
          // Stand-in for process-event → process_question_attempt: compare positions with the key.
          const sent = JSON.parse(answer).sort((a, b) => a[0] - b[0]).map(([l, r]) => `${l}:${r}`).join(",");
          const correct = sent === ex.key;
          return new Promise((resolve) => setTimeout(() => {
            control.showResult(ex.key);
            feedback.textContent = correct ? "Ja! 🎯" : "Ikke helt — se de rigtige par.";
            feedback.className = correct ? "feedback-correct" : "feedback-error";
            document.body.dataset.result = correct ? "correct" : "incorrect";
            resolve();
          }, 150));
        },
      });
      options.appendChild(control.root);
      window.__matchDemo = { control, example: ex };
    }

    EXAMPLES.forEach((ex, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = `Niveau ${ex.band} · ${ex.pairs.length} par`;
      b.onclick = () => show(i);
      bar.appendChild(b);
    });
    const start = Number(new URLSearchParams(location.search).get("example") ?? 1);
    show(Number.isInteger(start) && start >= 0 && start < EXAMPLES.length ? start : 1);
  </script>
</body>
</html>
