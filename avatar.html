<!DOCTYPE html>
<html lang="da" data-theme="default">
<head>
  <!-- Anti-flicker: apply cached theme synchronously before CSS renders -->
  <script>
  (function(){var k='dsj_active_theme',v=['default','ice','inferno','void','forest','sakura','aurora','pearl','meadow','rose-gold'];try{var t=sessionStorage.getItem(k);if(t&&v.indexOf(t)!==-1)document.documentElement.dataset.theme=t;}catch{}}());
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Min Avatar</title>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: none;
      font-family: Arial, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px;
    }

    /* ── Top bar ─────────────────────────────────────────── */

    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .back-btn {
      padding: 8px 14px;
      background: var(--btn-bg);
      color: var(--text-dim);
      border: 1px solid var(--border-btn);
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }

    .back-btn:hover { background: var(--btn-bg-hover); }

    .topbar h1 {
      font-size: 20px;
      font-weight: bold;
      color: var(--text-bright);
    }

    .coins {
      margin-left: auto;
      font-size: 15px;
      color: var(--coin);
      font-weight: bold;
      white-space: nowrap;
    }

    /* ── Two-column layout ───────────────────────────────── */

    .layout {
      display: grid;
      grid-template-columns: 210px 1fr;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 580px) {
      .layout { grid-template-columns: 1fr; }
    }

    /* ── Avatar panel ────────────────────────────────────── */

    .avatar-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .panel-title {
      font-size: 11px;
      font-weight: bold;
      color: var(--text-label);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      align-self: flex-start;
    }

    /* ── Avatar wrap + aura (P5 future-effects structure) ── */

    .avatar-wrap {
      position: relative;
      display: inline-block;
      flex-shrink: 0;
    }

    /* Aura layer — currently only subtle glow for legendary.
       Idle bounce, pulse, etc. can be wired here later
       by adding CSS animations to .avatar-wrap[data-highest-rarity="legendary"] */
    .avatar-aura {
      position: absolute;
      inset: -10px;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
    }

    .avatar-wrap[data-highest-rarity="legendary"] .avatar-aura {
      background: radial-gradient(ellipse at 50% 40%, rgba(255,215,0,0.09) 0%, transparent 65%);
      opacity: 1;
    }

    .avatar-wrap[data-highest-rarity="rare"] .avatar-aura {
      background: radial-gradient(ellipse at 50% 40%, rgba(25,118,210,0.07) 0%, transparent 65%);
      opacity: 1;
    }

    /* Paper-doll canvas */
    #avatar-preview {
      position: relative;
      width: 160px;
      height: 240px;
      border-radius: 10px;
      background: radial-gradient(ellipse at 50% 30%, var(--avatar-inner) 0%, var(--avatar-outer) 100%);
      overflow: visible;
    }

    /* Preview border changes with highest-rarity equipped */
    .avatar-wrap[data-highest-rarity="legendary"] #avatar-preview {
      box-shadow: 0 0 0 2px rgba(255,215,0,0.5), 0 0 14px rgba(255,215,0,0.15);
    }

    .avatar-wrap[data-highest-rarity="rare"] #avatar-preview {
      box-shadow: 0 0 0 2px rgba(25,118,210,0.45), 0 0 10px rgba(25,118,210,0.12);
    }

    .avatar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* Synergy active badge (shown under slot list) */
    .synergy-active-badge {
      width: 100%;
      font-size: 10px;
      color: var(--synergy-text);
      text-align: center;
      padding: 5px 10px;
      background: var(--synergy-bg);
      border: 1px solid var(--synergy-border);
      border-radius: 8px;
      letter-spacing: 0.5px;
    }

    /* Slot status list */
    .slot-list {
      width: 100%;
    }

    .slot-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid var(--border-sep);
      gap: 8px;
    }

    .slot-row:last-child { border-bottom: none; }

    .slot-name {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      min-width: 54px;
      flex-shrink: 0;
    }

    .slot-item-name {
      font-size: 12px;
      color: var(--slot-text);
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    /* Rarity dot in slot list */
    .rarity-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .slot-empty {
      font-size: 12px;
      color: var(--text-faint);
      font-style: italic;
      text-align: right;
    }

    /* ── Inventory panel ─────────────────────────────────── */

    .inventory-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .inventory-panel .panel-title {
      margin-bottom: 14px;
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
      gap: 12px;
    }

    /* ── Item card ───────────────────────────────────────── */

    .item-card {
      position: relative;           /* needed for ::before/::after sparkles */
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      transition: border-color 0.12s, background 0.12s, box-shadow 0.12s;
    }

    .item-card.equipped {
      border-color: var(--border-equipped);
      background: var(--bg-card-eq);
    }

    /* Rarity borders + glows (P2) */
    .item-card[data-rarity="uncommon"] {
      border-color: var(--border-uncommon);
    }

    .item-card[data-rarity="rare"] {
      border-color: var(--border-rare);
      box-shadow: 0 0 10px rgba(25,118,210,0.2);
    }

    .item-card[data-rarity="legendary"] {
      border-color: var(--border-legendary);
      background: linear-gradient(160deg, #12102e 80%, #1c1400 100%);
      box-shadow: 0 0 16px rgba(255,160,0,0.2), inset 0 0 0 1px rgba(255,215,0,0.08);
    }

    .item-card[data-rarity="legendary"] .item-name {
      color: var(--coin);
    }

    .item-card.equipped[data-rarity="legendary"] {
      border-color: var(--border-legendary-eq);
      box-shadow: 0 0 22px rgba(255,179,0,0.35), 0 0 8px rgba(255,152,0,0.2);
    }

    /* Legendary sparkle corner accents (no animation — static) */
    .item-card[data-rarity="legendary"]::before {
      content: "✦";
      position: absolute;
      top: 5px;
      right: 7px;
      font-size: 9px;
      color: var(--coin);
      opacity: 0.65;
      pointer-events: none;
    }

    .item-card[data-rarity="legendary"]::after {
      content: "✦";
      position: absolute;
      bottom: 5px;
      left: 7px;
      font-size: 7px;
      color: var(--coin);
      opacity: 0.4;
      pointer-events: none;
    }

    .item-thumb {
      width: 88px;
      height: 88px;
      object-fit: contain;
      display: block;
      margin: 0 auto 8px;
      border-radius: 8px;
      background: var(--bg-panel);
    }

    .item-thumb-placeholder {
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-panel);
      border-radius: 8px;
      font-size: 32px;
      margin: 0 auto 8px;
    }

    .item-name {
      font-size: 13px;
      font-weight: bold;
      color: var(--text-main);
      margin-bottom: 5px;
      line-height: 1.2;
    }

    .rarity-badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      color: white;
      margin-bottom: 5px;
    }

    .slot-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* "Ny!" badge — positioned on .item-card (top-left of card padding area,
       to the left of the centered thumbnail, no SVG content overlap). */
    .badge-new {
      position: absolute;
      top: 5px;
      left: 5px;
      z-index: 10;
      background: var(--badge-new);
      color: white;
      font-size: 9px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      pointer-events: none;
      line-height: 1.4;
    }

    /* Synergy theme hint (P4) */
    .synergy-hint {
      font-size: 9px;
      color: var(--synergy-hint);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 7px;
      font-style: italic;
    }

    .equip-btn {
      display: block;
      width: 100%;
      padding: 7px 4px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      color: white;
      background: var(--accent);
      transition: opacity 0.1s;
    }

    .equip-btn:hover:not(:disabled) { opacity: 0.85; }

    .equip-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .unequip-btn {
      display: block;
      width: 100%;
      padding: 6px 4px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      color: var(--unequip-text);
      background: var(--unequip-bg);
      margin-top: 5px;
      transition: opacity 0.1s;
    }

    .unequip-btn:hover:not(:disabled) { opacity: 0.8; }

    .unequip-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .equipped-label {
      display: block;
      font-size: 11px;
      color: var(--success-text);
      font-weight: bold;
      margin-bottom: 4px;
    }

    .empty-state {
      color: var(--text-faint);
      font-size: 15px;
      padding: 32px 16px;
      text-align: center;
    }

    .empty-state a { color: var(--info-text); }

    /* ── Equip layer fade-in (animate=true path only) ─────── */
    @keyframes layerFadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to   { opacity: 1; transform: scale(1);    }
    }
    .layer-fade-in { animation: layerFadeIn 280ms ease both; }

    /* ── Legendary pulse on equip ─────────────────────────── */
    @keyframes legendaryPulse {
      0%   { box-shadow: none; }
      35%  { box-shadow: 0 0 0 8px rgba(255,215,0,0.38), 0 0 28px rgba(255,215,0,0.2); }
      100% { box-shadow: none; }
    }
    .legendary-pulse #avatar-preview { animation: legendaryPulse 600ms ease both; }

    /* ── Equipped item hover polish ───────────────────────── */
    .item-card.equipped:hover {
      border-color: var(--success-text);
      box-shadow: 0 0 14px rgba(76,175,80,0.28);
    }
    .item-card.equipped[data-rarity="legendary"]:hover {
      box-shadow: 0 0 26px rgba(255,179,0,0.45);
    }

    /* ── Titles panel ────────────────────────────────────── */

    .titles-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 18px;
    }

    .titles-panel .panel-title {
      margin-bottom: 12px;
    }

    .titles-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .title-equip-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--title-chip-common-border);
      background: var(--btn-bg);
      color: var(--title-chip-common-text);
      cursor: pointer;
      transition: opacity 0.1s, box-shadow 0.12s;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .title-equip-chip:hover:not(:disabled) { opacity: 0.82; }
    .title-equip-chip:disabled { opacity: 0.45; cursor: not-allowed; }

    .title-equip-chip--common   { border-color: var(--title-chip-common-border);    color: var(--title-chip-common-text); }
    .title-equip-chip--uncommon { border-color: var(--title-chip-uncommon-border);  color: var(--title-chip-uncommon-text); }
    .title-equip-chip--rare     { border-color: var(--title-chip-rare-border);      color: var(--title-chip-rare-text); }
    .title-equip-chip--legendary {
      border-color: var(--title-chip-legendary-border);
      color: var(--title-chip-legendary-text);
      box-shadow: 0 0 5px -1px var(--title-chip-legendary-border);
    }

    .title-equip-chip.active {
      outline: 2px solid var(--success-text);
      outline-offset: 1px;
    }

    .title-equip-chip-icon { font-size: 9px; opacity: 0.75; }

    .titles-empty {
      color: var(--text-faint);
      font-size: 13px;
      font-style: italic;
      padding: 4px 0;
    }
  </style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="window.location.href='hub.html'">&#8592; Tilbage</button>
  <h1>Min Avatar</h1>
  <span class="coins" id="coinBalance">&#x1FA99; ...</span>
</div>

<div class="layout">

  <!-- Left: paper-doll preview + slot status -->
  <div class="avatar-panel">
    <div class="panel-title">Preview</div>

    <!-- avatar-wrap holds aura + preview (P5 structure) -->
    <div class="avatar-wrap" id="avatarWrap" data-highest-rarity="">
      <div class="avatar-aura"></div>
      <div id="avatar-preview"><!-- layers injected by JS --></div>
    </div>

    <div class="slot-list" id="slotList"><!-- slot rows injected by JS --></div>
    <div class="synergy-active-badge" id="synergyBadge" style="display:none"></div>
  </div>

  <!-- Right: inventory -->
  <div class="inventory-panel">
    <div class="panel-title">Dine items</div>
    <div class="inventory-grid" id="inventoryGrid"></div>
    <p class="empty-state" id="emptyState" style="display:none">
      Du ejer ingen items endnu.<br>
      <a href="shop.html">Gå i butikken</a> for at købe noget!
    </p>
  </div>

</div>

<!-- Titles panel -->
<div class="titles-panel" id="titlesPanel">
  <div class="panel-title">Titler</div>
  <div class="titles-grid" id="titlesGrid"></div>
  <p class="titles-empty" id="titlesEmpty" style="display:none">Ingen titler optjent endnu.</p>
</div>

<script type="module">
import { supabase }    from "./supabaseClient.js";
import { showToast }   from "./js/toast.js";
import { playSound }   from "./js/audio.js";
import { emit }        from "./js/events.js";
import { initBadges, hasBadge } from "./js/newBadges.js";
import { loadTheme }   from "./js/themeManager.js";

// ── Auth ──────────────────────────────────────────────────────────────────────

const { data: sessionData } = await supabase.auth.getSession();
if (!sessionData.session) {
  window.location.replace("login.html");
  throw new Error("Unauthorized");
}

document.body.style.display = "block";

const userId = sessionData.session.user.id;

loadTheme().catch(() => {});

window.addEventListener("pageshow", async (event) => {
  if (event.persisted) {
    const { data } = await supabase.auth.getSession();
    if (!data.session) window.location.replace("login.html");
  }
});

// ── Constants ─────────────────────────────────────────────────────────────────

const RARITY_COLORS = {
  common:    "#757575",
  uncommon:  "#388e3c",
  rare:      "#1565c0",
  legendary: "#f57f17",
};

const RARITY_LABELS = {
  common:    "Almindelig",
  uncommon:  "Ualmindelig",
  rare:      "Sjælden",
  legendary: "Legendarisk",
};

const RARITY_ICONS = {
  common:    "○",
  uncommon:  "◆",
  rare:      "★",
  legendary: "✦",
};

const SLOT_LABELS = {
  body:    "Krop",
  shirt:   "Shirt",
  hat:     "Hat",
  glasses: "Briller",
  mask:    "Maske",
};

const SLOT_EMOJIS = {
  body:    "&#129411;",
  shirt:   "&#128085;",
  hat:     "&#127913;",
  glasses: "&#128083;",
  mask:    "&#127917;",
};

// Rendering order — base body is always z=0; items stack above it.
const SLOT_Z = { body: 1, shirt: 2, hat: 3, glasses: 4, mask: 5 };

// The slots shown in the preview status list (always, even if empty).
const ALL_SLOTS = ["body", "shirt", "hat", "glasses", "mask"];

const BASE_SRC = "/assets/avatar/base/body.svg";

// Rarity priority for avatar-wrap highest-rarity attribute (P5)
const RARITY_ORDER = ["legendary", "rare", "uncommon", "common"];

// Item → theme membership (P4). Items in the same theme can form a synergy.
// Themes only appear when 2+ items of the same theme are simultaneously equipped.
const ITEM_THEMES = {
  "armor-knight": "Ridder-sæt",
  "crown-golden": "Ridder-sæt",
  "wings-dragon": "Drage-sæt",
  "pirate-hat":   "Pirat-sæt",
  "panda-mask":   "Panda-sæt",
  "ninja-mask":   "Ninja-sæt",
  "hero-mask":    "Helte-sæt",
  "galaxy-cape":  "Galakse-sæt",
  "cape-red":     "Kappe-sæt",
  "crown-silver": "Is-sæt",
};

// ── In-memory state ───────────────────────────────────────────────────────────

let equippedSlots = {};  // { hat: "crown-golden", ... }
let ownedItems    = [];  // shop_item rows for all owned items

let activeTitleId  = null;
let ownedTitleIds  = new Set();
let allTitles      = [];

// ── Data loading ──────────────────────────────────────────────────────────────

async function loadAll() {
  // Coins
  const { data: progressData } = await supabase
    .from("student_progress")
    .select("coins")
    .eq("student_id", userId);

  const coins = progressData?.[0]?.coins ?? 0;
  document.getElementById("coinBalance").textContent = "🪙 " + coins;

  // Equipped slots + active title from profiles
  const { data: profileData } = await supabase
    .from("profiles")
    .select("equipped_slots, active_title")
    .eq("id", userId)
    .maybeSingle();

  equippedSlots = profileData?.equipped_slots ?? {};
  activeTitleId = profileData?.active_title ?? null;

  // Titles catalog + ownership in parallel
  const [titlesResult, userTitlesResult] = await Promise.all([
    supabase.from("titles").select("id, name, rarity"),
    supabase.from("user_titles").select("title_id").eq("user_id", userId)
  ]);
  allTitles     = titlesResult.data ?? [];
  ownedTitleIds = new Set((userTitlesResult.data ?? []).map(r => r.title_id));

  // Owned item IDs + purchase timestamps (for "Ny!" badge)
  const { data: userItems, error: uiError } = await supabase
    .from("user_items")
    .select("item_id")
    .eq("user_id", userId);

  if (uiError) {
    console.error("LOAD INVENTORY ERROR:", uiError);
    return;
  }

  const ownedIds = (userItems ?? []).map(r => r.item_id);

  if (ownedIds.length === 0) {
    ownedItems = [];
    renderAll();
    return;
  }

  // Shop metadata for owned items (includes slot_type, layer_order, image_url)
  const { data: shopItems, error: siError } = await supabase
    .from("shop_items")
    .select("id, name, rarity, slot_type, layer_order, image_url")
    .in("id", ownedIds);

  if (siError) {
    console.error("LOAD SHOP ITEMS ERROR:", siError);
    return;
  }

  ownedItems = shopItems ?? [];
  renderAll();
}

// ── Helpers ───────────────────────────────────────────────────────────────────

function getHighestRarity() {
  const equippedRarities = ALL_SLOTS
    .map(slot => equippedSlots[slot])
    .filter(Boolean)
    .map(id => ownedItems.find(i => i.id === id)?.rarity)
    .filter(Boolean);

  for (const r of RARITY_ORDER) {
    if (equippedRarities.includes(r)) return r;
  }
  return null;
}

function getActiveSynergy() {
  const equippedThemes = ALL_SLOTS
    .map(slot => equippedSlots[slot])
    .filter(Boolean)
    .map(id => ITEM_THEMES[id])
    .filter(Boolean);

  const counts = {};
  for (const t of equippedThemes) counts[t] = (counts[t] ?? 0) + 1;

  for (const [theme, count] of Object.entries(counts)) {
    if (count >= 2) return theme;
  }
  return null;
}

// ── Rendering ─────────────────────────────────────────────────────────────────

function renderAll(animate = false) {
  renderAvatar(animate);
  renderSlotList();
  renderInventory();
  renderTitles();
}

function renderAvatar(animate = false) {
  const preview = document.getElementById("avatar-preview");
  const wrap    = document.getElementById("avatarWrap");
  preview.innerHTML = "";

  // Layer 0: base body (always visible — never animated, always present)
  const base = document.createElement("img");
  base.className = "avatar-layer";
  base.src = BASE_SRC;
  base.style.zIndex = "0";
  base.alt = "";
  preview.appendChild(base);

  // One layer per equipped slot, ordered by z-index
  ALL_SLOTS.forEach(slot => {
    const itemId = equippedSlots[slot];
    if (!itemId) return;

    const item = ownedItems.find(i => i.id === itemId);
    if (!item || !item.image_url) return;

    const img = document.createElement("img");
    img.className = animate ? "avatar-layer layer-fade-in" : "avatar-layer";
    img.src = item.image_url;
    img.style.zIndex = String(SLOT_Z[slot] ?? 1);
    img.alt = item.name ?? "";
    preview.appendChild(img);
  });

  // Set highest rarity on wrap for CSS aura + border (P5)
  const highest = getHighestRarity() ?? "";
  if (wrap) {
    wrap.dataset.highestRarity = highest;
    if (animate && highest === "legendary") {
      wrap.classList.remove("legendary-pulse");
      void wrap.offsetWidth;
      wrap.classList.add("legendary-pulse");
      setTimeout(() => wrap.classList.remove("legendary-pulse"), 650);
    }
  }
}

function renderSlotList() {
  const list = document.getElementById("slotList");

  list.innerHTML = ALL_SLOTS.map(slot => {
    const itemId   = equippedSlots[slot];
    const item     = itemId ? ownedItems.find(i => i.id === itemId) : null;
    const label    = SLOT_LABELS[slot] ?? slot;
    const dotColor = item?.rarity ? (RARITY_COLORS[item.rarity] ?? null) : null;

    return `
      <div class="slot-row">
        <span class="slot-name">${label}</span>
        ${item
          ? `<span class="slot-item-name">
               ${dotColor ? `<span class="rarity-dot" style="background:${dotColor}"></span>` : ""}
               ${item.name}
             </span>`
          : `<span class="slot-empty">Tom</span>`}
      </div>
    `;
  }).join("");

  // Synergy badge (P4) — only when 2+ items of same theme are equipped
  const badge = document.getElementById("synergyBadge");
  if (badge) {
    const activeSynergy = getActiveSynergy();
    if (activeSynergy) {
      badge.textContent = "✨ " + activeSynergy + " aktiv";
      badge.style.display = "block";
    } else {
      badge.style.display = "none";
    }
  }
}

function renderInventory() {
  const grid       = document.getElementById("inventoryGrid");
  const emptyState = document.getElementById("emptyState");

  grid.innerHTML = "";

  if (ownedItems.length === 0) {
    emptyState.style.display = "block";
    return;
  }

  emptyState.style.display = "none";

  ownedItems.forEach(item => {
    const equippedIdForSlot = item.slot_type ? (equippedSlots[item.slot_type] ?? null) : null;
    const isEquipped        = equippedIdForSlot === item.id;
    const hasSlot           = !!item.slot_type;

    const rarityColor = RARITY_COLORS[item.rarity] ?? "#555";
    const rarityLabel = RARITY_LABELS[item.rarity] ?? (item.rarity ?? "");
    const slotLabel   = hasSlot ? (SLOT_LABELS[item.slot_type] ?? item.slot_type) : "—";
    const slotEmoji   = hasSlot ? (SLOT_EMOJIS[item.slot_type] ?? "") : "";

    const isNew     = hasBadge("avatar", item.id);
    const badgeHtml = isNew ? `<div class="badge-new">Ny!</div>` : "";

    // Synergy theme hint (P4) — shown on every item with a theme affiliation
    const theme    = ITEM_THEMES[item.id] ?? null;
    const themeHtml = theme
      ? `<div class="synergy-hint">&#9836; ${theme}</div>`
      : "";

    const thumbHtml = item.image_url
      ? `<img class="item-thumb" src="${item.image_url}" alt="${item.name ?? ""}">`
      : `<div class="item-thumb-placeholder">${slotEmoji || "?"}</div>`;

    let actionHtml;
    if (!hasSlot) {
      actionHtml = `<span style="font-size:11px;color:#444">Kan ikke udstyre</span>`;
    } else if (isEquipped) {
      actionHtml = `
        <span class="equipped-label">&#10003; Udstyret</span>
        <button class="unequip-btn" data-slot="${item.slot_type}">Fjern</button>
      `;
    } else {
      actionHtml = `<button class="equip-btn" data-item-id="${item.id}">Udstyr</button>`;
    }

    const card = document.createElement("div");
    card.className = "item-card" + (isEquipped ? " equipped" : "");
    card.dataset.rarity = item.rarity ?? "common";  // used by rarity CSS (P2)
    card.innerHTML = `
      ${badgeHtml}
      ${thumbHtml}
      <div class="item-name">${item.name}</div>
      <span class="rarity-badge" style="background:${rarityColor}">${rarityLabel}</span>
      <div class="slot-label">${slotEmoji} ${slotLabel}</div>
      ${themeHtml}
      ${actionHtml}
    `;
    grid.appendChild(card);
  });
}

function renderTitles() {
  const grid  = document.getElementById("titlesGrid");
  const empty = document.getElementById("titlesEmpty");
  if (!grid) return;

  const owned = allTitles.filter(t => ownedTitleIds.has(t.id));

  grid.innerHTML = "";

  if (owned.length === 0) {
    if (empty) empty.style.display = "block";
    return;
  }

  if (empty) empty.style.display = "none";

  owned.forEach(t => {
    const r      = t.rarity ?? "common";
    const icon   = RARITY_ICONS[r] ?? "○";
    const isActive = activeTitleId === t.id;

    const btn = document.createElement("button");
    btn.className = "title-equip-chip title-equip-chip--" + r + (isActive ? " active" : "");
    btn.dataset.titleId = t.id;
    btn.title = isActive ? "Klik for at fjerne titel" : "Klik for at udstyre";
    btn.innerHTML =
      `<span class="title-equip-chip-icon" aria-hidden="true">${icon}</span>` +
      `<span>${t.name}</span>`;
    grid.appendChild(btn);
  });
}

// ── Equip / Unequip ───────────────────────────────────────────────────────────

document.getElementById("inventoryGrid").addEventListener("click", async (e) => {
  const equipBtn   = e.target.closest(".equip-btn[data-item-id]");
  const unequipBtn = e.target.closest(".unequip-btn[data-slot]");

  if (equipBtn && !equipBtn.disabled) {
    equipBtn.disabled = true;
    equipBtn.textContent = "...";
    await handleEquip(equipBtn.dataset.itemId);
    return;
  }

  if (unequipBtn && !unequipBtn.disabled) {
    unequipBtn.disabled = true;
    unequipBtn.textContent = "...";
    await handleUnequip(unequipBtn.dataset.slot);
  }
});

document.getElementById("titlesGrid").addEventListener("click", async (e) => {
  const chip = e.target.closest(".title-equip-chip[data-title-id]");
  if (!chip || chip.disabled) return;
  chip.disabled = true;
  await handleEquipTitle(chip.dataset.titleId);
  chip.disabled = false;
});

async function handleEquip(itemId) {
  const { data, error } = await supabase.rpc("equip_item", { p_item_id: itemId });

  if (error) {
    console.error("EQUIP ERROR:", error);
    showToast("Kunne ikke udstyre – prøv igen", "error");
    playSound("error");
    renderInventory();
    return;
  }

  const slot = data?.slot ?? null;
  if (slot) {
    equippedSlots = { ...equippedSlots, [slot]: itemId };
  }

  const item = ownedItems.find(i => i.id === itemId);
  showToast("✓ " + (item?.name ?? "Item") + " udstyret", "success");
  playSound("equip");
  emit("item:equipped", { itemId, slot, rarity: item?.rarity ?? null });

  renderAll(true);
}

async function handleUnequip(slot) {
  const { error } = await supabase.rpc("unequip_item", { p_slot_type: slot });

  if (error) {
    console.error("UNEQUIP ERROR:", error);
    showToast("Kunne ikke fjerne – prøv igen", "error");
    playSound("error");
    renderInventory();
    return;
  }

  const next = { ...equippedSlots };
  delete next[slot];
  equippedSlots = next;

  playSound("unequip");
  emit("item:unequipped", { slot });
  renderAll(true);
}

async function handleEquipTitle(titleId) {
  const newId = activeTitleId === titleId ? null : titleId;

  const { error } = await supabase.rpc("set_active_title", { p_title_id: newId });

  if (error) {
    console.error("SET TITLE ERROR:", error);
    showToast("Kunne ikke skifte titel – prøv igen", "error");
    playSound("error");
    return;
  }

  activeTitleId = newId;

  if (newId === null) {
    showToast("Titel fjernet", "success");
  } else {
    const titleDef = allTitles.find(t => t.id === newId);
    showToast("✓ " + (titleDef?.name ?? newId) + " udstyret", "success");
    playSound("equip");
  }

  renderTitles();
}

// ── Init ──────────────────────────────────────────────────────────────────────

initBadges("avatar");
await loadAll();
</script>
