<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <!-- Section 152D: braid hairstyle — left side-braid.
       Same cap + bang as default for visual continuity; left panel extends
       into a braid strand falling to y≈140 (upper chest). Right panel is
       the same short panel as default. Hair slot z=4: above expressions
       (z=0), below headwear (z=5). Head anchor cx=80 cy=50 r=30 LOCKED. -->

  <!-- Right side panel — same as default, short -->
  <path d="M 108 44 Q 113 49 113 59 Q 112 64 107 61 Q 104 56 105 50 Z" fill="#4a3626"/>

  <!-- Main hair cap — same peak as default (left-dominant crown at (66,9)) -->
  <path d="M 52 44 Q 46 11 66 9 Q 78 9 90 15 Q 100 19 108 44 Q 98 28 80 28 Q 62 28 52 44 Z"
        fill="#4a3626"/>

  <!-- Hair specular — same ridge as default -->
  <path d="M 55 22 Q 65 16 82 21" fill="none" stroke="#7d5c44" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>

  <!-- Left braid strand: side panel continues below ear into a tapered braid -->
  <path d="M 52 44 Q 43 51 43 68 Q 43 82 44 97 Q 44 112 45 124
           Q 45 134 48 140 Q 50 144 53 141 Q 56 138 55 128
           Q 54 116 54 103 Q 55 89 54 74 Q 54 62 57 52 Z"
        fill="#4a3626"/>

  <!-- Braid weave marks — subtle cross-strokes suggesting plait texture -->
  <path d="M 44  89 Q 48  87 54  89" fill="none" stroke="#7d5c44" stroke-width="0.9" stroke-linecap="round" opacity="0.4"/>
  <path d="M 44 103 Q 48 101 54 103" fill="none" stroke="#7d5c44" stroke-width="0.9" stroke-linecap="round" opacity="0.4"/>
  <path d="M 44 117 Q 48 115 54 117" fill="none" stroke="#7d5c44" stroke-width="0.9" stroke-linecap="round" opacity="0.4"/>
  <path d="M 45 130 Q 49 128 54 130" fill="none" stroke="#7d5c44" stroke-width="0.9" stroke-linecap="round" opacity="0.4"/>

  <!-- Braid tie — small accent at strand tip -->
  <ellipse cx="51" cy="143" rx="4" ry="2.5" fill="#3a2718" opacity="0.85"/>

  <!-- Right catch-light only (left side has braid strand) -->
  <path d="M 108 44 Q 110 51 109 57" fill="none" stroke="#6b4a33" stroke-width="1.4" stroke-linecap="round" opacity="0.38"/>

  <!-- Forward-swept bang — same iconic style hook as default -->
  <path d="M 58 37 Q 64 26 74 24 Q 81 23 82 29 Q 79 35 72 37 Q 65 38 58 37 Z" fill="#4a3626"/>
  <path d="M 61 30 Q 68 24 77 26" fill="none" stroke="#7d5c44" stroke-width="1.1" stroke-linecap="round" opacity="0.4"/>
</svg>
