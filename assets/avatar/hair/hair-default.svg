<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <!-- Section 152B: default hair — decoupled from body.svg and the expression
       SVGs. Renders as the identity hair layer on the hair slot z-level (z=4):
       above the expression overlay (z=0), below headwear (z=5).
       Paths are EXACT copies of the pre-152B hair (Section 64 iconic identity
       redesign) — pixel-identical by construction. Same 160x240 viewBox;
       head sphere anchor cx=80 cy=50 r=30 (POSITION LOCKED). -->

  <!-- Side panels — drawn before cap so cap's outer edge reads as dominant silhouette -->
  <path d="M 52 44 Q 43 51 43 67 Q 44 76 52 72 Q 57 63 57 52 Z" fill="#4a3626"/>
  <path d="M 108 44 Q 113 49 113 59 Q 112 64 107 61 Q 104 56 105 50 Z" fill="#4a3626"/>

  <!-- Main hair cap — left-dominant crown: peak at (66,9) -->
  <path d="M 52 44 Q 46 11 66 9 Q 78 9 90 15 Q 100 19 108 44 Q 98 28 80 28 Q 62 28 52 44 Z"
        fill="#4a3626"/>

  <!-- Hair specular: peak tracks to (65,16) -->
  <path d="M 55 22 Q 65 16 82 21" fill="none" stroke="#7d5c44" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>

  <!-- Catch-lights: left follows wider panel; right follows shorter panel -->
  <path d="M 52 44 Q 47 52 46 68" fill="none" stroke="#6b4a33" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
  <path d="M 108 44 Q 110 51 109 57" fill="none" stroke="#6b4a33" stroke-width="1.4" stroke-linecap="round" opacity="0.38"/>

  <!-- Forward-swept bang — the character's permanent iconic style hook -->
  <path d="M 58 37 Q 64 26 74 24 Q 81 23 82 29 Q 79 35 72 37 Q 65 38 58 37 Z" fill="#4a3626"/>
  <!-- Bang surface highlight: follows the sweep ridge direction -->
  <path d="M 61 30 Q 68 24 77 26" fill="none" stroke="#7d5c44" stroke-width="1.1" stroke-linecap="round" opacity="0.4"/>
</svg>
