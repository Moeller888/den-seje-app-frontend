<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <!-- Section 153A: sidecut hairstyle — asymmetric, full left, shaved right.
       Cap covers crown + left half; right side terminates at x≈93 y≈38,
       leaving the right side of the head bare (shaved effect). Left panel
       and bang are identical to default. Hair slot z=4. Head anchor LOCKED. -->

  <!-- Left panel — identical to default -->
  <path d="M 52 44 Q 43 51 43 67 Q 44 76 52 72 Q 57 63 57 52 Z" fill="#4a3626"/>
  <!-- Asymmetric cap — full over crown, sharp termination on right at ~x=93 y=38 -->
  <path d="M 52 44 Q 46 11 66 9 Q 78 9 90 15 Q 96 20 93 38
           Q 88 36 80 32 Q 68 30 59 32 Q 55 36 52 44 Z" fill="#4a3626"/>
  <!-- Specular — left-dominant (shorter than default, stops before shaved side) -->
  <path d="M 55 22 Q 65 16 79 20" fill="none" stroke="#7d5c44" stroke-width="1.6" stroke-linecap="round" opacity="0.50"/>
  <!-- Left catch-light only — no right panel to catch light on -->
  <path d="M 52 44 Q 47 52 46 68" fill="none" stroke="#6b4a33" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
  <!-- Bang — identical to default (left-dominant positioning) -->
  <path d="M 58 37 Q 64 26 74 24 Q 81 23 82 29 Q 79 35 72 37 Q 65 38 58 37 Z" fill="#4a3626"/>
  <path d="M 61 30 Q 68 24 77 26" fill="none" stroke="#7d5c44" stroke-width="1.1" stroke-linecap="round" opacity="0.40"/>
</svg>
