<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <!-- C2 HAIR — "ponytail" (Section 155D). Token-recolor per Hair Color Decision v1.0:
       fill="var(--hair-base)" / "var(--hair-shadow)". NO hardcoded hair colours.
       Anchors: head cx=80 cy=50 r=30. Swept-back crown, hairline above eye anchor
       (cy=47), lowest central ~y37. Tail falls on the right to ~y123.
       Eyes never covered. Crown compressible later. Full state only. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- tail (behind crown, right side) -->
    <path d="M 103 41 Q 117 51 117 82 Q 117 106 108 123 Q 105 110 103 90 Q 101 64 98 50 Q 100 45 103 41 Z"
          fill="var(--hair-base)" stroke="var(--hair-shadow)" stroke-width="2.2"/>
    <!-- swept-back crown cap -->
    <path d="M 52 52 Q 50 28 70 21 Q 80 18 90 21 Q 110 28 108 52 Q 100 39 80 37 Q 60 39 52 52 Z"
          fill="var(--hair-base)" stroke="var(--hair-shadow)" stroke-width="2.2"/>
    <!-- tie band -->
    <path d="M 99 41 Q 107 41 107 47 Q 99 50 98 47 Z" fill="var(--hair-shadow)"/>
    <!-- single flat shadow: right of tail + right crown -->
    <path d="M 110 55 Q 117 70 117 82 Q 117 106 108 123 Q 105 110 104 92 Q 108 70 110 55 Z"
          fill="var(--hair-shadow)"/>
    <path d="M 90 21 Q 110 28 108 52 Q 100 39 90 37 Q 92 30 90 21 Z"
          fill="var(--hair-shadow)"/>
  </g>
</svg>
