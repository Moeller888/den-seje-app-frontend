<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <!-- C2 HAIR — "curly" (Section 155D). Token-recolor per Hair Color Decision v1.0:
       fill="var(--hair-base)" / "var(--hair-shadow)". NO hardcoded hair colours.
       Anchors: head cx=80 cy=50 r=30. Inner hairline above eye anchor (cy=47),
       lowest central ~y34. Zone y[8,72] x[40,120]; eyes never covered.
       Distinct bumpy crown → later compressed-state can flatten. Full state only. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- base silhouette: rounded bumpy curls, wider than head -->
    <path d="M 48 60 Q 40 50 45 39 Q 40 29 51 26 Q 52 15 65 19 Q 71 11 81 16 Q 91 11 98 20 Q 111 19 110 32 Q 117 41 109 50 Q 113 58 103 61 Q 99 43 87 37 Q 80 33 71 37 Q 57 44 48 60 Z"
          fill="var(--hair-base)" stroke="var(--hair-shadow)" stroke-width="2.2"/>
    <!-- single flat shadow: right curls -->
    <path d="M 98 20 Q 111 19 110 32 Q 117 41 109 50 Q 113 58 103 61 Q 99 43 87 37 Q 92 33 98 20 Z"
          fill="var(--hair-shadow)"/>
  </g>
</svg>
