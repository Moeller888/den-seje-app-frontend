<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <!-- Section 152D: short hairstyle — close-cropped, no extended side panels,
       no forward bang. Distinct silhouette: rounded cap ending at ear level
       (~y=62), symmetrical coverage, no hanging strands.
       Hair slot z=4: above expressions (z=0), below headwear (z=5).
       Head anchor cx=80 cy=50 r=30 LOCKED. -->

  <!-- Short left panel — minimal coverage, ends at ear level -->
  <path d="M 54 47 Q 48 52 48 60 Q 49 65 53 63 Q 56 59 57 52 Z" fill="#4a3626"/>

  <!-- Short right panel — minimal, symmetric -->
  <path d="M 107 47 Q 112 52 112 60 Q 111 65 107 63 Q 105 59 106 52 Z" fill="#4a3626"/>

  <!-- Short cap — tighter, more uniform coverage than default; no bang -->
  <path d="M 54 47 Q 48 14 68 10 Q 80 9 92 14 Q 105 20 107 47 Q 97 32 80 32 Q 63 32 54 47 Z"
        fill="#4a3626"/>

  <!-- Specular highlight — slightly shifted for this rounder cap shape -->
  <path d="M 57 22 Q 68 15 84 20" fill="none" stroke="#7d5c44" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>

  <!-- Catch-lights: both sides, short -->
  <path d="M 54 47 Q 50 53 49 59" fill="none" stroke="#6b4a33" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
  <path d="M 107 47 Q 110 52 109 57" fill="none" stroke="#6b4a33" stroke-width="1.4" stroke-linecap="round" opacity="0.38"/>
</svg>
