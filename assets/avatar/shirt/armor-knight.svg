<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <!-- Chest plate — matches new body torso x=48–112 (slight 2px outset for armor feel) -->
  <rect x="46" y="92" width="68" height="88" rx="10" fill="#546e7a" stroke="#37474f" stroke-width="2"/>
  <!-- Chest highlight panel -->
  <rect x="58" y="106" width="44" height="58" rx="6" fill="#607d8b" stroke="#455a64" stroke-width="1.5"/>
  <!-- Panel top highlight -->
  <rect x="58" y="106" width="44" height="8" rx="6" fill="#78909c" opacity="0.45"/>
  <!-- Cross emblem (shield motif) -->
  <rect x="76" y="112" width="8" height="26" rx="2" fill="#37474f" opacity="0.65"/>
  <rect x="66" y="120" width="28" height="8" rx="2" fill="#37474f" opacity="0.65"/>
  <!-- Vertical center seam -->
  <line x1="80" y1="106" x2="80" y2="162" stroke="#37474f" stroke-width="1.5" opacity="0.7"/>
  <!-- Horizontal ribs -->
  <line x1="58" y1="126" x2="102" y2="126" stroke="#455a64" stroke-width="1.2"/>
  <line x1="58" y1="142" x2="102" y2="142" stroke="#455a64" stroke-width="1.2"/>
  <line x1="58" y1="156" x2="102" y2="156" stroke="#455a64" stroke-width="1.2"/>
  <!-- Belt — matches new body width x=48–112 -->
  <rect x="48" y="174" width="64" height="8" rx="4" fill="#263238"/>
  <!-- Belt buckle -->
  <rect x="74" y="174" width="12" height="8" rx="2" fill="#ffd600"/>
  <circle cx="80" cy="178" r="2.5" fill="#ff8f00"/>
  <!-- Left pauldron — centered over new arm/gap junction -->
  <ellipse cx="28" cy="106" rx="18" ry="14" fill="#546e7a" stroke="#37474f" stroke-width="1.5"/>
  <ellipse cx="27" cy="103" rx="11" ry="7" fill="#607d8b" opacity="0.55"/>
  <!-- Right pauldron -->
  <ellipse cx="132" cy="106" rx="18" ry="14" fill="#546e7a" stroke="#37474f" stroke-width="1.5"/>
  <ellipse cx="133" cy="103" rx="11" ry="7" fill="#607d8b" opacity="0.55"/>
  <!-- Left arm plate — matches new left arm x=10–30 -->
  <rect x="10" y="119" width="20" height="52" rx="9" fill="#546e7a" stroke="#37474f" stroke-width="1.5"/>
  <!-- Right arm plate — matches new right arm x=130–150 -->
  <rect x="130" y="119" width="20" height="52" rx="9" fill="#546e7a" stroke="#37474f" stroke-width="1.5"/>
  <!-- Arm highlights -->
  <rect x="13" y="123" width="7" height="22" rx="4" fill="#78909c" opacity="0.5"/>
  <rect x="141" y="123" width="7" height="22" rx="4" fill="#78909c" opacity="0.5"/>
  <!-- Elbow guards -->
  <ellipse cx="20" cy="150" rx="10" ry="6" fill="#546e7a" stroke="#37474f" stroke-width="1"/>
  <ellipse cx="140" cy="150" rx="10" ry="6" fill="#546e7a" stroke="#37474f" stroke-width="1"/>
</svg>
