<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <defs>
    <!-- Chest plate: directional light from upper-left -->
    <linearGradient id="ak-plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#78909c"/>
      <stop offset="40%"  stop-color="#546e7a"/>
      <stop offset="100%" stop-color="#37474f"/>
    </linearGradient>
    <linearGradient id="ak-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8ea8b2"/>
      <stop offset="100%" stop-color="#546e7a"/>
    </linearGradient>
    <linearGradient id="ak-arm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#78909c"/>
      <stop offset="100%" stop-color="#37474f"/>
    </linearGradient>
    <linearGradient id="ak-armR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#78909c"/>
      <stop offset="100%" stop-color="#37474f"/>
    </linearGradient>
  </defs>

  <!-- Chest plate base — gradient lit from upper-left -->
  <rect x="40" y="92" width="80" height="88" rx="10" fill="url(#ak-plate)" stroke="#263238" stroke-width="1.5"/>
  <!-- Chest rim highlight — left edge catch-light -->
  <line x1="40" y1="96" x2="40" y2="174" stroke="#b0bec5" stroke-width="1.2" opacity="0.55"/>
  <!-- Chest highlight panel -->
  <rect x="56" y="106" width="48" height="58" rx="6" fill="url(#ak-panel)" stroke="#455a64" stroke-width="1.2"/>
  <!-- Panel top highlight -->
  <rect x="56" y="106" width="48" height="7" rx="5" fill="#cfd8dc" opacity="0.35"/>
  <!-- Heraldic sunburst on chest panel — 8-ray radiant, more identity than a plain cross -->
  <!-- Sunburst rays: dark base -->
  <line x1="80" y1="118" x2="80" y2="108" stroke="#263238" stroke-width="1.8" opacity="0.65"/>
  <line x1="80" y1="118" x2="88" y2="110" stroke="#263238" stroke-width="1.4" opacity="0.55"/>
  <line x1="80" y1="118" x2="90" y2="118" stroke="#263238" stroke-width="1.4" opacity="0.55"/>
  <line x1="80" y1="118" x2="88" y2="126" stroke="#263238" stroke-width="1.4" opacity="0.55"/>
  <line x1="80" y1="118" x2="80" y2="128" stroke="#263238" stroke-width="1.8" opacity="0.65"/>
  <line x1="80" y1="118" x2="72" y2="126" stroke="#263238" stroke-width="1.4" opacity="0.55"/>
  <line x1="80" y1="118" x2="70" y2="118" stroke="#263238" stroke-width="1.4" opacity="0.55"/>
  <line x1="80" y1="118" x2="72" y2="110" stroke="#263238" stroke-width="1.4" opacity="0.55"/>
  <!-- Center medallion -->
  <circle cx="80" cy="118" r="5.5" fill="#546e7a" stroke="#263238" stroke-width="1"/>
  <circle cx="80" cy="118" r="3"   fill="#b0bec5"/>
  <!-- Medallion shine -->
  <circle cx="79" cy="117" r="1.2" fill="white" opacity="0.55"/>
  <!-- Sunburst catch-light on top rays (upper-left light) -->
  <line x1="80" y1="118" x2="72" y2="110" stroke="#b0bec5" stroke-width="0.8" opacity="0.4"/>
  <line x1="80" y1="118" x2="80" y2="108" stroke="#b0bec5" stroke-width="0.8" opacity="0.4"/>

  <!-- Vertical center seam -->
  <line x1="80" y1="106" x2="80" y2="162" stroke="#37474f" stroke-width="1.2" opacity="0.6"/>
  <!-- Horizontal ribs -->
  <line x1="56" y1="134" x2="104" y2="134" stroke="#455a64" stroke-width="1.1"/>
  <line x1="56" y1="148" x2="104" y2="148" stroke="#455a64" stroke-width="1.1"/>
  <line x1="56" y1="158" x2="104" y2="158" stroke="#455a64" stroke-width="1.1"/>
  <!-- Belt -->
  <rect x="40" y="174" width="80" height="8" rx="4" fill="#1c2a30"/>
  <!-- Belt edge trim — finished construction, not raw -->
  <line x1="40" y1="175" x2="120" y2="175" stroke="#37474f" stroke-width="0.7" opacity="0.6"/>
  <!-- Belt buckle -->
  <rect x="74" y="174" width="12" height="8" rx="2" fill="#ffd600"/>
  <circle cx="80" cy="178" r="2.5" fill="#ff8f00"/>
  <circle cx="79" cy="177" r="0.9" fill="white" opacity="0.5"/>

  <!-- Left pauldron — gradient -->
  <ellipse cx="29" cy="106" rx="20" ry="15" fill="url(#ak-plate)" stroke="#263238" stroke-width="1.2"/>
  <!-- Pauldron rim light — top edge -->
  <path d="M 12 101 Q 29 95 46 101" fill="none" stroke="#b0bec5" stroke-width="0.9" opacity="0.5"/>
  <ellipse cx="27" cy="103" rx="12" ry="7" fill="#78909c" opacity="0.4"/>

  <!-- Right pauldron -->
  <ellipse cx="131" cy="106" rx="20" ry="15" fill="url(#ak-plate)" stroke="#263238" stroke-width="1.2"/>
  <path d="M 114 101 Q 131 95 148 101" fill="none" stroke="#b0bec5" stroke-width="0.9" opacity="0.5"/>
  <ellipse cx="133" cy="103" rx="12" ry="7" fill="#78909c" opacity="0.4"/>

  <!-- Left arm plate — gradient left→right (light hits left face) -->
  <rect x="12" y="119" width="22" height="52" rx="9" fill="url(#ak-arm)" stroke="#263238" stroke-width="1.2"/>
  <!-- Left arm rim light -->
  <line x1="12" y1="123" x2="12" y2="167" stroke="#b0bec5" stroke-width="1" opacity="0.45"/>
  <rect x="15" y="123" width="7" height="20" rx="4" fill="#90a4ae" opacity="0.4"/>

  <!-- Right arm plate — mirrored gradient -->
  <rect x="126" y="119" width="22" height="52" rx="9" fill="url(#ak-armR)" stroke="#263238" stroke-width="1.2"/>
  <line x1="148" y1="123" x2="148" y2="167" stroke="#b0bec5" stroke-width="1" opacity="0.45"/>
  <rect x="137" y="123" width="7" height="20" rx="4" fill="#90a4ae" opacity="0.4"/>

  <!-- Elbow guards -->
  <ellipse cx="23"  cy="150" rx="10" ry="6" fill="url(#ak-plate)" stroke="#263238" stroke-width="0.9"/>
  <ellipse cx="137" cy="150" rx="10" ry="6" fill="url(#ak-plate)" stroke="#263238" stroke-width="0.9"/>
</svg>
