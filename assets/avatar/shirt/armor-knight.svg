<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <!-- Chest plate -->
  <rect x="40" y="92" width="80" height="88" rx="10" fill="#607d8b" stroke="#455a64" stroke-width="2"/>
  <!-- Chest highlight panel -->
  <rect x="56" y="106" width="48" height="46" rx="6" fill="#78909c" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Vertical center line -->
  <line x1="80" y1="106" x2="80" y2="152" stroke="#455a64" stroke-width="2"/>
  <!-- Horizontal ribs -->
  <line x1="56" y1="120" x2="104" y2="120" stroke="#546e7a" stroke-width="1.5"/>
  <line x1="56" y1="134" x2="104" y2="134" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Belt -->
  <rect x="40" y="174" width="80" height="9" rx="4" fill="#37474f"/>
  <rect x="74" y="174" width="12" height="9" fill="#ffd600" rx="2"/>
  <!-- Left pauldron -->
  <ellipse cx="30" cy="106" rx="20" ry="14" fill="#607d8b" stroke="#455a64" stroke-width="1.5"/>
  <!-- Right pauldron -->
  <ellipse cx="130" cy="106" rx="20" ry="14" fill="#607d8b" stroke="#455a64" stroke-width="1.5"/>
  <!-- Left arm plate -->
  <rect x="13" y="118" width="24" height="52" rx="10" fill="#607d8b" stroke="#455a64" stroke-width="1.5"/>
  <!-- Right arm plate -->
  <rect x="123" y="118" width="24" height="52" rx="10" fill="#607d8b" stroke="#455a64" stroke-width="1.5"/>
  <!-- Arm highlights -->
  <rect x="16" y="122" width="8" height="20" rx="4" fill="#78909c" opacity="0.6"/>
  <rect x="136" y="122" width="8" height="20" rx="4" fill="#78909c" opacity="0.6"/>
</svg>
