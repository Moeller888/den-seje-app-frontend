<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <defs>
    <linearGradient id="gx-cloth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1b4d"/>
      <stop offset="100%" stop-color="#050916"/>
    </linearGradient>
    <linearGradient id="gx-nebula" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a1b9a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1565c0" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- ═══ CONTINUOUS BACK CLOTH ═══
       One unified shape. Body (z=0) sits on top and occludes naturally.
       Stars and nebula placed in the genuinely visible side zones. -->
  <path d="M 46 90 L 10 100 L 10 236 Q 80 239 150 236 L 150 100 L 114 90 Q 80 82 46 90 Z"
        fill="url(#gx-cloth)"/>

  <!-- Left visible zone: beside left arm (x=10–14 thin) + beside left leg (x=10–48) -->
  <ellipse cx="22" cy="206" rx="12" ry="22" fill="url(#gx-nebula)"/>
  <circle cx="16" cy="183" r="1.2" fill="white" opacity="0.85"/>
  <circle cx="28" cy="196" r="1"   fill="white" opacity="0.8"/>
  <circle cx="14" cy="212" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="24" cy="226" r="1"   fill="white" opacity="0.8"/>
  <circle cx="18" cy="232" r="0.8" fill="white" opacity="0.75"/>

  <!-- Right visible zone: beside right arm (x=146–150 thin) + beside right leg (x=112–150) -->
  <ellipse cx="138" cy="206" rx="12" ry="22" fill="url(#gx-nebula)"/>
  <circle cx="144" cy="183" r="1.2" fill="white" opacity="0.85"/>
  <circle cx="132" cy="196" r="1"   fill="white" opacity="0.8"/>
  <circle cx="146" cy="212" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="136" cy="226" r="1"   fill="white" opacity="0.8"/>
  <circle cx="142" cy="232" r="0.8" fill="white" opacity="0.75"/>

  <!-- ═══ COLLAR — brighter overlay, visible in neck gap zones ═══ -->
  <path d="M 46 88 Q 80 76 114 88 Q 106 94 80 96 Q 54 94 46 88 Z" fill="#2a0a4a"/>
  <path d="M 46 88 Q 80 76 114 88" fill="none" stroke="#ffd700" stroke-width="1.2"/>
  <!-- Stars on collar wings -->
  <circle cx="56"  cy="86" r="1" fill="white" opacity="0.75"/>
  <circle cx="104" cy="86" r="1" fill="white" opacity="0.75"/>
  <!-- Clasp -->
  <circle cx="80" cy="86" r="5.5" fill="#ffd700" stroke="#f9a825" stroke-width="1.2"/>
  <circle cx="80" cy="86" r="2.8" fill="#ff8f00"/>
  <circle cx="79" cy="85" r="1"   fill="white" opacity="0.7"/>
</svg>
