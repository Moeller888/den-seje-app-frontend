<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <defs>
    <linearGradient id="gx-tail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#0a0e2e"/>
    </linearGradient>
    <linearGradient id="gx-nebula" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a1b9a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1565c0" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- ═══ LOWER EMERGENCE — cape reappears beside legs after flowing behind body ═══ -->
  <!-- Left tail — outside left leg (x=48), y=178–236 -->
  <path d="M 48 178 Q 46 210 46 234 L 30 236 Q 28 208 30 178 Z"
        fill="url(#gx-tail)"/>
  <!-- Nebula cloud in left tail -->
  <ellipse cx="38" cy="208" rx="9" ry="16" fill="url(#gx-nebula)"/>
  <!-- Stars in left tail -->
  <circle cx="40" cy="190" r="1.2" fill="white" opacity="0.85"/>
  <circle cx="34" cy="206" r="1"   fill="white" opacity="0.8"/>
  <circle cx="42" cy="220" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="36" cy="232" r="0.8" fill="white" opacity="0.75"/>

  <!-- Right tail — outside right leg (x=112), y=178–236 -->
  <path d="M 112 178 Q 114 210 114 234 L 130 236 Q 132 208 130 178 Z"
        fill="url(#gx-tail)"/>
  <!-- Nebula cloud in right tail -->
  <ellipse cx="122" cy="208" rx="9" ry="16" fill="url(#gx-nebula)"/>
  <!-- Stars in right tail -->
  <circle cx="120" cy="190" r="1.2" fill="white" opacity="0.85"/>
  <circle cx="126" cy="206" r="1"   fill="white" opacity="0.8"/>
  <circle cx="118" cy="220" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="124" cy="232" r="0.8" fill="white" opacity="0.75"/>

  <!-- Gold hem arc -->
  <path d="M 30 236 Q 80 239 130 236"
        fill="none" stroke="#ffd700" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

  <!-- ═══ COLLAR — dark attachment at neck, visible y=76–96 ═══ -->
  <path d="M 46 88 Q 80 76 114 88 Q 106 94 80 96 Q 54 94 46 88 Z" fill="#2a0a4a"/>
  <path d="M 46 88 Q 80 76 114 88" fill="none" stroke="#ffd700" stroke-width="1.2"/>
  <!-- Stars on collar wings -->
  <circle cx="56"  cy="86" r="1" fill="white" opacity="0.75"/>
  <circle cx="104" cy="86" r="1" fill="white" opacity="0.75"/>
  <!-- Clasp -->
  <circle cx="80" cy="86" r="5.5" fill="#ffd700" stroke="#f9a825" stroke-width="1.2"/>
  <circle cx="80" cy="86" r="2.8" fill="#ff8f00"/>
  <circle cx="79" cy="85" r="1"   fill="white" opacity="0.7"/>
</svg>
