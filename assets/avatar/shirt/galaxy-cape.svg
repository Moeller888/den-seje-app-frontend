<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <defs>
    <linearGradient id="gx-cloth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0d1b4d"/>
      <stop offset="50%"  stop-color="#0a1230"/>
      <stop offset="100%" stop-color="#020509"/>
    </linearGradient>
    <radialGradient id="gx-nebL" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="gx-nebR" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4f46e5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0e1e6e" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- Continuous back cloth — body (z=0) occludes naturally -->
  <path d="M 46 90 L 10 100 L 10 235 Q 80 237 150 235 L 150 100 L 114 90 Q 80 82 46 90 Z"
        fill="url(#gx-cloth)"/>

  <!-- Center drape fold — weightless cosmic fabric still has subtle gravity -->
  <path d="M 80 97 Q 78 166 79 233 Q 80 236 81 233 Q 82 166 80 97 Z"
        fill="#7c3aed" opacity="0.06"/>

  <!-- Horizontal tension folds — cloth wraps around body plane, same physics as cape-red -->
  <path d="M 12 148 Q 40 142 68 144" fill="none" stroke="#4f46e5" stroke-width="0.6" opacity="0.15"/>
  <path d="M 92 144 Q 120 142 148 148" fill="none" stroke="#4f46e5" stroke-width="0.6" opacity="0.15"/>
  <!-- Lower tension fold — cloth billows slightly -->
  <path d="M 10 188 Q 38 184 68 185" fill="none" stroke="#4f46e5" stroke-width="0.5" opacity="0.12"/>
  <path d="M 92 185 Q 122 184 150 188" fill="none" stroke="#4f46e5" stroke-width="0.5" opacity="0.12"/>

  <!-- Hem edge: dark cosmic trim — finished garment, not raw -->
  <path d="M 10 233 Q 80 237 150 233" fill="none" stroke="#020509" stroke-width="1.5" opacity="0.5"/>

  <!-- Shoulder creases: cloth compresses at shoulder attachment point — implies structure beneath -->
  <path d="M 46 90 Q 58 93 70 96" fill="none" stroke="#4f46e5" stroke-width="0.7" opacity="0.30"/>
  <path d="M 114 90 Q 102 93 90 96" fill="none" stroke="#4f46e5" stroke-width="0.7" opacity="0.30"/>
  <!-- Shoulder tension shadows: cloth wraps around shoulder corner, darker beneath -->
  <path d="M 46 90 Q 42 96 44 106 Q 48 108 52 104 Q 56 96 46 90 Z" fill="#05001a" opacity="0.20"/>
  <path d="M 114 90 Q 118 96 116 106 Q 112 108 108 104 Q 104 96 114 90 Z" fill="#05001a" opacity="0.20"/>

  <!-- Left nebula cloud — radial glow in lower visible zone -->
  <ellipse cx="22" cy="206" rx="18" ry="28" fill="url(#gx-nebL)"/>
  <!-- Left stars — size hierarchy: anchor → medium → dust -->
  <circle cx="14" cy="212" r="1.8" fill="white" opacity="0.95"/>
  <circle cx="26" cy="198" r="1.3" fill="white" opacity="0.85"/>
  <circle cx="16" cy="183" r="1.2" fill="white" opacity="0.82"/>
  <circle cx="28" cy="222" r="1.0" fill="white" opacity="0.78"/>
  <circle cx="18" cy="232" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="20" cy="174" r="0.7" fill="white" opacity="0.6"/>
  <!-- Left constellation line -->
  <line x1="14" y1="212" x2="26" y2="198" stroke="white" stroke-width="0.4" opacity="0.18"/>
  <!-- Left upper-arm zone stars — galaxy extends into the arm-adjacent visible cloth band -->
  <circle cx="16" cy="138" r="0.9" fill="white" opacity="0.55"/>
  <circle cx="24" cy="122" r="0.7" fill="white" opacity="0.45"/>
  <circle cx="12" cy="158" r="0.8" fill="white" opacity="0.5"/>

  <!-- Right nebula cloud -->
  <ellipse cx="138" cy="206" rx="18" ry="28" fill="url(#gx-nebR)"/>
  <!-- Right stars -->
  <circle cx="146" cy="212" r="1.8" fill="white" opacity="0.95"/>
  <circle cx="134" cy="198" r="1.3" fill="white" opacity="0.85"/>
  <circle cx="144" cy="183" r="1.2" fill="white" opacity="0.82"/>
  <circle cx="132" cy="222" r="1.0" fill="white" opacity="0.78"/>
  <circle cx="142" cy="232" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="140" cy="174" r="0.7" fill="white" opacity="0.6"/>
  <line x1="146" y1="212" x2="134" y2="198" stroke="white" stroke-width="0.4" opacity="0.18"/>
  <!-- Right upper-arm zone stars -->
  <circle cx="144" cy="138" r="0.9" fill="white" opacity="0.55"/>
  <circle cx="136" cy="122" r="0.7" fill="white" opacity="0.45"/>
  <circle cx="148" cy="158" r="0.8" fill="white" opacity="0.5"/>

  <!-- Collar — brighter overlay in neck gap zone -->
  <path d="M 46 88 Q 80 76 114 88 Q 106 94 80 96 Q 54 94 46 88 Z" fill="#2a0a4a"/>
  <path d="M 46 88 Q 80 76 114 88" fill="none" stroke="#ffd700" stroke-width="1.2"/>
  <!-- Collar wing stars -->
  <circle cx="56"  cy="86" r="1.1" fill="white" opacity="0.8"/>
  <circle cx="104" cy="86" r="1.1" fill="white" opacity="0.8"/>

  <!-- Clasp -->
  <circle cx="80" cy="86" r="5.5" fill="#ffd700" stroke="#f9a825" stroke-width="1.2"/>
  <circle cx="80" cy="86" r="2.8" fill="#ff8f00"/>
  <circle cx="79" cy="85" r="1"   fill="white" opacity="0.7"/>
</svg>
