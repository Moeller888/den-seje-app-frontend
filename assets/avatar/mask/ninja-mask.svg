<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <!-- Mask body covering lower face -->
  <path d="M 50 62 Q 80 58 110 62 L 112 80 Q 80 86 48 80 Z" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <!-- Main horizontal fold crease -->
  <line x1="52" y1="71" x2="108" y2="71" stroke="#2d2d2d" stroke-width="1.2" stroke-dasharray="4,3"/>
  <!-- Diagonal tension crease — fabric pulled by knot -->
  <path d="M 108 63 Q 100 70 96 79" fill="none" stroke="#2a2a2a" stroke-width="0.8" opacity="0.5"/>
  <!-- Secondary tension line left side -->
  <path d="M 54 63 Q 62 70 64 79" fill="none" stroke="#2a2a2a" stroke-width="0.7" opacity="0.4"/>
  <!-- Left side wrap -->
  <path d="M 50 62 Q 44 63 43 71 Q 44 79 48 80" fill="none" stroke="#111" stroke-width="1.2"/>
  <!-- Right side wrap -->
  <path d="M 110 62 Q 116 63 117 71 Q 116 79 112 80" fill="none" stroke="#111" stroke-width="1.2"/>
  <!-- Top edge highlight -->
  <path d="M 50 62 Q 80 59 110 62" fill="none" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Knot — better defined with visible tie ends -->
  <path d="M 112 70 Q 122 66 128 64 Q 124 70 122 76 Q 118 74 112 72 Z" fill="#111" stroke="#222" stroke-width="0.8"/>
  <!-- Knot tie end top — tail going off right -->
  <path d="M 128 64 Q 134 61 136 65" fill="none" stroke="#111" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Knot tie end bottom -->
  <path d="M 122 76 Q 128 79 130 76" fill="none" stroke="#111" stroke-width="1.2" stroke-linecap="round"/>
</svg>
