<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <!-- Panda ears (behind face) -->
  <circle cx="58" cy="26" r="13" fill="#1a1a1a"/>
  <circle cx="102" cy="26" r="13" fill="#1a1a1a"/>
  <!-- Ear inner — richer pink, defined not just opacity -->
  <circle cx="58"  cy="26" r="7" fill="#f06292"/>
  <circle cx="102" cy="26" r="7" fill="#f06292"/>
  <!-- Ear inner highlight -->
  <circle cx="57"  cy="24" r="3.5" fill="#f8bbd0" opacity="0.7"/>
  <circle cx="101" cy="24" r="3.5" fill="#f8bbd0" opacity="0.7"/>
  <!-- Fur texture strokes on ear edge — short radial lines -->
  <line x1="45" y1="20" x2="48" y2="23" stroke="#333" stroke-width="0.7" opacity="0.5"/>
  <line x1="46" y1="30" x2="49" y2="28" stroke="#333" stroke-width="0.7" opacity="0.5"/>
  <line x1="58" y1="13" x2="58" y2="17" stroke="#333" stroke-width="0.7" opacity="0.5"/>
  <line x1="115" y1="20" x2="112" y2="23" stroke="#333" stroke-width="0.7" opacity="0.5"/>
  <line x1="114" y1="30" x2="111" y2="28" stroke="#333" stroke-width="0.7" opacity="0.5"/>
  <line x1="102" y1="13" x2="102" y2="17" stroke="#333" stroke-width="0.7" opacity="0.5"/>

  <!-- White face -->
  <ellipse cx="80" cy="52" rx="30" ry="28" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Left black eye patch -->
  <ellipse cx="67" cy="46" rx="11" ry="9" fill="#1a1a1a"/>
  <!-- Right black eye patch -->
  <ellipse cx="93" cy="46" rx="11" ry="9" fill="#1a1a1a"/>
  <!-- Left white sclera -->
  <ellipse cx="67" cy="46" rx="7" ry="6" fill="white"/>
  <!-- Right white sclera -->
  <ellipse cx="93" cy="46" rx="7" ry="6" fill="white"/>
  <!-- Left pupil -->
  <circle cx="68" cy="47" r="3.5" fill="#1a1a1a"/>
  <circle cx="66" cy="45" r="1.2" fill="white" opacity="0.8"/>
  <!-- Right pupil -->
  <circle cx="92" cy="47" r="3.5" fill="#1a1a1a"/>
  <circle cx="90" cy="45" r="1.2" fill="white" opacity="0.8"/>
  <!-- Nose -->
  <ellipse cx="80" cy="60" rx="5" ry="3.5" fill="#1a1a1a"/>
  <!-- Nose highlight — adds dimension -->
  <circle cx="78.5" cy="58.5" r="1.3" fill="#555" opacity="0.7"/>
  <!-- Smile -->
  <path d="M 73 65 Q 80 71 87 65" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Blush left — slightly more defined, rosy oval -->
  <ellipse cx="60" cy="62" rx="7" ry="4" fill="#f48fb1" opacity="0.6"/>
  <ellipse cx="60" cy="62" rx="4" ry="2.2" fill="#f48fb1" opacity="0.3"/>
  <!-- Blush right -->
  <ellipse cx="100" cy="62" rx="7" ry="4" fill="#f48fb1" opacity="0.6"/>
  <ellipse cx="100" cy="62" rx="4" ry="2.2" fill="#f48fb1" opacity="0.3"/>
</svg>
