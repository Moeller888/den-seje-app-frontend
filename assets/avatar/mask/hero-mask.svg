<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <!-- Hero eye mask — pointed wings, dark navy with blue lenses -->
  <!-- Mask body: spans from temple to temple across eyes -->
  <path d="M 44 50 L 51 37 L 62 46 L 78 43 L 82 43 L 98 46 L 109 37 L 116 50 L 109 58 L 98 54 L 82 57 L 78 57 L 62 54 Z"
        fill="#1a237e" stroke="#283593" stroke-width="1.2"/>
  <!-- Left lens -->
  <ellipse cx="68" cy="47" rx="10" ry="7" fill="#1565c0" stroke="#1976d2" stroke-width="1.5"/>
  <ellipse cx="68" cy="47" rx="7" ry="5" fill="#1e88e5" opacity="0.7"/>
  <!-- Right lens -->
  <ellipse cx="92" cy="47" rx="10" ry="7" fill="#1565c0" stroke="#1976d2" stroke-width="1.5"/>
  <ellipse cx="92" cy="47" rx="7" ry="5" fill="#1e88e5" opacity="0.7"/>
  <!-- Lens shine -->
  <ellipse cx="65" cy="44" rx="3" ry="2" fill="white" opacity="0.4"/>
  <ellipse cx="89" cy="44" rx="3" ry="2" fill="white" opacity="0.4"/>
  <!-- Bridge between lenses -->
  <path d="M 78 47 Q 80 46 82 47" fill="none" stroke="#283593" stroke-width="1.5"/>
  <!-- Left tip accent line -->
  <line x1="44" y1="50" x2="51" y2="37" stroke="#3949ab" stroke-width="1"/>
  <!-- Right tip accent line -->
  <line x1="116" y1="50" x2="109" y2="37" stroke="#3949ab" stroke-width="1"/>
</svg>
