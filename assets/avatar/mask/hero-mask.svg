<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <defs>
    <!-- Mask body: upper-left lit — left wing face lighter, lower-right in shadow -->
    <linearGradient id="hm-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#232ba8"/>
      <stop offset="55%"  stop-color="#1a237e"/>
      <stop offset="100%" stop-color="#0d1246"/>
    </linearGradient>
  </defs>

  <!-- Mask body — gradient lit from upper-left, not flat stock -->
  <path d="M 44 50 L 51 37 L 62 46 L 78 43 L 82 43 L 98 46 L 109 37 L 116 50 L 109 58 L 98 54 L 82 57 L 78 57 L 62 54 Z"
        fill="url(#hm-body)" stroke="#283593" stroke-width="1.2"/>
  <!-- Top edge rim light — ambient catch on upper face of mask -->
  <path d="M 51 37 L 62 46 L 78 43 L 82 43 L 98 46 L 109 37"
        fill="none" stroke="#5c6bc0" stroke-width="0.9" opacity="0.55"/>

  <!-- Center crease — mask is a molded hard form, not flat fabric -->
  <line x1="80" y1="44" x2="80" y2="57" stroke="#1a237e" stroke-width="1" opacity="0.3"/>

  <!-- Left lens — depth layers -->
  <ellipse cx="68" cy="47" rx="10" ry="7" fill="#1565c0" stroke="#1976d2" stroke-width="1.5"/>
  <ellipse cx="68" cy="47" rx="7"  ry="5" fill="#1e88e5" opacity="0.7"/>
  <!-- Left lens inner depth ring -->
  <ellipse cx="68" cy="47" rx="5.5" ry="3.8" fill="none" stroke="#0d47a1" stroke-width="0.7" opacity="0.5"/>

  <!-- Right lens -->
  <ellipse cx="92" cy="47" rx="10" ry="7" fill="#1565c0" stroke="#1976d2" stroke-width="1.5"/>
  <ellipse cx="92" cy="47" rx="7"  ry="5" fill="#1e88e5" opacity="0.7"/>
  <ellipse cx="92" cy="47" rx="5.5" ry="3.8" fill="none" stroke="#0d47a1" stroke-width="0.7" opacity="0.5"/>

  <!-- Lens shine arcs — upper-left light source position -->
  <path d="M 63 43 Q 66 42 70 44" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
  <path d="M 87 43 Q 90 42 94 44" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>

  <!-- Bridge between lenses -->
  <path d="M 78 47 Q 80 46 82 47" fill="none" stroke="#283593" stroke-width="1.5"/>

  <!-- Left wing tip — catch-light, upper-left face of mask -->
  <circle cx="44" cy="50" r="2" fill="#3949ab" opacity="0.7"/>
  <!-- Right wing tip -->
  <circle cx="116" cy="50" r="2" fill="#3949ab" opacity="0.7"/>

  <!-- Left tip line — rim catch-light (light side) -->
  <line x1="44" y1="50" x2="51" y2="37" stroke="#7986cb" stroke-width="0.9" opacity="0.5"/>
  <!-- Right tip line — accent (shadow side, stays dark) -->
  <line x1="116" y1="50" x2="109" y2="37" stroke="#3949ab" stroke-width="1"/>
</svg>
