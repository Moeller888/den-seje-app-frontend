<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <!-- Brim back shadow -->
  <ellipse cx="80" cy="30" rx="44" ry="9" fill="#0d47a1" opacity="0.55"/>
  <!-- Crown -->
  <rect x="48" y="4" width="64" height="26" rx="5" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/>
  <!-- Crown left highlight panel -->
  <rect x="50" y="6" width="18" height="22" rx="4" fill="#1976d2" opacity="0.45"/>
  <!-- Crown top highlight strip -->
  <rect x="48" y="4" width="64" height="6" rx="5" fill="#42a5f5" opacity="0.4"/>
  <!-- Band -->
  <rect x="48" y="22" width="64" height="9" rx="0" fill="#0d47a1" stroke="#0a3880" stroke-width="0.8"/>
  <!-- Band badge -->
  <rect x="71" y="23" width="18" height="7" rx="2" fill="#1565c0" stroke="#42a5f5" stroke-width="0.8"/>
  <circle cx="80" cy="26.5" r="2.5" fill="#42a5f5" opacity="0.85"/>
  <circle cx="80" cy="26.5" r="1" fill="white" opacity="0.6"/>
  <!-- Brim -->
  <ellipse cx="80" cy="31" rx="44" ry="8" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/>
  <!-- Brim top highlight -->
  <ellipse cx="78" cy="30" rx="36" ry="4" fill="#1976d2" opacity="0.45"/>
  <!-- Brim underside shading -->
  <ellipse cx="80" cy="34" rx="42" ry="5" fill="#0a3880" opacity="0.35"/>
</svg>
