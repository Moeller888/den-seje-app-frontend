<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <defs>
    <!-- 4-stop warm gold gradient — stays in gold/amber family, no red-orange -->
    <linearGradient id="cg-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff9c4"/>
      <stop offset="25%"  stop-color="#ffd600"/>
      <stop offset="65%"  stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#c77700"/>
    </linearGradient>
    <!-- Legendary glow aura -->
    <radialGradient id="cg-glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%"   stop-color="#ffd600" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffd600" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- Legendary glow aura -->
  <ellipse cx="80" cy="37" rx="55" ry="22" fill="url(#cg-glow)"/>

  <!-- 5 crown points: tall-short-TALL-short-tall -->
  <polygon points="40,22 48,2 56,22"    fill="url(#cg-body)" stroke="#9a6200" stroke-width="1"/>
  <polygon points="55,22 63,11 71,22"   fill="url(#cg-body)" stroke="#9a6200" stroke-width="1"/>
  <polygon points="70,22 80,0 90,22"    fill="url(#cg-body)" stroke="#9a6200" stroke-width="1.5"/>
  <polygon points="89,22 97,11 105,22"  fill="url(#cg-body)" stroke="#9a6200" stroke-width="1"/>
  <polygon points="104,22 112,2 120,22" fill="url(#cg-body)" stroke="#9a6200" stroke-width="1"/>

  <!-- Tip dot highlights — each spike catches the light -->
  <circle cx="48"  cy="2"  r="1.5" fill="#fff9c4" opacity="0.9"/>
  <circle cx="63"  cy="11" r="1.2" fill="#fff9c4" opacity="0.8"/>
  <circle cx="80"  cy="0"  r="1.8" fill="white"   opacity="0.95"/>
  <circle cx="97"  cy="11" r="1.2" fill="#fff9c4" opacity="0.8"/>
  <circle cx="112" cy="2"  r="1.5" fill="#fff9c4" opacity="0.9"/>

  <!-- Left edge catch-light on each spike — upper-left light source -->
  <line x1="40"  y1="22" x2="48"  y2="2"  stroke="#fff9c4" stroke-width="0.7" opacity="0.5"/>
  <line x1="55"  y1="22" x2="63"  y2="11" stroke="#fff9c4" stroke-width="0.7" opacity="0.45"/>
  <line x1="70"  y1="22" x2="80"  y2="0"  stroke="#fff9c4" stroke-width="0.9" opacity="0.55"/>
  <line x1="89"  y1="22" x2="97"  y2="11" stroke="#fff9c4" stroke-width="0.7" opacity="0.45"/>
  <line x1="104" y1="22" x2="112" y2="2"  stroke="#fff9c4" stroke-width="0.7" opacity="0.5"/>

  <!-- Base band -->
  <rect x="40" y="22" width="80" height="15" rx="3" fill="url(#cg-body)" stroke="#9a6200" stroke-width="1.5"/>
  <!-- Band top highlight -->
  <rect x="40" y="22" width="80" height="4" rx="2" fill="#fff9c4" opacity="0.45"/>
  <!-- Band left-edge rim light — upper-left light catches the left face of the band -->
  <line x1="41" y1="23" x2="41" y2="36" stroke="#fff9c4" stroke-width="0.9" opacity="0.45"/>
  <!-- Primary filigree -->
  <line x1="44" y1="30" x2="116" y2="30" stroke="#9a6200" stroke-width="0.8" stroke-dasharray="3,2.5" opacity="0.6"/>
  <!-- Secondary filigree — legendary complexity layer -->
  <line x1="44" y1="33" x2="116" y2="33" stroke="#ffb300" stroke-width="0.5" stroke-dasharray="1.5,4" opacity="0.4"/>

  <!-- Center ruby (large) — facet hint -->
  <ellipse cx="80" cy="8" rx="6" ry="7" fill="#c62828" stroke="#7f0000" stroke-width="1"/>
  <ellipse cx="78" cy="5" rx="2.5" ry="3" fill="white" opacity="0.65"/>
  <line x1="80" y1="2" x2="78" y2="8" stroke="#ef5350" stroke-width="0.6" opacity="0.5"/>

  <!-- Left tall ruby -->
  <ellipse cx="48" cy="8" rx="4" ry="5" fill="#c62828" stroke="#7f0000" stroke-width="0.8"/>
  <ellipse cx="47" cy="6" rx="1.5" ry="2" fill="white" opacity="0.55"/>
  <line x1="48" y1="4" x2="47" y2="9" stroke="#ef5350" stroke-width="0.5" opacity="0.45"/>

  <!-- Right tall ruby -->
  <ellipse cx="112" cy="8" rx="4" ry="5" fill="#c62828" stroke="#7f0000" stroke-width="0.8"/>
  <ellipse cx="111" cy="6" rx="1.5" ry="2" fill="white" opacity="0.55"/>
  <line x1="112" y1="4" x2="111" y2="9" stroke="#ef5350" stroke-width="0.5" opacity="0.45"/>

  <!-- Left short sapphire -->
  <circle cx="63" cy="13" r="3.5" fill="#1565c0" stroke="#0d47a1" stroke-width="0.8"/>
  <circle cx="62" cy="11.5" r="1.3" fill="white" opacity="0.6"/>

  <!-- Right short sapphire -->
  <circle cx="97" cy="13" r="3.5" fill="#1565c0" stroke="#0d47a1" stroke-width="0.8"/>
  <circle cx="96" cy="11.5" r="1.3" fill="white" opacity="0.6"/>

  <!-- Band rivets -->
  <circle cx="52"  cy="29" r="2" fill="#fff9c4" stroke="#9a6200" stroke-width="0.8"/>
  <circle cx="80"  cy="29" r="2" fill="#fff9c4" stroke="#9a6200" stroke-width="0.8"/>
  <circle cx="108" cy="29" r="2" fill="#fff9c4" stroke="#9a6200" stroke-width="0.8"/>
</svg>
