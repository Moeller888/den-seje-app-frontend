<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <defs>
    <linearGradient id="cs-silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="50%" stop-color="#bdbdbd"/>
      <stop offset="100%" stop-color="#757575"/>
    </linearGradient>
  </defs>
  <!-- 5 crown points: tall-short-TALL-short-tall -->
  <polygon points="40,22 48,2 56,22"    fill="url(#cs-silver)" stroke="#616161" stroke-width="1"/>
  <polygon points="55,22 63,11 71,22"   fill="url(#cs-silver)" stroke="#616161" stroke-width="1"/>
  <polygon points="70,22 80,0 90,22"    fill="url(#cs-silver)" stroke="#616161" stroke-width="1.5"/>
  <polygon points="89,22 97,11 105,22"  fill="url(#cs-silver)" stroke="#616161" stroke-width="1"/>
  <polygon points="104,22 112,2 120,22" fill="url(#cs-silver)" stroke="#616161" stroke-width="1"/>
  <!-- Base band -->
  <rect x="40" y="22" width="80" height="15" rx="3" fill="url(#cs-silver)" stroke="#616161" stroke-width="1.5"/>
  <!-- Band top highlight -->
  <rect x="40" y="22" width="80" height="4" rx="2" fill="white" opacity="0.5"/>
  <!-- Filigree detail -->
  <line x1="44" y1="30" x2="116" y2="30" stroke="#757575" stroke-width="0.7" stroke-dasharray="3,2.5" opacity="0.55"/>
  <!-- Center sapphire -->
  <ellipse cx="80" cy="8" rx="6" ry="7" fill="#1565c0" stroke="#0d47a1" stroke-width="1"/>
  <ellipse cx="78" cy="5" rx="2.5" ry="3" fill="white" opacity="0.65"/>
  <!-- Left tall amethyst -->
  <ellipse cx="48" cy="8" rx="4" ry="5" fill="#6a1b9a" stroke="#4a148c" stroke-width="0.8"/>
  <ellipse cx="47" cy="6" rx="1.5" ry="2" fill="white" opacity="0.5"/>
  <!-- Right tall amethyst -->
  <ellipse cx="112" cy="8" rx="4" ry="5" fill="#6a1b9a" stroke="#4a148c" stroke-width="0.8"/>
  <ellipse cx="111" cy="6" rx="1.5" ry="2" fill="white" opacity="0.5"/>
  <!-- Left short emerald -->
  <circle cx="63" cy="13" r="3.5" fill="#2e7d32" stroke="#1b5e20" stroke-width="0.8"/>
  <circle cx="62" cy="11.5" r="1.3" fill="white" opacity="0.55"/>
  <!-- Right short emerald -->
  <circle cx="97" cy="13" r="3.5" fill="#2e7d32" stroke="#1b5e20" stroke-width="0.8"/>
  <circle cx="96" cy="11.5" r="1.3" fill="white" opacity="0.55"/>
  <!-- Band rivets -->
  <circle cx="52" cy="29" r="2" fill="#e0e0e0" stroke="#757575" stroke-width="0.8"/>
  <circle cx="80" cy="29" r="2" fill="#e0e0e0" stroke="#757575" stroke-width="0.8"/>
  <circle cx="108" cy="29" r="2" fill="#e0e0e0" stroke="#757575" stroke-width="0.8"/>
</svg>
