  <rect x="48" y="24" width="64" height="14" rx="3" fill="#bdbdbd" stroke="#9e9e9e" stroke-width="1.5"/>
  <!-- Left point -->
  <polygon points="48,24 58,4 68,24" fill="#c8c8c8" stroke="#9e9e9e" stroke-width="1.5"/>
  <!-- Center point -->
