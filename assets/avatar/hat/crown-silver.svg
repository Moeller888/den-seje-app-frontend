  <!-- Right point -->
  <polygon points="92,24 102,4 112,24" fill="#c8c8c8" stroke="#9e9e9e" stroke-width="1.5"/>
  <!-- Gems -->
  <circle cx="80" cy="9" r="5" fill="#90caf9" stroke="#64b5f6" stroke-width="1"/>
  <circle cx="58" cy="11" r="4" fill="#ef9a9a" stroke="#e57373" stroke-width="1"/>
  <circle cx="102" cy="11" r="4" fill="#a5d6a7" stroke="#81c784" stroke-width="1"/>
