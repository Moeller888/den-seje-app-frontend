<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <defs>
    <!-- Wing membrane: bright emerald at top, deep forest at base -->
    <linearGradient id="wg-memL" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#43a047"/>
      <stop offset="55%"  stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1a3a1c"/>
    </linearGradient>
    <linearGradient id="wg-memR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#43a047"/>
      <stop offset="55%"  stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1a3a1c"/>
    </linearGradient>
  </defs>

  <!-- ── LEFT WING ── -->
  <!-- Main membrane — gradient fill -->
  <path d="M 42 118 L 2 52 L 8 158 L 34 194 Z" fill="url(#wg-memL)" stroke="#1b5e20" stroke-width="1.5"/>
  <!-- Upper membrane panel -->
  <path d="M 42 118 L 2 52 L 18 92 Z" fill="#66bb6a" opacity="0.35"/>
  <!-- Mid membrane panel -->
  <path d="M 42 118 L 8 118 L 10 148 Z" fill="#66bb6a" opacity="0.28"/>
  <!-- Lower membrane panel -->
  <path d="M 42 118 L 8 158 L 22 148 Z" fill="#66bb6a" opacity="0.32"/>
  <!-- Outer edge darkening -->
  <path d="M 2 52 L 8 158 L 34 194" fill="none" stroke="#1b5e20" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Spines -->
  <line x1="42" y1="118" x2="2"  y2="52"  stroke="#1b5e20" stroke-width="2"/>
  <line x1="42" y1="118" x2="10" y2="96"  stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="42" y1="118" x2="8"  y2="138" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="42" y1="118" x2="8"  y2="158" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="42" y1="118" x2="34" y2="194" stroke="#1b5e20" stroke-width="1.5"/>
  <!-- Spine highlight — iridescent teal sheen on upper spine -->
  <line x1="42" y1="118" x2="4"  y2="56"  stroke="#80cbc4" stroke-width="0.8" opacity="0.45"/>
  <!-- Scale arcs near wing root — organic texture hint -->
  <path d="M 36 120 Q 30 115 28 122" fill="none" stroke="#2e7d32" stroke-width="0.9" opacity="0.55"/>
  <path d="M 34 128 Q 28 124 26 132" fill="none" stroke="#2e7d32" stroke-width="0.9" opacity="0.5"/>
  <!-- Wingtips -->
  <circle cx="2"  cy="52"  r="4" fill="#1b5e20"/>
  <circle cx="4"  cy="54"  r="1.5" fill="#80cbc4" opacity="0.5"/>
  <circle cx="34" cy="194" r="3" fill="#1b5e20"/>

  <!-- ── RIGHT WING ── -->
  <path d="M 118 118 L 158 52 L 152 158 L 126 194 Z" fill="url(#wg-memR)" stroke="#1b5e20" stroke-width="1.5"/>
  <path d="M 118 118 L 158 52 L 142 92 Z" fill="#66bb6a" opacity="0.35"/>
  <path d="M 118 118 L 152 118 L 150 148 Z" fill="#66bb6a" opacity="0.28"/>
  <path d="M 118 118 L 152 158 L 138 148 Z" fill="#66bb6a" opacity="0.32"/>
  <path d="M 158 52 L 152 158 L 126 194" fill="none" stroke="#1b5e20" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="118" y1="118" x2="158" y2="52"  stroke="#1b5e20" stroke-width="2"/>
  <line x1="118" y1="118" x2="150" y2="96"  stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="118" y1="118" x2="152" y2="138" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="118" y1="118" x2="152" y2="158" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="118" y1="118" x2="126" y2="194" stroke="#1b5e20" stroke-width="1.5"/>
  <line x1="118" y1="118" x2="156" y2="56"  stroke="#80cbc4" stroke-width="0.8" opacity="0.45"/>
  <path d="M 124 120 Q 130 115 132 122" fill="none" stroke="#2e7d32" stroke-width="0.9" opacity="0.55"/>
  <path d="M 126 128 Q 132 124 134 132" fill="none" stroke="#2e7d32" stroke-width="0.9" opacity="0.5"/>
  <circle cx="158" cy="52"  r="4" fill="#1b5e20"/>
  <circle cx="156" cy="54"  r="1.5" fill="#80cbc4" opacity="0.5"/>
  <circle cx="126" cy="194" r="3" fill="#1b5e20"/>
</svg>
