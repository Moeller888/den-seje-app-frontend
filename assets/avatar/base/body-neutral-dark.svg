  <path d="M 124 165 Q 133 162 142 165" fill="none" stroke="#2c404a" stroke-width="0.9" opacity="0.22"/>

  <!-- Shoulder caps (Sec 63 tilt preserved) -->
  <path d="M 50 92 Q 36 89 18 100 Q 12 110 16 121 Q 23 119 33 112 Q 40 103 40 96 Z"
