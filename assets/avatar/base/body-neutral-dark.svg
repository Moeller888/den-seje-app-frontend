  <path d="M 65 93 L 80 112 L 95 93" fill="none" stroke="#1c2930" stroke-width="1.5" opacity="0.32"/>
  <line x1="62" y1="92" x2="80" y2="110" stroke="#8ec0d2" stroke-width="0.8" opacity="0.35"/>

