  <path d="M 110 94 Q 124 93 142 101" fill="none" stroke="#a8d4e6" stroke-width="0.9" opacity="0.32"/>

  <!-- ── HEAD ── -->

  <rect x="72" y="78" width="16" height="18" rx="7" fill="url(#b2-sk)"/>
  <line x1="80" y1="79" x2="80" y2="95" stroke="#553318" stroke-width="1.5" opacity="0.18"/>
  <path d="M 72 80 Q 71 88 72 94" fill="none" stroke="#553318" stroke-width="1.5" opacity="0.16"/>
  <path d="M 88 80 Q 89 88 88 94" fill="none" stroke="#553318" stroke-width="1.5" opacity="0.14"/>

  <!-- Trapezius (Sec 63 tilt preserved) -->
  <path d="M 40 91 Q 56 86 72 90 Q 68 96 58 101 Q 48 99 40 95 Z" fill="#1c2930" opacity="0.14"/>
  <path d="M 120 93 Q 104 88 88 92 Q 92 98 102 103 Q 112 101 120 97 Z" fill="#1c2930" opacity="0.14"/>

  <ellipse cx="50" cy="52" rx="8" ry="9" fill="url(#b2-sk)"/>
  <ellipse cx="110" cy="52" rx="8" ry="9" fill="url(#b2-sk)"/>
  <ellipse cx="50" cy="53" rx="4.5" ry="5.5" fill="#553318" opacity="0.28"/>
  <ellipse cx="110" cy="53" rx="4.5" ry="5.5" fill="#553318" opacity="0.28"/>

  <!-- Head sphere — POSITION LOCKED: cx=80 cy=50 r=30 -->
  <circle cx="80" cy="50" r="30" fill="url(#b2-sk)"/>
  <!-- Section 152E: highlight opacity 0.10→0.07 to match the expression layer
       (visual transparency parity once the expression skin layer is removed). -->
  <path d="M 80 20 A 30 30 0 0 1 80 80 Q 104 74 110 56 Q 114 40 106 28 Q 96 20 80 20 Z"
        fill="#553318" opacity="0.07"/>

  <path d="M 68 77 Q 80 82 92 77" fill="none" stroke="#c07850" stroke-width="2.5" opacity="0.27"/>

  <!-- ── HAIR ── -->
  <!-- Section 152B: hair decoupled — the SECTION 64 hair (side panels, cap,
       specular, catch-lights, forward bang) now lives in
       assets/avatar/hair/hair-default.svg and renders as the identity hair
       layer at the hair slot z-level (z=4), above expression overlays. -->

  <!-- ── FACE ── -->

  <path d="M 61 38.5 Q 67.5 35.5 74 38.5" fill="none" stroke="#4a3626" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 86 38.5 Q 92.5 35.5 99 38.5" fill="none" stroke="#4a3626" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Eyes: POSITION LOCKED: cx=68/92 cy=47 -->
