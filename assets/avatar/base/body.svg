<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <defs>
    <!-- Skin: warm golden-tan, applied to all exposed skin areas -->
    <linearGradient id="b2-sk" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%"   stop-color="#F5C49A"/>
      <stop offset="100%" stop-color="#E8A87C"/>
    </linearGradient>
    <!-- Shirt: blue-grey, upper-left light source (consistent with all armor/cape items) -->
    <linearGradient id="b2-sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7096a8"/>
      <stop offset="55%"  stop-color="#54717e"/>
      <stop offset="100%" stop-color="#364f5a"/>
    </linearGradient>
    <!-- Left arm: light hits the left face of the arm -->
    <linearGradient id="b2-aL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7aacbe"/>
      <stop offset="100%" stop-color="#364f5a"/>
    </linearGradient>
    <!-- Right arm: mirror of left (light hits right face) -->
    <linearGradient id="b2-aR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#7aacbe"/>
      <stop offset="100%" stop-color="#364f5a"/>
    </linearGradient>
    <!-- Pants: dark navy, top-lit -->
    <linearGradient id="b2-pa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3e5662"/>
      <stop offset="100%" stop-color="#1e2e36"/>
    </linearGradient>
  </defs>

  <!-- ── LOWER BODY ── -->

  <!-- Left leg: tapered path — 26px at hip, 18px at ankle, matches arm taper language.
       Bounding box stays x=48–74 y=178–234 so future boot/leg equipment anchors unchanged. -->
  <path d="M 50 178 L 72 178 Q 74 180 74 188 L 70 232 Q 69 234 65 234 L 57 234 Q 53 234 52 232 L 48 188 Q 48 180 50 178 Z"
        fill="url(#b2-pa)" stroke="#172028" stroke-width="0.8"/>
  <!-- Left leg rim light — angled to follow outer taper edge -->
  <line x1="49" y1="182" x2="51" y2="228" stroke="#5c7a8a" stroke-width="0.9" opacity="0.42"/>

  <!-- Right leg: tapered path — mirror of left -->
  <path d="M 110 178 L 88 178 Q 86 180 86 188 L 90 232 Q 91 234 95 234 L 103 234 Q 107 234 108 232 L 112 188 Q 112 180 110 178 Z"
        fill="url(#b2-pa)" stroke="#172028" stroke-width="0.8"/>
  <!-- Right leg outer rim light — angled to follow outer taper edge -->
  <line x1="111" y1="182" x2="109" y2="228" stroke="#5c7a8a" stroke-width="0.9" opacity="0.38"/>

  <!-- Inner thigh shadows: diverge outward with leg taper — gap between legs widens at ankle -->
  <path d="M 74 182 L 71 228" stroke="#172028" stroke-width="2.5" opacity="0.28" stroke-linecap="round"/>
  <path d="M 86 182 L 89 228" stroke="#172028" stroke-width="2.5" opacity="0.28" stroke-linecap="round"/>

  <!-- Knee implication: asymmetric — right leg carries weight (wider, deeper), left leg lighter.
       SECTION 63: contrapposto weight-right stance — right knee more prominent. -->
  <ellipse cx="61" cy="204" rx="9.5" ry="5" fill="#4a6574" opacity="0.13"/>
  <ellipse cx="99" cy="204" rx="10.5" ry="6.5" fill="#4a6574" opacity="0.20"/>

  <!-- Left shoe: lighter touch — weight shifted off this foot -->
  <ellipse cx="61" cy="235" rx="16.5" ry="5.5" fill="#181818"/>
  <!-- Toe cap highlight -->
  <path d="M 48 232 Q 56 229 64 231" fill="none" stroke="#3c3c3c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Right shoe: planted — carries body weight, wider silhouette -->
  <ellipse cx="99" cy="235" rx="17.5" ry="6.5" fill="#181818"/>
  <path d="M 86 232 Q 94 229 102 231" fill="none" stroke="#3c3c3c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- ── TORSO ── -->

  <!-- Shirt body — SECTION 63: contrapposto shoulder tilt.
       Left shoulder 1px higher (y=91), right shoulder 1px lower (y=93) — weight-on-right creates
       left shoulder lift. Subtle but the silhouette now reads as a character who stands with intent,
       not a symmetrical template. Body and belt (x=40–120) unchanged — armor alignment unaffected. -->
  <path d="M 50 91 Q 38 91 38 103 Q 38 117 40 130 C 43 140 43 160 40 170 L 40 180 L 120 180 C 117 160 117 140 120 130 Q 122 119 122 105 Q 122 93 110 93 Z"
        fill="url(#b2-sh)" stroke="#2c404a" stroke-width="1"/>
  <!-- Left edge catch-light: tracks shifted shoulder -->
  <line x1="39" y1="95" x2="41" y2="174" stroke="#96bece" stroke-width="1.2" opacity="0.38"/>
  <!-- Vertical center seam: subtle garment construction read -->
  <line x1="80" y1="97" x2="80" y2="178" stroke="#2c404a" stroke-width="0.8" opacity="0.3"/>

  <!-- Chest plane: upper chest faces the light directly — subtle brightening implies sternum ridge -->
  <ellipse cx="80" cy="116" rx="22" ry="16" fill="#96bece" opacity="0.07"/>
  <!-- Pectoral shadow lines: faint chest-muscle plane division on each side of sternum -->
  <path d="M 67 100 Q 72 110 74 120" fill="none" stroke="#2c404a" stroke-width="0.9" opacity="0.18"/>
  <path d="M 93 100 Q 88 110 86 120" fill="none" stroke="#2c404a" stroke-width="0.9" opacity="0.18"/>

  <!-- Waist side shadows: shadow deepens at the indented waist zone — cloth wraps a body, not a box -->
  <path d="M 40 148 Q 34 163 40 178" fill="none" stroke="#1c2930" stroke-width="5" opacity="0.26" stroke-linecap="round"/>
  <path d="M 120 148 Q 126 163 120 178" fill="none" stroke="#1c2930" stroke-width="5" opacity="0.26" stroke-linecap="round"/>

  <!-- Underarm crease: left stays with lifted shoulder; right drops 2px — lower right shoulder
       implies arm hangs slightly relaxed, a natural consequence of weight-side posture. -->
  <path d="M 38 102 Q 39 112 40 122" fill="none" stroke="#1c2930" stroke-width="2.2" opacity="0.24"/>
  <path d="M 122 104 Q 121 114 120 124" fill="none" stroke="#1c2930" stroke-width="2.2" opacity="0.24"/>

  <!-- Shirt neckline wrap: curved edge implies collar continues behind the neck — garment has
       circumference, not just a front face. Subtle but eliminates "painted-on" collar read. -->
  <path d="M 65 91 Q 72 86 80 85 Q 88 86 95 91" fill="none" stroke="#6090a8" stroke-width="0.9" opacity="0.42" stroke-linecap="round"/>
  <!-- V-collar: cloth folds toward neck opening -->
  <path d="M 62 92 L 80 110 L 98 92" fill="#3a545e" stroke="#2c404a" stroke-width="1.1"/>
  <!-- Collar fold underside: dark inner edge gives the collar physical thickness -->
  <path d="M 65 93 L 80 112 L 95 93" fill="none" stroke="#1c2930" stroke-width="1.5" opacity="0.32"/>
  <!-- Collar left-face catch-light -->
  <line x1="62" y1="92" x2="80" y2="110" stroke="#8ec0d2" stroke-width="0.8" opacity="0.35"/>

  <!-- Belt / waist band -->
  <rect x="40" y="174" width="80" height="9" rx="4" fill="#1c2930"/>
  <!-- Belt buckle -->
  <rect x="73" y="174" width="14" height="9" rx="2" fill="#37474f"/>
  <rect x="76" y="176" width="8" height="5" rx="1" fill="#455a64"/>
  <!-- Buckle bar highlight -->
  <line x1="76" y1="177" x2="84" y2="177" stroke="#78909c" stroke-width="0.7" opacity="0.55"/>

  <!-- ── ARMS — same rect bounds for armor arm-plate compatibility ── -->

  <!-- Left arm: tapered path — 26px at shoulder, ~20px at wrist, natural forearm narrowing.
       Bounding box stays x=14–40 y=98–166 so armor arm-plate alignment is unchanged. -->
  <path d="M 16 98 L 38 98 Q 40 100 40 110 L 39 142 L 36 164 Q 35 166 32 166 L 22 166 Q 19 166 18 164 L 15 142 L 14 110 Q 14 100 16 98 Z"
        fill="url(#b2-aL)" stroke="#2c404a" stroke-width="1"/>
  <!-- Left arm rim light -->
  <line x1="15" y1="102" x2="15" y2="160" stroke="#96bece" stroke-width="1" opacity="0.38"/>
  <!-- Left deltoid form: shoulder insertion bulge -->
  <path d="M 14 100 Q 16 97 24 100 Q 30 103 28 114 Q 24 122 16 120 Q 14 112 14 100 Z"
        fill="#9cc4d8" opacity="0.32"/>

  <!-- Right arm: tapered path — mirror of left -->
  <path d="M 144 98 L 122 98 Q 120 100 120 110 L 121 142 L 124 164 Q 125 166 128 166 L 138 166 Q 141 166 142 164 L 145 142 L 146 110 Q 146 100 144 98 Z"
        fill="url(#b2-aR)" stroke="#2c404a" stroke-width="1"/>
  <!-- Right arm rim light -->
  <line x1="145" y1="102" x2="145" y2="160" stroke="#96bece" stroke-width="1" opacity="0.35"/>
  <!-- Right deltoid form: mirror -->
  <path d="M 146 100 Q 144 97 136 100 Q 130 103 132 114 Q 136 122 144 120 Q 146 112 146 100 Z"
        fill="#9cc4d8" opacity="0.28"/>

  <!-- Left forearm taper shadow: darkens inner face of narrowing forearm, reinforces wrist taper -->
  <path d="M 36 142 Q 37 155 36 164" fill="none" stroke="#172028" stroke-width="3.5" opacity="0.22" stroke-linecap="round"/>
  <!-- Right forearm taper shadow: SECTION 63 — slight lateral curve implies relaxed elbow hang.
       Control point shifted 4px inward (x=120→116) to suggest arm at rest, not parade-stiff. -->
  <path d="M 124 140 Q 120 153 121 163" fill="none" stroke="#172028" stroke-width="3.5" opacity="0.22" stroke-linecap="round"/>

  <!-- Elbow implication: faint plane change at elbow transition point -->
  <path d="M 17 143 Q 25 148 34 143" fill="none" stroke="#2c404a" stroke-width="1" opacity="0.14"/>
  <!-- Right elbow: SECTION 63 — raised 2px, slight inward shift — relaxed hanging arm posture -->
  <path d="M 143 141 Q 134 146 125 141" fill="none" stroke="#2c404a" stroke-width="1" opacity="0.14"/>

  <!-- Hands: palm ellipse (slightly wider than tall) — more hand-like silhouette than circle.
       Visual center stays at cx=27/133 cy=172 — equipment anchor preserved.
       Thumb knobs extend toward torso center, rendered after arm so they appear at wrist level. -->
  <!-- Left thumb: extends toward center (character left = thumb points right) -->
  <path d="M 35 165 Q 41 162 42 166 Q 42 171 38 173 Q 34 171 35 165 Z"
        fill="url(#b2-sk)" stroke="#d4956a" stroke-width="0.7" stroke-linejoin="round"/>
  <ellipse cx="27" cy="173" rx="10" ry="9" fill="url(#b2-sk)" stroke="#d4956a" stroke-width="0.8"/>
  <!-- Right thumb: mirror — extends toward center -->
  <path d="M 125 165 Q 119 162 118 166 Q 118 171 122 173 Q 126 171 125 165 Z"
        fill="url(#b2-sk)" stroke="#d4956a" stroke-width="0.7" stroke-linejoin="round"/>
  <ellipse cx="133" cy="173" rx="10" ry="9" fill="url(#b2-sk)" stroke="#d4956a" stroke-width="0.8"/>
  <!-- Knuckle plane: dorsal hand bone ridge -->
  <path d="M 18 171 Q 27 168 36 171" fill="none" stroke="#c07850" stroke-width="0.9" opacity="0.20"/>
  <path d="M 124 171 Q 133 168 142 171" fill="none" stroke="#c07850" stroke-width="0.9" opacity="0.20"/>
  <!-- Wrist crease: cuff-to-skin boundary, confirms sleeve ends and hand begins -->
  <path d="M 18 165 Q 27 162 36 165" fill="none" stroke="#2c404a" stroke-width="0.9" opacity="0.22"/>
  <path d="M 124 165 Q 133 162 142 165" fill="none" stroke="#2c404a" stroke-width="0.9" opacity="0.22"/>

  <!-- Shoulder caps: SECTION 63 — left cap 2px higher (raised shoulder), right cap 2px lower.
       This makes the shoulder tilt visible not just in the torso silhouette but in the deltoid
       mass — the cap volume now physically embodies the weight-right contrapposto stance. -->
  <path d="M 50 92 Q 36 89 18 100 Q 12 110 16 121 Q 23 119 33 112 Q 40 103 40 96 Z"
        fill="#7aacbe" opacity="0.30"/>
  <!-- Left shoulder cap highlight: upper-left light on raised shoulder face -->
  <path d="M 50 92 Q 36 89 18 100" fill="none" stroke="#a8d4e6" stroke-width="0.9" opacity="0.38"/>

  <path d="M 110 94 Q 124 93 142 101 Q 148 111 144 122 Q 137 120 127 113 Q 120 105 120 98 Z"
        fill="#7aacbe" opacity="0.26"/>
  <!-- Right shoulder cap highlight: lower shoulder, slightly heavier shadow -->
  <path d="M 110 94 Q 124 93 142 101" fill="none" stroke="#a8d4e6" stroke-width="0.9" opacity="0.32"/>

  <!-- ── HEAD ── -->

  <!-- Neck: behind head -->
  <rect x="72" y="78" width="16" height="18" rx="7" fill="url(#b2-sk)"/>
  <!-- Neck center shadow: cylindrical form read -->
  <line x1="80" y1="79" x2="80" y2="95" stroke="#d4956a" stroke-width="1.5" opacity="0.18"/>
  <!-- Neck side shadows: lateral shadow planes suggest cylindrical neck volume -->
  <path d="M 72 80 Q 71 88 72 94" fill="none" stroke="#d4956a" stroke-width="1.5" opacity="0.16"/>
  <path d="M 88 80 Q 89 88 88 94" fill="none" stroke="#d4956a" stroke-width="1.5" opacity="0.14"/>

  <!-- Trapezius form: SECTION 63 — left trapezius 1px higher, right 1px lower.
       The muscle origin at the spine is fixed; the insertion into the shoulder moves with the
       shoulder tilt — this is anatomically correct and reinforces the pose read. -->
  <path d="M 40 91 Q 56 86 72 90 Q 68 96 58 101 Q 48 99 40 95 Z" fill="#1c2930" opacity="0.14"/>
  <path d="M 120 93 Q 104 88 88 92 Q 92 98 102 103 Q 112 101 120 97 Z" fill="#1c2930" opacity="0.14"/>

  <!-- Ears: behind head sphere -->
  <ellipse cx="50" cy="52" rx="8" ry="9" fill="url(#b2-sk)"/>
  <ellipse cx="110" cy="52" rx="8" ry="9" fill="url(#b2-sk)"/>
  <!-- Ear inner hollow: depth hint -->
  <ellipse cx="50" cy="53" rx="4.5" ry="5.5" fill="#d4956a" opacity="0.28"/>
  <ellipse cx="110" cy="53" rx="4.5" ry="5.5" fill="#d4956a" opacity="0.28"/>

  <!-- Head sphere — POSITION LOCKED: cx=80 cy=50 r=30
       All face/headwear cosmetics are authored to this anchor. -->
  <circle cx="80" cy="50" r="30" fill="url(#b2-sk)"/>
  <!-- Right-face shadow: spherical form read — slightly strengthened for convincing volume -->
  <path d="M 80 20 A 30 30 0 0 1 80 80 Q 104 74 110 56 Q 114 40 106 28 Q 96 20 80 20 Z"
        fill="#d4956a" opacity="0.10"/>

  <!-- Chin AO shadow: occlusion where head sphere meets neck — removes "floating head" read -->
  <path d="M 68 77 Q 80 82 92 77" fill="none" stroke="#c07850" stroke-width="2.5" opacity="0.27"/>

  <!-- Hair: off-center peak (75,16) gives directional side-part identity.
       Side panels extend to y≈64 to eliminate the scalp-gap at the temples — hair
       drawn before the cap so the cap's clean outer edge reads as the dominant silhouette. -->
  <!-- Side hair panels: fill scalp gap, temple coverage.
       Left panel is slightly wider and longer than right (Q 45 vs Q 47, y=72 vs y=68) —
       intentional asymmetry that reads as a styled side-part, not a symmetric template. -->
  <path d="M 52 44 Q 45 51 45 65 Q 46 72 54 68 Q 58 60 56 50 Z" fill="#4a3626"/>
  <path d="M 108 44 Q 113 50 113 62 Q 112 68 106 64 Q 103 57 104 50 Z" fill="#4a3626"/>
  <!-- Main hair cap -->
  <path d="M 52 44 Q 50 17 74 15 Q 80 13 86 15 Q 100 17 108 44 Q 98 28 80 28 Q 62 28 52 44 Z"
        fill="#4a3626"/>
  <!-- Hair specular: single highlight line, consistent upper-left light -->
  <path d="M 60 27 Q 74 22 90 25" fill="none" stroke="#7d5c44" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
  <!-- Side hair catch-light: left extends further to match larger left panel -->
  <path d="M 52 44 Q 49 52 49 65" fill="none" stroke="#6b4a33" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
  <path d="M 108 44 Q 110 51 109 61" fill="none" stroke="#6b4a33" stroke-width="1.4" stroke-linecap="round" opacity="0.38"/>

  <!-- ── FACE ── -->

  <!-- Eyebrows: warm brown, gentle arch — most readable facial element at small scale -->
  <path d="M 61 38.5 Q 67.5 35.5 74 38.5" fill="none" stroke="#4a3626" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 86 38.5 Q 92.5 35.5 99 38.5" fill="none" stroke="#4a3626" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Eyes: sclera white base — POSITION LOCKED: cx=68/92 cy=47, matching hero-mask lens alignment -->
  <ellipse cx="68" cy="47" rx="7" ry="6" fill="white"/>
  <ellipse cx="92" cy="47" rx="7" ry="6" fill="white"/>
  <!-- Iris: warm amber-brown — color identity for the default character -->
  <circle cx="68" cy="47" r="4.8" fill="#6B4226"/>
  <circle cx="92" cy="47" r="4.8" fill="#6B4226"/>
  <!-- Pupil -->
  <circle cx="68" cy="47" r="2.5" fill="#180c05"/>
  <circle cx="92" cy="47" r="2.5" fill="#180c05"/>
  <!-- Primary eye shine: upper-left position matches scene light source -->
  <circle cx="70" cy="44.5" r="1.9" fill="white"/>
  <circle cx="94" cy="44.5" r="1.9" fill="white"/>
  <!-- Secondary micro-shine: depth and life at any scale -->
  <circle cx="66" cy="48" r="0.9" fill="white" opacity="0.5"/>
  <circle cx="90" cy="48" r="0.9" fill="white" opacity="0.5"/>
  <!-- Periorbital depth: under-eye shadow at lower orbital rim — implies eye socket anatomy, adds facial structure -->
  <ellipse cx="68" cy="53" rx="5" ry="1.5" fill="#c07850" opacity="0.09"/>
  <ellipse cx="92" cy="53" rx="5" ry="1.5" fill="#c07850" opacity="0.09"/>
  <!-- Upper eyelid crease: outer corner lifted to 41 — more defined wing shape.
       Stroke weight 1.6 ensures readability at 52px. Inner corner at 43 stays approachable. -->
  <path d="M 61 43 Q 68 40.5 75 41" fill="none" stroke="#1a0e06" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 85 43 Q 92 40.5 99 41" fill="none" stroke="#1a0e06" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Nose: V-bridge with nostril dots — never dominant, always supportive -->
  <path d="M 77 57 Q 78 62 80 62.5 Q 82 62 83 57" fill="none" stroke="#c07850" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="77" cy="61.5" r="1.1" fill="#c07850" opacity="0.38"/>
  <circle cx="83" cy="61.5" r="1.1" fill="#c07850" opacity="0.38"/>

  <!-- Mouth: upward smile — warmth, educational context, approachability -->
  <path d="M 70 66 Q 80 73 90 66" stroke="#c07850" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Cheek blush: warm subsurface-scatter read — slightly deeper than pure pink for skin identity -->
  <ellipse cx="61" cy="59" rx="9" ry="5.5" fill="#e87070" opacity="0.18"/>
  <ellipse cx="99" cy="59" rx="9" ry="5.5" fill="#e87070" opacity="0.18"/>
</svg>
