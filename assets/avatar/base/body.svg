<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <!-- Head -->
  <circle cx="80" cy="50" r="30" fill="#F4C89C"/>
  <!-- Ears -->
  <circle cx="50" cy="52" r="8" fill="#F4C89C"/>
  <circle cx="110" cy="52" r="8" fill="#F4C89C"/>
  <!-- Neck -->
  <rect x="72" y="78" width="16" height="16" fill="#F4C89C"/>
  <!-- Body -->
  <rect x="40" y="92" width="80" height="88" rx="10" fill="#e0e0e0"/>
  <!-- Left arm -->
  <rect x="14" y="98" width="26" height="68" rx="11" fill="#e0e0e0"/>
  <!-- Right arm -->
  <rect x="120" y="98" width="26" height="68" rx="11" fill="#e0e0e0"/>
  <!-- Left hand -->
  <circle cx="27" cy="172" r="9" fill="#F4C89C"/>
  <!-- Right hand -->
  <circle cx="133" cy="172" r="9" fill="#F4C89C"/>
  <!-- Left leg -->
  <rect x="48" y="178" width="26" height="56" rx="10" fill="#9e9e9e"/>
  <!-- Right leg -->
  <rect x="86" y="178" width="26" height="56" rx="10" fill="#9e9e9e"/>
  <!-- Left shoe -->
  <ellipse cx="61" cy="235" rx="16" ry="6" fill="#616161"/>
  <!-- Right shoe -->
  <ellipse cx="99" cy="235" rx="16" ry="6" fill="#616161"/>
  <!-- Eyes -->
  <circle cx="68" cy="46" r="5" fill="#333"/>
  <circle cx="92" cy="46" r="5" fill="#333"/>
  <!-- Eye shine -->
  <circle cx="70" cy="44" r="2" fill="white"/>
  <circle cx="94" cy="44" r="2" fill="white"/>
  <!-- Nose -->
  <ellipse cx="80" cy="56" rx="3" ry="2" fill="#e0a070"/>
  <!-- Mouth -->
  <path d="M 70 64 Q 80 72 90 64" stroke="#c47a50" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Shirt collar -->
  <path d="M 64 92 L 80 108 L 96 92" fill="#d0d0d0" stroke="#bbb" stroke-width="1"/>
