<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <defs>
    <!-- Skin: warm golden-tan, applied to all exposed skin areas -->
    <linearGradient id="b2-sk" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%"   stop-color="#F5C49A"/>
      <stop offset="100%" stop-color="#E8A87C"/>
    </linearGradient>
    <!-- Shirt: blue-grey, upper-left light source (consistent with all armor/cape items) -->
    <linearGradient id="b2-sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7096a8"/>
      <stop offset="55%"  stop-color="#54717e"/>
      <stop offset="100%" stop-color="#364f5a"/>
    </linearGradient>
    <!-- Left arm: light hits the left face of the arm -->
    <linearGradient id="b2-aL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7aacbe"/>
      <stop offset="100%" stop-color="#364f5a"/>
    </linearGradient>
    <!-- Right arm: mirror of left (light hits right face) -->
    <linearGradient id="b2-aR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#7aacbe"/>
      <stop offset="100%" stop-color="#364f5a"/>
    </linearGradient>
    <!-- Pants: dark navy, top-lit -->
    <linearGradient id="b2-pa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3e5662"/>
      <stop offset="100%" stop-color="#1e2e36"/>
    </linearGradient>
  </defs>

  <!-- ── LOWER BODY ── -->

  <!-- Left leg: same bounds as original (x48 y178 w26 h56) — armor compat preserved -->
  <rect x="48" y="178" width="26" height="56" rx="11" fill="url(#b2-pa)" stroke="#172028" stroke-width="0.8"/>
  <!-- Left leg rim light — left edge catches scene light -->
  <line x1="49" y1="182" x2="49" y2="228" stroke="#5c7a8a" stroke-width="0.9" opacity="0.42"/>

  <!-- Right leg -->
  <rect x="86" y="178" width="26" height="56" rx="11" fill="url(#b2-pa)" stroke="#172028" stroke-width="0.8"/>
  <!-- Right leg outer rim light -->
  <line x1="111" y1="182" x2="111" y2="228" stroke="#5c7a8a" stroke-width="0.9" opacity="0.38"/>

  <!-- Left shoe -->
  <ellipse cx="61" cy="235" rx="17" ry="6" fill="#181818"/>
  <!-- Toe cap highlight -->
  <path d="M 48 232 Q 56 229 64 231" fill="none" stroke="#3c3c3c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Right shoe -->
  <ellipse cx="99" cy="235" rx="17" ry="6" fill="#181818"/>
  <path d="M 86 232 Q 94 229 102 231" fill="none" stroke="#3c3c3c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- ── TORSO ── -->

  <!-- Shirt body — same rect bounds (x40 y92 w80 h88) for full armor/cape compatibility -->
  <rect x="40" y="92" width="80" height="88" rx="10" fill="url(#b2-sh)" stroke="#2c404a" stroke-width="1"/>
  <!-- Left edge catch-light: upper-left light source -->
  <line x1="41" y1="96" x2="41" y2="174" stroke="#96bece" stroke-width="1.2" opacity="0.38"/>
  <!-- Vertical center seam: subtle garment construction read -->
  <line x1="80" y1="97" x2="80" y2="178" stroke="#2c404a" stroke-width="0.8" opacity="0.3"/>

  <!-- V-collar: cloth folds toward neck opening -->
  <path d="M 62 92 L 80 110 L 98 92" fill="#3a545e" stroke="#2c404a" stroke-width="1.1"/>
  <!-- Collar left-face catch-light -->
  <line x1="62" y1="92" x2="80" y2="110" stroke="#8ec0d2" stroke-width="0.8" opacity="0.35"/>

  <!-- Belt / waist band -->
  <rect x="40" y="174" width="80" height="9" rx="4" fill="#1c2930"/>
  <!-- Belt buckle -->
  <rect x="73" y="174" width="14" height="9" rx="2" fill="#37474f"/>
  <rect x="76" y="176" width="8" height="5" rx="1" fill="#455a64"/>
  <!-- Buckle bar highlight -->
  <line x1="76" y1="177" x2="84" y2="177" stroke="#78909c" stroke-width="0.7" opacity="0.55"/>

  <!-- ── ARMS — same rect bounds for armor arm-plate compatibility ── -->

  <!-- Left arm -->
  <rect x="14" y="98" width="26" height="68" rx="12" fill="url(#b2-aL)" stroke="#2c404a" stroke-width="1"/>
  <!-- Left arm rim light: left face catches scene light -->
  <line x1="15" y1="102" x2="15" y2="162" stroke="#96bece" stroke-width="1" opacity="0.38"/>
  <!-- Deltoid panel: muscle form hint -->
  <rect x="17" y="104" width="8" height="22" rx="4" fill="#9cc4d8" opacity="0.25"/>

  <!-- Right arm -->
  <rect x="120" y="98" width="26" height="68" rx="12" fill="url(#b2-aR)" stroke="#2c404a" stroke-width="1"/>
  <!-- Right arm rim light: right face catches scene light -->
  <line x1="145" y1="102" x2="145" y2="162" stroke="#96bece" stroke-width="1" opacity="0.35"/>
  <rect x="135" y="104" width="8" height="22" rx="4" fill="#9cc4d8" opacity="0.22"/>

  <!-- Hands: same center position (cx=27/133 cy=172) as original — full compat -->
  <circle cx="27" cy="172" r="10" fill="url(#b2-sk)" stroke="#d4956a" stroke-width="0.8"/>
  <circle cx="133" cy="172" r="10" fill="url(#b2-sk)" stroke="#d4956a" stroke-width="0.8"/>

  <!-- ── HEAD ── -->

  <!-- Neck: behind head -->
  <rect x="72" y="78" width="16" height="18" rx="7" fill="url(#b2-sk)"/>
  <!-- Neck center shadow: cylindrical form read -->
  <line x1="80" y1="79" x2="80" y2="95" stroke="#d4956a" stroke-width="1.5" opacity="0.18"/>

  <!-- Ears: behind head sphere -->
  <ellipse cx="50" cy="52" rx="8" ry="9" fill="url(#b2-sk)"/>
  <ellipse cx="110" cy="52" rx="8" ry="9" fill="url(#b2-sk)"/>
  <!-- Ear inner hollow: depth hint -->
  <ellipse cx="50" cy="53" rx="4.5" ry="5.5" fill="#d4956a" opacity="0.28"/>
  <ellipse cx="110" cy="53" rx="4.5" ry="5.5" fill="#d4956a" opacity="0.28"/>

  <!-- Head sphere — POSITION LOCKED: cx=80 cy=50 r=30
       All face/headwear cosmetics are authored to this anchor. -->
  <circle cx="80" cy="50" r="30" fill="url(#b2-sk)"/>
  <!-- Right-face shadow: very subtle spherical form read (not realism — just presence) -->
  <path d="M 80 20 A 30 30 0 0 1 80 80 Q 104 74 110 56 Q 114 40 106 28 Q 96 20 80 20 Z"
        fill="#d4956a" opacity="0.07"/>

  <!-- Hair: minimal dark cap — headwear items sit at z=5, cover this cleanly.
       Simple enough to read at 60×90px (hub avatar), warm enough to be the default character. -->
  <path d="M 52 44 Q 50 20 80 19 Q 110 20 108 44 Q 98 28 80 28 Q 62 28 52 44 Z"
        fill="#4a3626"/>
  <!-- Hair specular: single highlight line, consistent upper-left light -->
  <path d="M 60 27 Q 74 22 90 25" fill="none" stroke="#7d5c44" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
  <!-- Temple strands: ground the hair cap to the head form -->
  <path d="M 52 44 Q 50 53 51 58" stroke="#4a3626" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M 108 44 Q 110 53 109 58" stroke="#4a3626" stroke-width="2.8" fill="none" stroke-linecap="round"/>

  <!-- ── FACE ── -->

  <!-- Eyebrows: warm brown, gentle arch — most readable facial element at small scale -->
  <path d="M 61 38.5 Q 67.5 36 74 38.5" fill="none" stroke="#4a3626" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M 86 38.5 Q 92.5 36 99 38.5" fill="none" stroke="#4a3626" stroke-width="1.9" stroke-linecap="round"/>

  <!-- Eyes: sclera white base — POSITION LOCKED: cx=68/92 cy=47, matching hero-mask lens alignment -->
  <ellipse cx="68" cy="47" rx="7" ry="6" fill="white"/>
  <ellipse cx="92" cy="47" rx="7" ry="6" fill="white"/>
  <!-- Iris: warm amber-brown — color identity for the default character -->
  <circle cx="68" cy="47" r="4.5" fill="#6B4226"/>
  <circle cx="92" cy="47" r="4.5" fill="#6B4226"/>
  <!-- Pupil -->
  <circle cx="68" cy="47" r="2.5" fill="#180c05"/>
  <circle cx="92" cy="47" r="2.5" fill="#180c05"/>
  <!-- Primary eye shine: upper-left position matches scene light source -->
  <circle cx="70" cy="44.5" r="1.9" fill="white"/>
  <circle cx="94" cy="44.5" r="1.9" fill="white"/>
  <!-- Secondary micro-shine: depth and life at any scale -->
  <circle cx="66" cy="48" r="0.9" fill="white" opacity="0.5"/>
  <circle cx="90" cy="48" r="0.9" fill="white" opacity="0.5"/>
  <!-- Upper eyelid crease: defines eye plane, readable at 60px -->
  <path d="M 61 43 Q 68 40.5 75 43" fill="none" stroke="#1a0e06" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 85 43 Q 92 40.5 99 43" fill="none" stroke="#1a0e06" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Nose: V-bridge with nostril dots — never dominant, always supportive -->
  <path d="M 77 57 Q 78 62 80 62.5 Q 82 62 83 57" fill="none" stroke="#c07850" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="77" cy="61.5" r="1.1" fill="#c07850" opacity="0.38"/>
  <circle cx="83" cy="61.5" r="1.1" fill="#c07850" opacity="0.38"/>

  <!-- Mouth: upward smile — warmth, educational context, approachability -->
  <path d="M 70 66 Q 80 73 90 66" stroke="#c07850" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Cheek blush: soft educational warmth — very low opacity, disappears at small scale gracefully -->
  <ellipse cx="61" cy="59" rx="9" ry="5.5" fill="#F4A0A0" opacity="0.15"/>
  <ellipse cx="99" cy="59" rx="9" ry="5.5" fill="#F4A0A0" opacity="0.15"/>
</svg>
