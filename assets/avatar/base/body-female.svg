<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <!-- Section 152C: female body variant.
       LOCKED zones are byte-identical to body.svg (neutral): head sphere
       cx=80 cy=50 r=30, ears, full face, skin gradient, arm outer rects
       x=14/120 y=98 w=26 h=68, hands, cape anchors x=46/114 y=88, belt
       rect x=40 y=174 w=80 h=9, pants/legs/shoes, foot line y=235.
       FLEXIBLE deltas: tapered waist with gentle A-line tunic hem
       (C controls 47/113, hem flares back to x=39/121 above the belt),
       scoop neckline instead of V-collar, sage-teal clothing palette
       (gender-neutral hue — outfit identity, not gender color-coding).
       Hair renders as the shared identity hair layer (z=4). -->
  <defs>
    <!-- Skin: identical to neutral (expressions + blink eyelid depend on it) -->
    <linearGradient id="b2-sk" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%"   stop-color="#F5C49A"/>
      <stop offset="100%" stop-color="#E8A87C"/>
    </linearGradient>
    <!-- Tunic: sage-teal, upper-left light source -->
    <linearGradient id="b2-sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7d9d92"/>
      <stop offset="55%"  stop-color="#5d7d72"/>
      <stop offset="100%" stop-color="#3c5650"/>
    </linearGradient>
    <!-- Left arm: light hits the left face of the arm -->
    <linearGradient id="b2-aL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8aaa9e"/>
      <stop offset="100%" stop-color="#3c5650"/>
    </linearGradient>
    <!-- Right arm: mirror of left -->
    <linearGradient id="b2-aR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#8aaa9e"/>
      <stop offset="100%" stop-color="#3c5650"/>
    </linearGradient>
    <!-- Pants: identical to neutral -->
    <linearGradient id="b2-pa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3e5662"/>
      <stop offset="100%" stop-color="#1e2e36"/>
    </linearGradient>
  </defs>

  <!-- ── LOWER BODY (identical to neutral) ── -->

  <path d="M 50 178 L 72 178 Q 74 180 74 188 L 70 232 Q 69 234 65 234 L 57 234 Q 53 234 52 232 L 48 188 Q 48 180 50 178 Z"
        fill="url(#b2-pa)" stroke="#172028" stroke-width="0.8"/>
  <line x1="49" y1="182" x2="51" y2="228" stroke="#5c7a8a" stroke-width="0.9" opacity="0.42"/>

  <path d="M 110 178 L 88 178 Q 86 180 86 188 L 90 232 Q 91 234 95 234 L 103 234 Q 107 234 108 232 L 112 188 Q 112 180 110 178 Z"
        fill="url(#b2-pa)" stroke="#172028" stroke-width="0.8"/>
  <line x1="111" y1="182" x2="109" y2="228" stroke="#5c7a8a" stroke-width="0.9" opacity="0.38"/>

  <path d="M 74 182 L 71 228" stroke="#172028" stroke-width="2.5" opacity="0.28" stroke-linecap="round"/>
  <path d="M 86 182 L 89 228" stroke="#172028" stroke-width="2.5" opacity="0.28" stroke-linecap="round"/>

  <ellipse cx="61" cy="204" rx="9.5" ry="5" fill="#4a6574" opacity="0.13"/>
  <ellipse cx="99" cy="204" rx="10.5" ry="6.5" fill="#4a6574" opacity="0.20"/>

  <ellipse cx="61" cy="235" rx="16.5" ry="5.5" fill="#181818"/>
  <path d="M 48 232 Q 56 229 64 231" fill="none" stroke="#3c3c3c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <ellipse cx="99" cy="235" rx="17.5" ry="6.5" fill="#181818"/>
  <path d="M 86 232 Q 94 229 102 231" fill="none" stroke="#3c3c3c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- ── TORSO ── -->

  <!-- Female: tapered waist (C controls 47/113) with gentle A-line tunic hem
       flaring back to x=39/121 just above the belt. Modest taper by design —
       the documented arm-gap constraint (arm inner edge x=40) caps how deep
       the waist can pinch. Shoulder/belt anchor zones untouched. -->
  <path d="M 50 91 Q 38 91 38 103 Q 38 117 40 130 C 47 140 47 156 42 166 Q 40 172 39 178 L 39 180 L 121 180 Q 120 172 118 166 C 113 156 113 140 120 130 Q 122 119 122 105 Q 122 93 110 93 Z"
        fill="url(#b2-sh)" stroke="#2e463f" stroke-width="1"/>
  <line x1="39" y1="95" x2="41" y2="172" stroke="#aac8ba" stroke-width="1.2" opacity="0.38"/>
  <line x1="80" y1="97" x2="80" y2="178" stroke="#2e463f" stroke-width="0.8" opacity="0.3"/>

  <ellipse cx="80" cy="116" rx="22" ry="16" fill="#aac8ba" opacity="0.07"/>
  <path d="M 67 100 Q 72 110 74 120" fill="none" stroke="#2e463f" stroke-width="0.9" opacity="0.18"/>
  <path d="M 93 100 Q 88 110 86 120" fill="none" stroke="#2e463f" stroke-width="0.9" opacity="0.18"/>

  <!-- Waist side shadows: follow the tapered waist line -->
  <path d="M 42 146 Q 36 161 40 176" fill="none" stroke="#1d2f29" stroke-width="5" opacity="0.26" stroke-linecap="round"/>
  <path d="M 118 146 Q 124 161 120 176" fill="none" stroke="#1d2f29" stroke-width="5" opacity="0.26" stroke-linecap="round"/>

  <path d="M 38 102 Q 39 112 40 122" fill="none" stroke="#1d2f29" stroke-width="2.2" opacity="0.24"/>
  <path d="M 122 104 Q 121 114 120 124" fill="none" stroke="#1d2f29" stroke-width="2.2" opacity="0.24"/>

  <!-- Tunic hem edge — visible just above the belt -->
  <path d="M 39 171 Q 80 176 121 171" fill="none" stroke="#1d2f29" stroke-width="1.2" opacity="0.35"/>

  <!-- Scoop neckline (replaces the neutral V-collar) -->
  <path d="M 65 91 Q 72 86 80 85 Q 88 86 95 91" fill="none" stroke="#5f8276" stroke-width="0.9" opacity="0.42" stroke-linecap="round"/>
  <path d="M 64 91 Q 80 105 96 91 Q 90 100 80 102 Q 70 100 64 91 Z" fill="#48655c" stroke="#2e463f" stroke-width="1"/>
  <path d="M 66 93 Q 80 104 94 93" fill="none" stroke="#1d2f29" stroke-width="1.2" opacity="0.38"/>
  <line x1="66" y1="92" x2="72" y2="97" stroke="#9cc2b2" stroke-width="0.8" opacity="0.35"/>

  <!-- Belt / waist band (identical to neutral) -->
  <rect x="40" y="174" width="80" height="9" rx="4" fill="#1c2930"/>
  <rect x="73" y="174" width="14" height="9" rx="2" fill="#37474f"/>
  <rect x="76" y="176" width="8" height="5" rx="1" fill="#455a64"/>
  <line x1="76" y1="177" x2="84" y2="177" stroke="#78909c" stroke-width="0.7" opacity="0.55"/>

  <!-- ── ARMS (outer geometry identical to neutral; sleeve colors follow tunic) ── -->

  <path d="M 16 98 L 38 98 Q 40 100 40 110 L 39 142 L 36 164 Q 35 166 32 166 L 22 166 Q 19 166 18 164 L 15 142 L 14 110 Q 14 100 16 98 Z"
        fill="url(#b2-aL)" stroke="#2e463f" stroke-width="1"/>
  <line x1="15" y1="102" x2="15" y2="160" stroke="#aac8ba" stroke-width="1" opacity="0.38"/>
  <path d="M 14 100 Q 16 97 24 100 Q 30 103 28 114 Q 24 122 16 120 Q 14 112 14 100 Z"
        fill="#a8c8ba" opacity="0.32"/>

  <path d="M 144 98 L 122 98 Q 120 100 120 110 L 121 142 L 124 164 Q 125 166 128 166 L 138 166 Q 141 166 142 164 L 145 142 L 146 110 Q 146 100 144 98 Z"
        fill="url(#b2-aR)" stroke="#2e463f" stroke-width="1"/>
  <line x1="145" y1="102" x2="145" y2="160" stroke="#aac8ba" stroke-width="1" opacity="0.35"/>
  <path d="M 146 100 Q 144 97 136 100 Q 130 103 132 114 Q 136 122 144 120 Q 146 112 146 100 Z"
        fill="#a8c8ba" opacity="0.28"/>

  <path d="M 36 142 Q 37 155 36 164" fill="none" stroke="#172028" stroke-width="3.5" opacity="0.22" stroke-linecap="round"/>
  <path d="M 124 140 Q 120 153 121 163" fill="none" stroke="#172028" stroke-width="3.5" opacity="0.22" stroke-linecap="round"/>

  <path d="M 17 143 Q 25 148 34 143" fill="none" stroke="#2e463f" stroke-width="1" opacity="0.14"/>
  <path d="M 143 141 Q 134 146 125 141" fill="none" stroke="#2e463f" stroke-width="1" opacity="0.14"/>

  <!-- Hands (identical to neutral — skin) -->
  <path d="M 35 165 Q 41 162 42 166 Q 42 171 38 173 Q 34 171 35 165 Z"
        fill="url(#b2-sk)" stroke="#d4956a" stroke-width="0.7" stroke-linejoin="round"/>
  <ellipse cx="27" cy="173" rx="10" ry="9" fill="url(#b2-sk)" stroke="#d4956a" stroke-width="0.8"/>
  <path d="M 125 165 Q 119 162 118 166 Q 118 171 122 173 Q 126 171 125 165 Z"
        fill="url(#b2-sk)" stroke="#d4956a" stroke-width="0.7" stroke-linejoin="round"/>
  <ellipse cx="133" cy="173" rx="10" ry="9" fill="url(#b2-sk)" stroke="#d4956a" stroke-width="0.8"/>
  <path d="M 18 171 Q 27 168 36 171" fill="none" stroke="#c07850" stroke-width="0.9" opacity="0.20"/>
  <path d="M 124 171 Q 133 168 142 171" fill="none" stroke="#c07850" stroke-width="0.9" opacity="0.20"/>
  <path d="M 18 165 Q 27 162 36 165" fill="none" stroke="#2e463f" stroke-width="0.9" opacity="0.22"/>
  <path d="M 124 165 Q 133 162 142 165" fill="none" stroke="#2e463f" stroke-width="0.9" opacity="0.22"/>

  <!-- Shoulder caps: softer fill — narrower female read, same paths -->
  <path d="M 50 92 Q 36 89 18 100 Q 12 110 16 121 Q 23 119 33 112 Q 40 103 40 96 Z"
        fill="#8aaa9e" opacity="0.26"/>
  <path d="M 50 92 Q 36 89 18 100" fill="none" stroke="#b8d8c8" stroke-width="0.9" opacity="0.38"/>

  <path d="M 110 94 Q 124 93 142 101 Q 148 111 144 122 Q 137 120 127 113 Q 120 105 120 98 Z"
        fill="#8aaa9e" opacity="0.22"/>
  <path d="M 110 94 Q 124 93 142 101" fill="none" stroke="#b8d8c8" stroke-width="0.9" opacity="0.32"/>

  <!-- ── HEAD (identical to neutral) ── -->

  <rect x="72" y="78" width="16" height="18" rx="7" fill="url(#b2-sk)"/>
  <line x1="80" y1="79" x2="80" y2="95" stroke="#d4956a" stroke-width="1.5" opacity="0.18"/>
  <path d="M 72 80 Q 71 88 72 94" fill="none" stroke="#d4956a" stroke-width="1.5" opacity="0.16"/>
  <path d="M 88 80 Q 89 88 88 94" fill="none" stroke="#d4956a" stroke-width="1.5" opacity="0.14"/>

  <path d="M 40 91 Q 56 86 72 90 Q 68 96 58 101 Q 48 99 40 95 Z" fill="#1c2930" opacity="0.14"/>
  <path d="M 120 93 Q 104 88 88 92 Q 92 98 102 103 Q 112 101 120 97 Z" fill="#1c2930" opacity="0.14"/>

  <ellipse cx="50" cy="52" rx="8" ry="9" fill="url(#b2-sk)"/>
  <ellipse cx="110" cy="52" rx="8" ry="9" fill="url(#b2-sk)"/>
  <ellipse cx="50" cy="53" rx="4.5" ry="5.5" fill="#d4956a" opacity="0.28"/>
  <ellipse cx="110" cy="53" rx="4.5" ry="5.5" fill="#d4956a" opacity="0.28"/>

  <!-- Head sphere — POSITION LOCKED: cx=80 cy=50 r=30 -->
  <circle cx="80" cy="50" r="30" fill="url(#b2-sk)"/>
  <path d="M 80 20 A 30 30 0 0 1 80 80 Q 104 74 110 56 Q 114 40 106 28 Q 96 20 80 20 Z"
        fill="#d4956a" opacity="0.10"/>

  <path d="M 68 77 Q 80 82 92 77" fill="none" stroke="#c07850" stroke-width="2.5" opacity="0.27"/>

  <!-- ── HAIR ── -->
  <!-- Hair decoupled (Section 152B) — renders as the shared identity hair
       layer (hair-default.svg) at the hair slot z-level (z=4). -->

  <!-- ── FACE (identical to neutral — matches expr-neutral.svg) ── -->

  <path d="M 61 38.5 Q 67.5 35.5 74 38.5" fill="none" stroke="#4a3626" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 86 38.5 Q 92.5 35.5 99 38.5" fill="none" stroke="#4a3626" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Eyes: POSITION LOCKED: cx=68/92 cy=47 -->
  <ellipse cx="68" cy="47" rx="7" ry="6" fill="white"/>
  <ellipse cx="92" cy="47" rx="7" ry="6" fill="white"/>
  <circle cx="68" cy="47" r="4.8" fill="#6B4226"/>
  <circle cx="92" cy="47" r="4.8" fill="#6B4226"/>
  <circle cx="68" cy="47" r="2.5" fill="#180c05"/>
  <circle cx="92" cy="47" r="2.5" fill="#180c05"/>
  <circle cx="70" cy="44.5" r="1.9" fill="white"/>
  <circle cx="94" cy="44.5" r="1.9" fill="white"/>
  <circle cx="66" cy="48" r="0.9" fill="white" opacity="0.5"/>
  <circle cx="90" cy="48" r="0.9" fill="white" opacity="0.5"/>
  <ellipse cx="68" cy="53" rx="5" ry="1.5" fill="#c07850" opacity="0.09"/>
  <ellipse cx="92" cy="53" rx="5" ry="1.5" fill="#c07850" opacity="0.09"/>
  <path d="M 61 43 Q 68 40.5 75 41" fill="none" stroke="#1a0e06" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 85 43 Q 92 40.5 99 41" fill="none" stroke="#1a0e06" stroke-width="1.6" stroke-linecap="round"/>

  <path d="M 77 57 Q 78 62 80 62.5 Q 82 62 83 57" fill="none" stroke="#c07850" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="77" cy="61.5" r="1.1" fill="#c07850" opacity="0.38"/>
  <circle cx="83" cy="61.5" r="1.1" fill="#c07850" opacity="0.38"/>

  <path d="M 70 66 Q 80 73 90 66" stroke="#c07850" stroke-width="2" fill="none" stroke-linecap="round"/>

  <ellipse cx="61" cy="59" rx="9" ry="5.5" fill="#e87070" opacity="0.18"/>
  <ellipse cx="99" cy="59" rx="9" ry="5.5" fill="#e87070" opacity="0.18"/>
</svg>
