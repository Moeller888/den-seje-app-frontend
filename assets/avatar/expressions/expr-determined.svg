<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <!-- Section 152E: skin-tone circle + highlight removed. This overlay now
       contributes ONLY face features (brows, eyes, mouth, blush) on a
       transparent ground, so the body's skin tone (medium or dark) shows
       through unmodified. -->
  <!-- Hair removed (Section 152B) — renders as the identity hair layer (z=4) above this overlay -->

  <!-- DETERMINED: inner brow corners pulled 1.5px lower — subtle furrowing -->
  <!-- Corrugator signal (drawn-together inner brows) suggests resolve, not anger -->
  <!-- Left: inner end from (61,38.5) to (62,40); peak from y=36 to y=37.5 -->
  <path d="M 62 40 Q 67.5 37.5 73 38.5" fill="none" stroke="#4a3626" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right: inner end from (86,38.5) to (87,38.5); outer from (99,38.5) to (98,40); peak y=37.5 -->
  <path d="M 87 38.5 Q 92.5 37.5 98 40" fill="none" stroke="#4a3626" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Brow bridge shadow: barely perceptible center furrow — felt not seen -->
  <path d="M 73 38.5 Q 80 41 87 38.5" fill="none" stroke="#c07850" stroke-width="0.8" opacity="0.20"/>
  <ellipse cx="68" cy="47" rx="7" ry="6" fill="white"/>
  <ellipse cx="92" cy="47" rx="7" ry="6" fill="white"/>
  <circle cx="68" cy="47" r="4.8" fill="#6B4226"/>
  <circle cx="92" cy="47" r="4.8" fill="#6B4226"/>
  <circle cx="68" cy="47" r="2.5" fill="#180c05"/>
  <circle cx="92" cy="47" r="2.5" fill="#180c05"/>
  <circle cx="70" cy="44.5" r="1.9" fill="white"/>
  <circle cx="94" cy="44.5" r="1.9" fill="white"/>
  <circle cx="66" cy="48" r="0.9" fill="white" opacity="0.5"/>
  <circle cx="90" cy="48" r="0.9" fill="white" opacity="0.5"/>
  <!-- DETERMINED: eyelid 0.5px lower, slightly heavier — steady resolute gaze -->
  <path d="M 61 43.5 Q 68 41 75 42" fill="none" stroke="#1a0e06" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 85 43.5 Q 92 41 99 42" fill="none" stroke="#1a0e06" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 77 57 Q 78 62 80 62.5 Q 82 62 83 57" fill="none" stroke="#c07850" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="77" cy="61.5" r="1.1" fill="#c07850" opacity="0.38"/>
  <circle cx="83" cy="61.5" r="1.1" fill="#c07850" opacity="0.38"/>
  <!-- DETERMINED: firm mouth — set jaw, resolute, not displeased -->
  <!-- Control point y=70 (vs 73 neutral) — same endpoints, tighter curve -->
  <path d="M 71 67 Q 80 70.5 89 67" stroke="#c07850" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="61" cy="59" rx="9" ry="5.5" fill="#F4A0A0" opacity="0.12"/>
  <ellipse cx="99" cy="59" rx="9" ry="5.5" fill="#F4A0A0" opacity="0.12"/>
</svg>
