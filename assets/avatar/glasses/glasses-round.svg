<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <!-- Frame outer rings -->
  <circle cx="66" cy="46" r="13" fill="none" stroke="#1a1a1a" stroke-width="3.5"/>
  <circle cx="94" cy="46" r="13" fill="none" stroke="#1a1a1a" stroke-width="3.5"/>
  <!-- Lens tint -->
  <circle cx="66" cy="46" r="11" fill="rgba(100,181,246,0.3)"/>
  <circle cx="94" cy="46" r="11" fill="rgba(100,181,246,0.3)"/>
  <!-- Frame inner ring detail -->
  <circle cx="66" cy="46" r="10" fill="none" stroke="#3a3a3a" stroke-width="0.8"/>
  <circle cx="94" cy="46" r="10" fill="none" stroke="#3a3a3a" stroke-width="0.8"/>
  <!-- Bridge -->
  <path d="M 79 46 Q 80 43 81 46" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left temple arm -->
  <path d="M 53 44 Q 44 41 38 48" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right temple arm -->
  <path d="M 107 44 Q 116 41 122 48" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Main lens shine — arc catch-light (more realistic than a circle blob) -->
  <path d="M 59 39 Q 63 37 67 40" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
  <path d="M 87 39 Q 91 37 95 40" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
  <!-- Small secondary shine -->
  <circle cx="63" cy="44" r="1.1" fill="white" opacity="0.25"/>
  <circle cx="91" cy="44" r="1.1" fill="white" opacity="0.25"/>
</svg>
