<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240">
  <!-- Frame outer rings -->
  <circle cx="66" cy="46" r="13" fill="none" stroke="#222" stroke-width="3.5"/>
  <circle cx="94" cy="46" r="13" fill="none" stroke="#222" stroke-width="3.5"/>
  <!-- Lens tint -->
  <circle cx="66" cy="46" r="11" fill="rgba(100,181,246,0.3)"/>
  <circle cx="94" cy="46" r="11" fill="rgba(100,181,246,0.3)"/>
  <!-- Frame inner ring detail -->
  <circle cx="66" cy="46" r="10" fill="none" stroke="#444" stroke-width="0.8"/>
  <circle cx="94" cy="46" r="10" fill="none" stroke="#444" stroke-width="0.8"/>
  <!-- Bridge -->
  <path d="M 79 46 Q 80 43 81 46" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left temple arm -->
  <path d="M 53 44 Q 44 41 38 48" fill="none" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right temple arm -->
  <path d="M 107 44 Q 116 41 122 48" fill="none" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Main lens shine left -->
  <circle cx="61" cy="41" r="3.5" fill="white" opacity="0.38"/>
  <!-- Small secondary shine left -->
  <circle cx="63" cy="44" r="1.2" fill="white" opacity="0.22"/>
  <!-- Main lens shine right -->
  <circle cx="89" cy="41" r="3.5" fill="white" opacity="0.38"/>
  <!-- Small secondary shine right -->
  <circle cx="91" cy="44" r="1.2" fill="white" opacity="0.22"/>
</svg>
