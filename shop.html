<!DOCTYPE html>
<html lang="da" data-theme="default">
<head>
  <!-- Anti-flicker: apply cached theme synchronously before CSS renders -->
  <script>
  (function(){var k='dsj_active_theme',v=['default','ice','inferno','void','forest','sakura','aurora','pearl','meadow','rose-gold'];try{var t=sessionStorage.getItem(k);if(t&&v.indexOf(t)!==-1)document.documentElement.dataset.theme=t;}catch{}}());
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Butik – DEN SEJE APP</title>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px;
    }

    /* ── Top bar ─────────────────────────────────────────── */

    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .back-btn {
      padding: 8px 14px;
      background: var(--btn-bg);
      color: var(--text-dim);
      border: 1px solid var(--border-btn);
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.12s, color 0.12s;
    }

    .back-btn:hover { background: var(--btn-bg-hover); color: var(--text-main); }

    .topbar h1 { font-size: 20px; font-weight: bold; color: var(--text-bright); }

    .coins-display {
      margin-left: auto;
      font-size: 15px;
      color: var(--coin);
      font-weight: bold;
      white-space: nowrap;
    }

    /* ── Section header ──────────────────────────────────── */

    .section-header {
      font-size: 11px;
      font-weight: bold;
      color: var(--text-label);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Category tabs ───────────────────────────────────── */

    .category-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .cat-tab {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-btn);
      background: var(--btn-bg);
      color: var(--text-dim);
      font-size: 13px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
      white-space: nowrap;
    }

    .cat-tab:hover {
      background: var(--btn-bg-hover);
      color: var(--text-main);
    }

    .cat-tab--active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .cat-tab--active:hover {
      background: var(--accent);
      color: #fff;
      opacity: 0.9;
    }

    /* ── Shop grid ───────────────────────────────────────── */

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(188px, 1fr));
      gap: 20px;
    }

    /* ── Shop card ───────────────────────────────────────── */

    .shop-card {
      position: relative;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      /* data-slot-type, data-rarity, data-item-id set in JS (F5) */
    }

    .shop-card:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.38);
    }

    /* Rarity border / glow variants */
    .shop-card[data-rarity="uncommon"] {
      border-color: var(--border-uncommon);
    }

    .shop-card[data-rarity="rare"] {
      border-color: var(--border-rare);
      box-shadow: 0 0 10px rgba(25, 118, 210, 0.16);
    }
    .shop-card[data-rarity="rare"]:hover {
      box-shadow: 0 8px 24px rgba(25, 118, 210, 0.28);
    }

    .shop-card[data-rarity="legendary"] {
      border-color: var(--border-legendary);
      background: linear-gradient(160deg, #14102e 75%, #1c1400 100%);
      box-shadow: 0 0 16px rgba(255, 160, 0, 0.2), inset 0 0 0 1px rgba(255, 215, 0, 0.06);
    }
    .shop-card[data-rarity="legendary"]:hover {
      transform: translateY(-3px) scale(1.015);
      box-shadow: 0 10px 32px rgba(255, 160, 0, 0.36);
    }

    /* Legendary sparkle corner accents (static — no animation) */
    .shop-card[data-rarity="legendary"]::before {
      content: "✦";
      position: absolute;
      top: 7px; right: 9px;
      font-size: 9px; color: var(--coin); opacity: 0.6;
      pointer-events: none;
    }
    .shop-card[data-rarity="legendary"]::after {
      content: "✦";
      position: absolute;
      bottom: 7px; left: 9px;
      font-size: 7px; color: var(--coin); opacity: 0.35;
      pointer-events: none;
    }

    /* Owned cards */
    .shop-card.is-owned { opacity: 0.68; }
    .shop-card.is-owned .item-name { color: var(--text-muted); }

    /* ── Character stage preview ─────────────────────────
     * Fluid width fills the card proportionally (no narrow tube).
     * Gradient fades to transparent — avatar floats atmospherically
     * against the card background instead of sitting in a dark oval box.
     * overflow:hidden + reduced height = less vertical dominance.
     * ──────────────────────────────────────────────────── */

    .shop-preview {
      position: relative;
      isolation: isolate;
      width: calc(100% - 4px);
      max-width: 130px;
      height: 152px;
      margin: 0 auto 14px;
      border-radius: 8px;
      background: radial-gradient(ellipse at 50% 38%, var(--avatar-inner) 0%, transparent 70%);
      overflow: hidden;
      transition: transform 0.14s ease;
    }

    .shop-card:hover .shop-preview {
      transform: scale(1.02);
    }

    /* Legendary: proportionally wider stage */
    .shop-card[data-rarity="legendary"] .shop-preview {
      max-width: 146px;
      height: 170px;
    }

    /* Layers fill the stage — slightly more generous than previous inset */
    .preview-layer {
      position: absolute;
      top: 3%; left: 6%;
      width: 88%; height: 93%;
      object-fit: contain;
      pointer-events: none;
    }

    /* ── "Ny!" badge (and future label variants) ─────────── */
    /* Positioned on .shop-preview (top-left SVG corner is sparse). */
    /* Future badges (Event, Limited, Sale) follow the same pattern */
    /* with different color/position combos via modifier classes.   */
    .badge-new {
      position: absolute;
      top: 5px;
      left: 5px;
      z-index: 10;
      background: var(--badge-new);
      color: white;
      font-size: 9px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      pointer-events: none;
      line-height: 1.4;
    }

    /* ── Card text + actions ─────────────────────────────── */

    .item-name {
      font-size: 13px;
      font-weight: bold;
      color: var(--text-main);
      margin-bottom: 5px;
      line-height: 1.2;
    }

    .shop-card[data-rarity="legendary"] .item-name { color: var(--coin); }

    .rarity-badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      color: white;
      margin-bottom: 6px;
    }

    .price-tag {
      font-size: 13px;
      color: var(--coin);
      font-weight: bold;
      margin-bottom: 8px;
    }
    .price-tag .price-unit {
      font-size: 11px;
      color: var(--coin-dim);
      font-weight: normal;
    }

    /* F5: placeholder for future bundle/set badge — always in DOM, empty for now */
    .card-badge {
      min-height: 14px;
      margin-bottom: 6px;
      font-size: 9px;
      color: var(--synergy-hint);
      letter-spacing: 0.5px;
      font-style: italic;
    }

    .buy-btn {
      display: block;
      width: 100%;
      padding: 9px 4px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      color: white;
      background: var(--accent);
      transition: opacity 0.1s;
    }
    .buy-btn:hover:not(:disabled) { opacity: 0.88; }
    .buy-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .owned-indicator {
      font-size: 11px;
      color: var(--success-text);
      text-align: center;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .avatar-cta-btn {
      display: block;
      width: 100%;
      padding: 7px 4px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      color: var(--avatar-cta-text);
      background: var(--avatar-cta-bg);
      border: 1px solid var(--accent);
      text-align: center;
      transition: background 0.12s, color 0.12s;
    }
    .avatar-cta-btn:hover { background: var(--avatar-cta-bg-hover); color: var(--avatar-cta-text-hover); }

    /* ── Coin spend flash ────────────────────────────────── */
    @keyframes coinSpendFlash {
      0%   { transform: scale(1);    opacity: 1;    }
      30%  { transform: scale(0.86); opacity: 0.6;  }
      100% { transform: scale(1);    opacity: 1;    }
    }
    .coins-spend-flash {
      display: inline-block;
      animation: coinSpendFlash 320ms ease;
    }

    /* ── Post-purchase success state ────────────────────── */

    .buy-success-state {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .bought-success {
      font-size: 12px;
      font-weight: bold;
      color: var(--success-text);
      text-align: center;
      padding: 4px 0;
    }

    .equip-now-btn {
      display: block;
      width: 100%;
      padding: 8px 4px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      color: white;
      background: var(--success-deep);
      transition: opacity 0.1s;
    }
    .equip-now-btn:hover:not(:disabled) { opacity: 0.88; }
    .equip-now-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .later-btn {
      display: block;
      width: 100%;
      padding: 5px 4px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      color: var(--text-label);
      transition: border-color 0.1s, color 0.1s;
    }
    .later-btn:hover { border-color: #4444aa; color: #9999cc; }

    /* ── States ──────────────────────────────────────────── */

    .shop-empty {
      color: var(--text-faint);
      font-size: 15px;
      padding: 40px 16px;
      text-align: center;
      grid-column: 1 / -1;
    }

    .shop-error {
      color: var(--error-bright);
      font-size: 14px;
      text-align: center;
      padding: 32px;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="window.location.href='hub.html'">&#8592; Tilbage</button>
  <h1>Butik</h1>
  <span class="coins-display" id="coinsDisplay">&#x1FA99; ...</span>
</div>

<div class="section-header">Tilgængelige items</div>
<div class="category-tabs" id="categoryTabs">
  <button class="cat-tab cat-tab--active" data-cat="alle">Alle</button>
  <button class="cat-tab" data-cat="hoved">Hoved</button>
  <button class="cat-tab" data-cat="ansigt">Ansigt</button>
  <button class="cat-tab" data-cat="ryg">Ryg</button>
  <button class="cat-tab" data-cat="krop">Krop</button>
  <button class="cat-tab" data-cat="effekter">Effekter</button>
</div>
<div class="shop-grid" id="shopGrid"></div>

<script type="module">
import { supabase }   from "./supabaseClient.js";
import { showToast }  from "./js/toast.js";
import { playSound }  from "./js/audio.js";
import { emit }       from "./js/events.js";
import { initBadges, addBadge, hasBadge } from "./js/newBadges.js";
import { loadTheme }  from "./js/themeManager.js";
import {
  baseLayersFor, SLOT_Z, RARITY_COLORS, RARITY_LABELS, RARITY_SORT_ORDER, SHOP_CATEGORIES, isAvatarV2,
} from "./js/avatar-layers.js";
import { mountC2Avatar } from "./js/avatar-render-c2.js";

// ── Auth ──────────────────────────────────────────────────────────────────────

const { data: sessionData } = await supabase.auth.getSession();
if (!sessionData.session) {
  window.location.replace("login.html");
  throw new Error("Unauthorized");
}

const userId = sessionData.session?.user?.id ?? null;

loadTheme().catch(() => {});

window.addEventListener("pageshow", async (event) => {
  if (event.persisted) {
    const { data } = await supabase.auth.getSession();
    if (!data.session) window.location.replace("login.html");
  }
});

// ── Constants ─────────────────────────────────────────────────────────────────
// BASE_SRC, SLOT_Z, RARITY_COLORS, RARITY_LABELS, RARITY_SORT_ORDER, SHOP_CATEGORIES — from avatar-layers.js

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqemJlaHdmYWdpd3B3b2RzZ3dnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2ODc5OTQsImV4cCI6MjA4NzI2Mzk5NH0.BzepnYLe6Khzqx9vTL3Ifa_zMRgjoGQ9Lw5seaoKMMc";

// ── Mini paper-doll preview ────────────────────────────────────────────────────
function createMiniPaperDoll(imageUrl, slotType, isNew) {
  const wrap = document.createElement("div");
  wrap.className = "shop-preview";

  // Build layer list, sort by z ascending, append in that order.
  // Matches avatar.html + gamefeel.html exactly:
  // back (z=-1) appended before body (z=0) → body paints on top → correct occlusion.
  // The old approach elevated back items to z=2 which put capes/wings IN FRONT of the body.
  if (slotType) {
    // Section 155G: C2 render pipeline behind AVATAR_V2 (default OFF). Base + hair
    // via the shared module; the previewed item layer is appended on top (z-index
    // governs compositing regardless of append order).
    if (isAvatarV2()) {
      mountC2Avatar(wrap, null, { layerClass: "preview-layer" }).then(() => {
        if (imageUrl) {
          const img = document.createElement("img");
          img.className = "preview-layer";
          img.src = imageUrl;
          img.style.zIndex = String(SLOT_Z[slotType] ?? 1);
          img.alt = "";
          wrap.appendChild(img);
        }
      });
    } else {
      // Section 152A/152B: shop previews are deliberately identity-independent —
      // items are shown on the neutral base + default hair (baseLayersFor(null)).
      // Whether previews should use the student's own body is a 152C decision.
      const layers = [...baseLayersFor(null)];
      if (imageUrl) {
        layers.push({ src: imageUrl, z: SLOT_Z[slotType] ?? 1 });
      }
      layers.sort((a, b) => a.z - b.z);
      layers.forEach(({ src, z }) => {
        const img = document.createElement("img");
        img.className = "preview-layer";
        img.src = src;
        img.style.zIndex = String(z);
        img.alt = "";
        wrap.appendChild(img);
      });
    }
  }

  // "Ny!" corner badge — inside preview, top-left SVG corner is sparsely populated
  if (isNew) {
    const badge = document.createElement("div");
    badge.className = "badge-new";
    badge.textContent = "Ny!";
    wrap.appendChild(badge);
  }

  return wrap;
}

// ── In-memory state ───────────────────────────────────────────────────────────

let ownedMap = new Map(); // item_id → created_at (UTC string)

// ── Data loading ──────────────────────────────────────────────────────────────

async function loadCoins() {
  const { data, error } = await supabase
    .from("student_progress")
    .select("coins")
    .eq("student_id", userId);

  if (error) {
    console.error("LOAD COINS ERROR:", error);
    document.getElementById("coinsDisplay").textContent = "🪙 ?";
    return;
  }

  const coins = data?.[0]?.coins ?? 0;
  document.getElementById("coinsDisplay").textContent = "🪙 " + coins;
}

async function loadOwned() {
  const { data, error } = await supabase
    .from("user_items")
    .select("item_id")
    .eq("user_id", userId);

  if (error) {
    console.error("LOAD OWNED ERROR:", error);
    return new Map();
  }
  const map = new Map();
  (data ?? []).forEach(row => map.set(row.item_id, true));
  return map;
}

async function loadShop() {
  const shopGrid = document.getElementById("shopGrid");

  const { data: rawItems, error } = await supabase
    .from("shop_items")
    .select("id, name, price, rarity, type, image_url, slot_type, layer_order");

  if (error) {
    console.error("LOAD SHOP ERROR:", error);
    shopGrid.innerHTML = `<div class="shop-error">Fejl ved indlæsning af butik</div>`;
    return;
  }

  ownedMap = await loadOwned();

  // Sort: legendary first → rare → uncommon → common, then price ascending
  const items = [...(rawItems ?? [])].sort((a, b) => {
    const ra = RARITY_SORT_ORDER[a.rarity] ?? 4;
    const rb = RARITY_SORT_ORDER[b.rarity] ?? 4;
    if (ra !== rb) return ra - rb;
    return (a.price ?? 0) - (b.price ?? 0);
  });

  shopGrid.innerHTML = "";

  if (items.length === 0) {
    shopGrid.innerHTML = `<div class="shop-empty">Ingen items tilgængelige endnu.</div>`;
    return;
  }

  items.forEach(item => {
    const isOwned      = ownedMap.has(item.id);
    const isNew        = hasBadge("shop", item.id);
    const rarityColor  = RARITY_COLORS[item.rarity] ?? "#555";
    const rarityLabel  = RARITY_LABELS[item.rarity] ?? (item.rarity ?? "");
    const isAvatarItem = item.type === "avatar";

    const card = document.createElement("div");
    card.className = "shop-card" + (isOwned ? " is-owned" : "");

    // F5: data attributes for CSS/JS targeting — retention groundwork
    card.dataset.rarity     = item.rarity ?? "common";
    card.dataset.slotType   = item.slot_type ?? "";
    card.dataset.itemId     = item.id;
    card.dataset.isLimited  = String(item.is_limited  ?? false);
    card.dataset.eventItem  = String(item.event_item  ?? false);

    // F1 + F2: paper-doll preview (isNew drives badge inside preview)
    const previewEl = createMiniPaperDoll(
      isAvatarItem ? (item.image_url ?? null) : null,
      isAvatarItem ? (item.slot_type ?? null) : null,
      isNew
    );
    card.appendChild(previewEl);

    // Action: owned CTA vs buy button
    const actionHtml = isOwned
      ? `<div class="owned-indicator">&#10003; Ejet</div><button class="avatar-cta-btn" data-action="goto-avatar">G&#229; til din avatar &#8594;</button>`
      : `<button class="buy-btn" data-item-id="${item.id}">Køb</button>`;

    card.insertAdjacentHTML("beforeend", `
      <div class="item-name">${item.name}</div>
      <span class="rarity-badge" style="background:${rarityColor}">${rarityLabel}</span>
      ${!isOwned ? `<div class="price-tag">&#x1FA99; ${item.price} <span class="price-unit">mønter</span></div>` : ""}
      <div class="card-badge"></div>
      ${actionHtml}
    `);

    shopGrid.appendChild(card);
  });

  filterShopGrid();
}

// ── Buy handler — single delegated listener, attached once ────────────────────

document.getElementById("shopGrid").addEventListener("click", async (e) => {
  const cta = e.target.closest("[data-action='goto-avatar']");
  if (cta) { window.location.href = "avatar.html"; return; }

  const equipNowBtn = e.target.closest("[data-action='equip-now']");
  if (equipNowBtn && !equipNowBtn.disabled) {
    const itemId = equipNowBtn.dataset.itemId;
    if (!itemId) return;
    equipNowBtn.disabled = true;
    equipNowBtn.textContent = "...";
    const { error } = await supabase.rpc("equip_item", { p_item_id: itemId });
    if (error) {
      console.error("EQUIP ERROR:", error);
      equipNowBtn.disabled = false;
      equipNowBtn.textContent = "Udstyr nu";
      const statusEl = equipNowBtn.closest(".buy-success-state")?.querySelector(".bought-success");
      if (statusEl) { statusEl.textContent = "⚠️ Fejl – prøv igen"; statusEl.style.color = "#ef5350"; }
      return;
    }
    window.location.href = "avatar.html";
    return;
  }

  const laterBtn = e.target.closest("[data-action='buy-later']");
  if (laterBtn) { await loadShop(); return; }

  const btn = e.target.closest(".buy-btn[data-item-id]");
  if (!btn || btn.disabled) return;

  btn.disabled = true;
  btn.textContent = "...";

  const itemId = btn.dataset.itemId;

  const { data: fresh } = await supabase.auth.getSession();
  if (!fresh.session) {
    alert("Ikke logget ind");
    window.location.replace("login.html");
    return;
  }

  const res = await fetch(
    "https://tjzbehwfagiwpwodsgwg.supabase.co/functions/v1/buy-item",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${fresh.session.access_token}`,
        "apikey": SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ item_id: itemId })
    }
  );

  const result = await res.json();

  if (!res.ok || result?.error) {
    console.error("BUY ERROR:", result);
    const errMsg = String(result?.error ?? "");
    const isCoins = errMsg.toLowerCase().includes("coin") || errMsg.toLowerCase().includes("insufficient");
    showToast(isCoins ? "Ikke nok mønter!" : (errMsg || "Fejl ved køb – prøv igen"), "error");
    playSound("error");
    btn.disabled = false;
    btn.textContent = "Køb";
    return;
  }

  // Coin flash — triggers as the number updates
  const coinsEl = document.getElementById("coinsDisplay");
  if (coinsEl) {
    coinsEl.classList.add("coins-spend-flash");
    coinsEl.addEventListener("animationend", () => coinsEl.classList.remove("coins-spend-flash"), { once: true });
  }

  await loadCoins();

  // In-place card transition — no full re-render, preserves scroll position
  const card = btn.closest(".shop-card");
  const itemRarity   = card?.dataset.rarity   ?? null;
  const itemSlotType = card?.dataset.slotType ?? null;

  showToast("✓ Køb gennemført!", "success");
  playSound("buy");
  addBadge("shop", itemId);
  addBadge("avatar", itemId);
  emit("item:purchased", { itemId, rarity: itemRarity, slotType: itemSlotType });
  if (card) {
    card.classList.add("is-owned");
    const priceTag = card.querySelector(".price-tag");
    if (priceTag) priceTag.remove();

    const hasSlot = !!card.dataset.slotType;
    const successEl = document.createElement("div");
    successEl.className = "buy-success-state";

    if (hasSlot) {
      successEl.innerHTML = `
        <div class="bought-success">&#10003; K&#248;bt!</div>
        <button class="equip-now-btn" data-action="equip-now" data-item-id="${itemId}">Udstyr nu</button>
        <button class="later-btn" data-action="buy-later">Senere</button>
      `;
    } else {
      successEl.innerHTML = `<div class="bought-success">&#10003; K&#248;bt!</div>`;
      setTimeout(() => loadShop(), 1200);
    }

    btn.replaceWith(successEl);
  } else {
    await loadShop();
  }
});

// ── Category tab filtering ────────────────────────────────────────────────────

let activeCategory = "alle";

function filterShopGrid() {
  const catDef = SHOP_CATEGORIES.find(c => c.key === activeCategory);
  document.querySelectorAll(".shop-card").forEach(card => {
    const slotType = card.dataset.slotType ?? "";
    const visible  = !catDef?.slots || catDef.slots.includes(slotType);
    card.style.display = visible ? "" : "none";
  });
}

document.getElementById("categoryTabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".cat-tab[data-cat]");
  if (!btn) return;
  activeCategory = btn.dataset.cat;
  document.querySelectorAll(".cat-tab").forEach(b => b.classList.toggle("cat-tab--active", b === btn));
  filterShopGrid();
});

// ── Init ──────────────────────────────────────────────────────────────────────

initBadges("shop");
await loadCoins();
await loadShop();
</script>
