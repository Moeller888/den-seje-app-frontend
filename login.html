<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Login – DEN SEJE APP</title>

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .box {
      border: 1px solid #ccc;
      padding: 20px;
      max-width: 400px;
      margin: 100px auto;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 10px;
      cursor: pointer;
    }

    .message {
      margin-top: 10px;
      color: red;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Login</h2>
    <form id="login-form">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Adgangskode">
      <button type="submit" id="loginBtn">Login</button>
    </form>
    <div class="message" id="message"></div>

    <div style="text-align:center;margin-top:12px;">
      <button type="button" id="forgotBtn"
        style="background:none;border:none;color:#555;font-size:13px;cursor:pointer;text-decoration:underline;padding:0;">
        Glemt adgangskode?
      </button>
    </div>

    <div id="forgot-panel" style="display:none;margin-top:16px;border-top:1px solid #ccc;padding-top:16px;">
      <p style="margin-bottom:8px;font-size:14px;">
        Skriv din email-adresse. Vi sender dig et link til at oprette en ny adgangskode.
      </p>
      <input type="email" id="reset-email" placeholder="Din email" style="width:100%;padding:8px;margin-bottom:8px;box-sizing:border-box;">
      <button type="button" id="resetRequestBtn" style="width:100%;padding:10px;cursor:pointer;">
        Send nulstillingslink
      </button>
      <div id="reset-message" style="margin-top:8px;font-size:13px;"></div>
    </div>
  </div>

  <script type="module" src="./js/supabase.js"></script>
  <script type="module" src="./js/login.js"></script>

</body>
</html>
