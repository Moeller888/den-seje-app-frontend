<!DOCTYPE html>
<html lang="da" data-theme="default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <title>Log ind — Lærlig</title>

  <!-- Same tokens as the landing page and the app, so the step from the public
       front page into the product does not look like leaving the product. -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="ambient" aria-hidden="true">
    <span class="ambient-a"></span>
    <span class="ambient-b"></span>
  </div>
  <div class="grid-veil" aria-hidden="true"></div>

  <a class="login-brand" href="landing.html">
    <span class="wordmark-text">Lærlig</span>
  </a>

  <main class="box">
    <h2>Log ind</h2>
    <p class="login-sub">Fortsæt, hvor du slap.</p>

    <!-- No `novalidate`: the original form relied on the browser's native validation for a
         malformed email, and this change is a restyle, not a change to how the form behaves. -->
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="din@email.dk" autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Adgangskode</label>
        <input type="password" id="password" placeholder="Din adgangskode" autocomplete="current-password">
      </div>

      <button type="submit" id="loginBtn">Log ind</button>
    </form>

    <div class="message" id="message" role="status" aria-live="polite"></div>

    <div class="forgot-row">
      <button type="button" id="forgotBtn" aria-controls="forgot-panel">
        Glemt adgangskode?
      </button>
    </div>

    <!-- The inline `display:none` is LOAD-BEARING. js/login.js toggles this panel by
         reading `forgotPanel.style.display` — the INLINE value. Move it into CSS and
         the first click reads "" instead of "none", so the panel would be set to
         "none" and could never open. tests/password-reset.spec.ts covers both states. -->
    <div id="forgot-panel" style="display:none;">
      <p>
        Skriv din email-adresse. Vi sender dig et link til at oprette en ny adgangskode.
      </p>
      <div class="field">
        <label for="reset-email">Email</label>
        <input type="email" id="reset-email" placeholder="Din email" autocomplete="email">
      </div>
      <button type="button" id="resetRequestBtn">
        Send nulstillingslink
      </button>
      <div id="reset-message" role="status" aria-live="polite"></div>
    </div>
  </main>

  <a class="login-back" href="landing.html">← Tilbage til Lærlig</a>

  <script type="module" src="./js/supabase.js"></script>
  <script type="module" src="./js/login.js"></script>

</body>
</html>
