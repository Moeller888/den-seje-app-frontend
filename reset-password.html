<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <!-- Internal app surface: never a search result. Inert to the app; nothing reads it. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ny adgangskode – DEN SEJE APP</title>

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .box {
      border: 1px solid #ccc;
      padding: 20px;
      max-width: 400px;
      margin: 100px auto;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      cursor: pointer;
    }

    .message {
      margin-top: 10px;
      font-size: 14px;
    }

    #invalid-section { display: none; }
    #loading-section { display: block; }
    #form-section    { display: none; }
  </style>
</head>
<body>

  <div class="box">
    <h2>Ny adgangskode</h2>

    <!-- Shown while waiting for Supabase to verify the token -->
    <div id="loading-section">
      <p style="color:#555;font-size:14px;">Verificerer link…</p>
    </div>

    <!-- Shown when the reset token is missing or invalid -->
    <div id="invalid-section">
      <p style="color:red;font-size:14px;">
        Dette link er ugyldigt eller udløbet.
        Bed om et nyt link på <a href="login.html">login-siden</a>.
      </p>
    </div>

    <!-- Shown when token is valid and session is established -->
    <div id="form-section">
      <p style="margin-bottom:12px;font-size:14px;">Vælg en ny adgangskode.</p>
      <form id="reset-form">
        <input type="password" id="new-password"     placeholder="Ny adgangskode (min. 6 tegn)">
        <input type="password" id="confirm-password" placeholder="Gentag adgangskode">
        <button type="submit" id="resetSubmitBtn">Opdater adgangskode</button>
      </form>
      <div class="message" id="reset-message"></div>
    </div>
  </div>

  <script type="module" src="./js/supabase.js"></script>
  <script type="module" src="./js/reset-password.js"></script>

</body>
</html>
