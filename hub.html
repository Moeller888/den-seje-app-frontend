<!DOCTYPE html>
<html lang="da" data-theme="default">
<head>
  <!-- Anti-flicker: apply cached theme synchronously before CSS renders -->
  <script>
  (function(){var k='dsj_active_theme',v=['default','ice','inferno','void','forest','sakura','aurora','pearl','meadow','rose-gold'];try{var t=sessionStorage.getItem(k);if(t&&v.indexOf(t)!==-1)document.documentElement.dataset.theme=t;}catch{}}());
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEN SEJE APP - Hub</title>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    h1 {
      font-size: 22px;
      font-weight: bold;
      color: var(--text-bright);
      margin-bottom: 32px;
      letter-spacing: 0.5px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 280px;
    }

    .menu button {
      padding: 13px 16px;
      font-size: 15px;
      cursor: pointer;
      background: var(--btn-bg);
      color: var(--text-dim);
      border: 1px solid var(--border-btn);
      border-radius: 8px;
      text-align: left;
      transition: background 0.12s, color 0.12s;
      font-family: inherit;
    }

    .menu button:hover {
      background: var(--btn-bg-hover);
      color: var(--text-main);
    }

    #logoutBtn {
      background: var(--logout-bg);
      border-color: var(--logout-border);
      color: var(--logout-text);
      margin-top: 8px;
    }

    #logoutBtn:hover {
      background: var(--logout-bg-hover);
      color: var(--logout-text-hover);
    }
  </style>
</head>

<body>

  <h1>DEN SEJE APP</h1>

  <div class="menu">
    <button id="playBtn">🎮 Spil</button>
    <button id="shopBtn">🛒 Butik</button>
    <button id="avatarBtn">👤 Avatar</button>
    <button id="themesBtn">🎨 Temaer</button>
    <button id="logoutBtn">🚪 Log ud</button>
  </div>

  <script type="module">
    import { supabase }   from "./supabaseClient.js";
    import { loadTheme }  from "./js/themeManager.js";

    const { data: sessionData } = await supabase.auth.getSession();

    if (!sessionData.session) {
      window.location.replace("login.html");
    } else {
      loadTheme().catch(() => {});
    }

    document.getElementById("playBtn").onclick = () => {
      window.location.href = "index.html";
    };

    document.getElementById("shopBtn").onclick = () => {
      window.location.href = "shop.html";
    };

    document.getElementById("avatarBtn").onclick = () => {
      window.location.href = "avatar.html";
    };

    document.getElementById("themesBtn").onclick = () => {
      window.location.href = "themes.html";
    };

    document.getElementById("logoutBtn").onclick = async () => {
      await supabase.auth.signOut();
      window.location.replace("login.html");
    };
  </script>

</body>
</html>
