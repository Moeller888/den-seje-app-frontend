<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEN SEJE APP - Hub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #12122a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    h1 {
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 32px;
      letter-spacing: 0.5px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 280px;
    }

    .menu button {
      padding: 13px 16px;
      font-size: 15px;
      cursor: pointer;
      background: #2a2a4a;
      color: #ccc;
      border: 1px solid #3a3a5a;
      border-radius: 8px;
      text-align: left;
      transition: background 0.12s, color 0.12s;
      font-family: inherit;
    }

    .menu button:hover {
      background: #333360;
      color: #e0e0e0;
    }

    #logoutBtn {
      background: #2a1a1a;
      border-color: #5a2a2a;
      color: #aa8080;
      margin-top: 8px;
    }

    #logoutBtn:hover {
      background: #3a1a1a;
      color: #cc9090;
    }
  </style>
</head>

<body>

  <h1>DEN SEJE APP</h1>

  <div class="menu">
    <button id="playBtn">🎮 Spil</button>
    <button id="shopBtn">🛒 Butik</button>
    <button id="avatarBtn">👤 Avatar</button>
    <button id="themesBtn">🎨 Temaer</button>
    <button id="logoutBtn">🚪 Log ud</button>
  </div>

  <script type="module">
    import { supabase } from "./supabaseClient.js";

    const { data: sessionData } = await supabase.auth.getSession();

    if (!sessionData.session) {
      window.location.replace("login.html");
    }

    document.getElementById("playBtn").onclick = () => {
      window.location.href = "index.html";
    };

    document.getElementById("shopBtn").onclick = () => {
      window.location.href = "shop.html";
    };

    document.getElementById("avatarBtn").onclick = () => {
      window.location.href = "avatar.html";
    };

    document.getElementById("themesBtn").onclick = () => {
      window.location.href = "themes.html";
    };

    document.getElementById("logoutBtn").onclick = async () => {
      await supabase.auth.signOut();
      window.location.replace("login.html");
    };
  </script>

</body>
</html>
