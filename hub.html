<!DOCTYPE html>
<html lang="da" data-theme="default">
<head>
  <!-- Anti-flicker: apply cached theme synchronously before CSS renders -->
  <script>
  (function(){var k='dsj_active_theme',v=['default','ice','inferno','void','forest','sakura','aurora','pearl','meadow','rose-gold'];try{var t=sessionStorage.getItem(k);if(t&&v.indexOf(t)!==-1)document.documentElement.dataset.theme=t;}catch{}}());
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEN SEJE APP - Hub</title>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 48px;
    }

    /* ── Hub container ───────────────────────────────── */

    .hub-container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Profile hero card — full width, visually dominant ── */

    .profile-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);   /* accent edge: theme-aware, marks this as the primary element */
      border-radius: 12px;
      padding: 18px;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    /* ── Avatar showcase (with optional rarity aura) ─── */

    .avatar-showcase {
      position: relative;
      flex-shrink: 0;
    }

    .avatar-aura {
      position: absolute;
      inset: -10px;
      border-radius: 18px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
    }

    .avatar-showcase[data-rarity="legendary"] .avatar-aura {
      background: radial-gradient(ellipse at 50% 40%, rgba(255,215,0,0.10) 0%, transparent 65%);
      opacity: 1;
    }

    .avatar-showcase[data-rarity="rare"] .avatar-aura {
      background: radial-gradient(ellipse at 50% 40%, rgba(25,118,210,0.08) 0%, transparent 65%);
      opacity: 1;
    }

    .profile-avatar {
      position: relative;
      isolation: isolate;
      width: 110px;
      height: 165px;
      border-radius: 10px;
      background: radial-gradient(ellipse at 50% 30%, var(--avatar-inner) 0%, var(--avatar-outer) 100%);
      overflow: visible;
      box-shadow: var(--avatar-ambient);
      transition: box-shadow 0.3s;
      /* Section 151B: idle breathing — amplitude/rate driven by PresenceEngine
         CSS custom properties (same contract as quiz page and avatar.html) */
      animation: avatarBreathe 3.5s linear infinite;
    }

    @keyframes avatarBreathe {
      0%   { transform: translateY(0) scale(1); animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1); }
      38%  { transform: translateY(var(--breathe-shift, -1px)) scale(var(--breathe-scale, 1.006)); animation-timing-function: cubic-bezier(0.15, 0, 0.25, 1); }
      100% { transform: translateY(0) scale(1); }
    }

    /* Engine-injected layers (Section 151B) — the ExpressionEngine inserts its
       overlay with this class. Same geometry as .profile-avatar-layer so the
       expression aligns 1:1 with the base body SVG. */
    .quiz-avatar-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .profile-avatar { animation: none; }
      #avatar-blink-layer { display: none; }
    }

    .avatar-showcase[data-rarity="legendary"] .profile-avatar {
      box-shadow: 0 0 0 2px rgba(255,215,0,0.5), 0 0 14px rgba(255,215,0,0.15);
    }

    .avatar-showcase[data-rarity="rare"] .profile-avatar {
      box-shadow: 0 0 0 2px rgba(25,118,210,0.45), 0 0 10px rgba(25,118,210,0.12);
    }

    /* ── Gender-aware avatar background tints (mirrors avatar.html) ── */
    .avatar-showcase[data-gender="boy"]  { --avatar-inner: #b8d4f8; --avatar-outer: #0d2a5a; }
    .avatar-showcase[data-gender="girl"] { --avatar-inner: #f8b8d4; --avatar-outer: #5a0d2a; }

    .profile-avatar-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* ── Profile info block ──────────────────────────── */

    .profile-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Level: two-line stat block — label above number */
    .level-block {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .level-label {
      font-size: 9px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-label);
    }

    .level-number {
      font-size: 30px;
      font-weight: bold;
      color: var(--text-bright);
      line-height: 1;
    }

    /* Theme badge — pill with accent-colored border (theme-aware) */
    .theme-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 11px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      background: var(--btn-bg);
      border: 1.5px solid var(--accent);
      color: var(--text-main);
      align-self: flex-start;
      white-space: nowrap;
    }

    /* Rarity icon colors — fixed per rarity, same as all other rarity indicators */
    .tbadge-icon--legendary { color: #f57f17; font-size: 10px; }
    .tbadge-icon--rare      { color: #1976d2; font-size: 10px; }
    .tbadge-icon--uncommon  { color: #388e3c; font-size: 10px; }
    .tbadge-icon--common    { color: var(--text-muted); font-size: 10px; }

    /* XP section */
    .xp-section {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .xp-bar-track {
      height: 8px;
      background: var(--xp-track);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
    }

    .xp-bar-fill {
      height: 100%;
      background: var(--success);
      border-radius: 4px;
      width: 0%;
      transition: width 0.7s ease;
    }

    .xp-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── Stat chips (coins + correct answers + streak) ── */

    .stat-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stat-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 14px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      min-width: 72px;
    }

    .stat-chip-icon {
      font-size: 14px;
      line-height: 1;
    }

    .stat-chip-value {
      font-size: 17px;
      font-weight: bold;
      line-height: 1;
    }

    .stat-chip--coins .stat-chip-value   { color: var(--coin); }
    .stat-chip--correct .stat-chip-value { color: var(--success-text); }
    .stat-chip--streak .stat-chip-value  { color: var(--streak); }

    .stat-chip-label {
      font-size: 9px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-label);
    }

    .streak-best {
      font-size: 9px;
      color: var(--text-muted);
      line-height: 1;
    }

    /* ── Bottom grid: nav + collection ──────────────── */

    .hub-bottom {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 14px;
      align-items: start;
    }

    /* ── Navigation menu ─────────────────────────────── */

    .menu {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .menu button {
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
      background: var(--btn-bg);
      color: var(--text-dim);
      border: 1px solid var(--border-btn);
      border-radius: 8px;
      text-align: left;
      transition: background 0.12s, color 0.12s;
      font-family: inherit;
    }

    .menu button:hover {
      background: var(--btn-bg-hover);
      color: var(--text-main);
    }

    #logoutBtn {
      background: var(--logout-bg);
      border-color: var(--logout-border);
      color: var(--logout-text);
      margin-top: 4px;
    }

    #logoutBtn:hover {
      background: var(--logout-bg-hover);
      color: var(--logout-text-hover);
    }

    /* ── Collection panel ────────────────────────────── */

    .collection-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      transition: box-shadow 0.4s;
    }

    .collection-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .collection-title {
      font-size: 10px;
      font-weight: bold;
      color: var(--text-label);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .collection-pct {
      font-size: 13px;
      font-weight: bold;
      color: var(--accent);
    }

    .category-bars {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .category-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .category-label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .category-label  { font-size: 11px; color: var(--text-dim); }
    .category-count  { font-size: 10px; color: var(--text-muted); }

    .category-track {
      height: 4px;
      background: var(--xp-track);
      border-radius: 2px;
      overflow: hidden;
    }

    .category-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      transition: width 0.7s ease;
    }

    /* Rarity chips */
    .rarity-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-height: 22px;
    }

    .rarity-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 9px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      color: #fff;
    }

    .rarity-chip--legendary { background: #f57f17; }
    .rarity-chip--rare      { background: #1565c0; }
    .rarity-chip--uncommon  { background: #388e3c; }
    .rarity-chip--common    { background: #757575; }

    .rarity-chip--legendary .chip-icon {
      display: inline-block;
      animation: legendaryIconPulse 3s ease-in-out infinite;
    }

    @keyframes legendaryIconPulse {
      0%, 100% { opacity: 0.75; }
      50%       { opacity: 1; }
    }

    @keyframes completionGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); }
      50%       { box-shadow: 0 0 16px 2px rgba(76,175,80,0.18); }
    }

    .collection-panel--complete {
      animation: completionGlow 4s ease-in-out infinite;
    }

    /* ── Prestige score row ──────────────────────────── */

    .prestige-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 7px 10px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .prestige-label {
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-label);
    }

    .prestige-score {
      font-size: 16px;
      font-weight: bold;
      color: var(--accent);
    }

    /* ── Teacher spotlight banner ────────────────────── */

    .spotlight-banner {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: var(--bg-panel);
      border: 1.5px solid var(--border-legendary);
      border-radius: 12px;
      box-shadow: 0 0 20px -6px var(--border-legendary);
      animation: spotlightFadeIn 0.4s ease;
    }

    @keyframes spotlightFadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .spotlight-banner { animation: none; }
    }

    .spotlight-icon { font-size: 28px; flex-shrink: 0; line-height: 1; }

    .spotlight-content { flex: 1; min-width: 0; }

    .spotlight-label {
      font-size: 9px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--border-legendary);
      margin-bottom: 4px;
    }

    .spotlight-message {
      font-size: 14px;
      font-weight: bold;
      color: var(--text-bright);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .spotlight-message--no-msg {
      color: var(--text-dim);
      font-weight: normal;
      font-style: italic;
    }

    /* ── Next Goal card ─────────────────────────────── */

    .next-goal-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
    }

    .next-goal-icon {
      font-size: 18px;
      flex-shrink: 0;
      line-height: 1;
    }

    .next-goal-body {
      flex: 1;
      min-width: 0;
    }

    .next-goal-eyebrow {
      font-size: 9px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-label);
      margin-bottom: 2px;
    }

    .next-goal-text {
      font-size: 13px;
      color: var(--text-main);
    }

    .next-goal-btn {
      font-size: 12px;
      font-weight: bold;
      color: var(--accent);
      background: none;
      border: none;
      font-family: inherit;
      padding: 4px 0;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .next-goal-btn:hover { text-decoration: underline; }

    /* New-user: hide collection noise until the user has meaningful progress */
    .collection-panel[data-new-user] .prestige-row { display: none; }
    .collection-panel[data-new-user] .rarity-chips  { display: none; }

    /* ── Retention section: daily reward + quests ────── */

    .retention-section {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 14px;
      align-items: start;
    }

    /* ── Daily reward card ───────────────────────────── */

    .daily-reward-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-top: 3px solid var(--coin);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .drc-title {
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-label);
    }

    .drc-coin-amount {
      font-size: 26px;
      font-weight: bold;
      color: var(--coin);
      line-height: 1;
    }

    .drc-streak-line {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── Quest panel ─────────────────────────────────── */

    .quest-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .quest-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .quest-panel-title {
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-label);
    }

    .quest-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }

    .quest-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .quest-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .quest-label {
      font-size: 13px;
      color: var(--text-main);
      flex: 1;
    }

    .quest-reward-badge {
      font-size: 11px;
      font-weight: bold;
      color: var(--coin);
      white-space: nowrap;
    }

    .quest-progress-track {
      height: 4px;
      background: var(--xp-track);
      border-radius: 2px;
      overflow: hidden;
    }

    .quest-progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.5s ease;
    }

    .quest-row-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .quest-progress-text {
      font-size: 10px;
      color: var(--text-muted);
    }

    .quest-claim-btn {
      padding: 4px 12px;
      background: var(--btn-bg);
      border: 1px solid var(--border-btn);
      border-radius: 5px;
      color: var(--text-main);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.12s;
    }

    .quest-claim-btn:hover:not(:disabled) {
      background: var(--btn-bg-hover);
    }

    .quest-claim-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    /* ── Achievement panel ───────────────────────────── */

    .achievement-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .achievement-panel:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }

    .achievement-panel:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .achievement-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .achievement-panel-title {
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-label);
    }

    .achievement-count {
      font-size: 13px;
      font-weight: bold;
      color: var(--accent);
    }

    .achievement-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 6px;
    }

    .ach-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 4px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--btn-bg);
    }

    .ach-badge--locked {
      opacity: 0.28;
    }

    /* Hidden locked badge — mystery state */
    .ach-badge--hidden-locked {
      opacity: 0.42;
      border-style: dashed;
      border-color: var(--border);
      animation: hiddenBadgePulse 4s ease-in-out infinite;
    }

    @keyframes hiddenBadgePulse {
      0%, 100% { opacity: 0.42; }
      50%       { opacity: 0.58; }
    }

    .ach-badge--unlocked {
      border-color: var(--accent);
    }

    /* Rarity-specific border for unlocked badges */
    .ach-badge--unlocked[data-rarity="rare"] {
      border-color: var(--border-rare);
    }

    .ach-badge--unlocked[data-rarity="legendary"] {
      border-color: var(--border-legendary);
      box-shadow: 0 0 6px -1px var(--border-legendary);
    }

    .ach-badge-icon {
      font-size: 18px;
      line-height: 1;
    }

    .ach-badge-label {
      font-size: 8px;
      font-weight: bold;
      text-align: center;
      color: var(--text-label);
      line-height: 1.25;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .ach-badge--unlocked .ach-badge-label {
      color: var(--text-dim);
    }

    @keyframes achUnlock {
      0%   { transform: scale(1);    box-shadow: none; }
      40%  { transform: scale(1.10); box-shadow: 0 0 0 3px var(--accent); }
      100% { transform: scale(1);    box-shadow: none; }
    }

    @keyframes achUnlockUncommon {
      0%   { transform: scale(1);    box-shadow: none; }
      40%  { transform: scale(1.10); box-shadow: 0 0 0 3px var(--border-uncommon), 0 0 10px 1px var(--border-uncommon); }
      100% { transform: scale(1);    box-shadow: none; }
    }

    @keyframes achUnlockRare {
      0%   { transform: scale(1);    box-shadow: none; }
      35%  { transform: scale(1.10); box-shadow: 0 0 0 3px var(--border-rare), 0 0 14px 2px var(--border-rare); }
      65%  { transform: scale(1.12); box-shadow: 0 0 0 4px var(--border-rare), 0 0 20px 3px var(--border-rare); }
      100% { transform: scale(1);    box-shadow: none; }
    }

    @keyframes achUnlockLegendary {
      0%   { transform: scale(1);    box-shadow: none; }
      40%  { transform: scale(1.12); box-shadow: 0 0 0 3px var(--border-legendary); }
      100% { transform: scale(1);    box-shadow: none; }
    }

    /* Hidden reveal animation — unblur + scale burst */
    @keyframes achBadgeReveal {
      0%   { transform: scale(0.88); filter: blur(1px); opacity: 0.4; }
      50%  { transform: scale(1.14); filter: blur(0);   opacity: 1;   box-shadow: 0 0 0 3px var(--accent); }
      100% { transform: scale(1);    box-shadow: none; filter: blur(0); opacity: 1; }
    }

    @keyframes achBadgeRevealRare {
      0%   { transform: scale(0.88); filter: blur(1px); opacity: 0.4; }
      50%  { transform: scale(1.14); filter: blur(0);   opacity: 1;   box-shadow: 0 0 0 3px var(--border-rare), 0 0 14px 2px var(--border-rare); }
      100% { transform: scale(1);    box-shadow: none; filter: blur(0); opacity: 1; }
    }

    @keyframes achBadgeRevealLegendary {
      0%   { transform: scale(0.88); filter: blur(1px); opacity: 0.4; }
      50%  { transform: scale(1.14); filter: blur(0);   opacity: 1;   box-shadow: 0 0 0 3px var(--border-legendary); }
      100% { transform: scale(1);    box-shadow: none; filter: blur(0); opacity: 1; }
    }

    .ach-badge--just-unlocked {
      animation: achUnlock 600ms ease both;
    }

    .ach-badge--just-unlocked[data-rarity="uncommon"] {
      animation: achUnlockUncommon 650ms ease both;
    }

    .ach-badge--just-unlocked[data-rarity="rare"] {
      animation: achUnlockRare 750ms ease both;
    }

    .ach-badge--just-unlocked[data-rarity="legendary"] {
      animation: achUnlockLegendary 650ms ease both;
    }

    .ach-badge--just-revealed {
      animation: achBadgeReveal 700ms ease both;
    }

    .ach-badge--just-revealed[data-rarity="rare"] {
      animation: achBadgeRevealRare 750ms ease both;
    }

    .ach-badge--just-revealed[data-rarity="legendary"] {
      animation: achBadgeRevealLegendary 750ms ease both;
    }

    @media (prefers-reduced-motion: reduce) {
      .ach-badge--hidden-locked { animation: none; }
      .ach-badge--just-unlocked,
      .ach-badge--just-unlocked[data-rarity="uncommon"],
      .ach-badge--just-unlocked[data-rarity="rare"],
      .ach-badge--just-unlocked[data-rarity="legendary"],
      .ach-badge--just-revealed,
      .ach-badge--just-revealed[data-rarity="rare"],
      .ach-badge--just-revealed[data-rarity="legendary"] { animation: none; }
    }

    .ach-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ach-see-all-arrow {
      font-size: 18px;
      color: var(--text-muted);
      line-height: 1;
      transition: transform 0.12s, color 0.12s;
    }

    .achievement-panel:hover .ach-see-all-arrow {
      transform: translateX(3px);
      color: var(--accent);
    }

    /* ── Daily reward modal overlay ──────────────────── */

    .daily-reward-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 9000;
      align-items: center;
      justify-content: center;
    }

    .daily-reward-overlay.visible {
      display: flex;
    }

    .daily-reward-modal {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-top: 3px solid var(--coin);
      border-radius: 16px;
      padding: 28px 32px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 300px;
      width: 90%;
      animation: drmAppear 200ms ease;
    }

    @keyframes drmAppear {
      from { transform: scale(0.92); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .dro-title {
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-label);
    }

    .dro-coins {
      font-size: 44px;
      font-weight: bold;
      color: var(--coin);
      line-height: 1;
    }

    .dro-streak-info {
      font-size: 12px;
      color: var(--text-muted);
    }

    .dro-btn {
      padding: 10px 28px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .dro-btn:hover {
      opacity: 0.85;
    }

    /* ── Mobile ──────────────────────────────────────── */

    /* ── Weekly quest panel ─────────────────────────── */

    .weekly-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .weekly-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .weekly-panel-title {
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-label);
    }

    .weekly-week-chip {
      font-size: 10px;
      font-weight: bold;
      color: var(--text-muted);
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
    }

    /* Daily reward modal: context nudge line */
    .dro-context-line {
      font-size: 12px;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.4;
    }

    @media (max-width: 540px) {
      .profile-avatar {
        width: 100px;
        height: 150px;
      }
      .level-number    { font-size: 26px; }
      .hub-bottom      { grid-template-columns: 1fr; }
      .retention-section { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<div class="hub-container">

  <!-- Profile hero: full width, first thing visible -->
  <div class="profile-card">

    <div class="avatar-showcase" id="avatarShowcase">
      <div class="avatar-aura"></div>
      <div class="profile-avatar" id="profileAvatar">
        <!-- layers injected by JS -->
      </div>
    </div>

    <div class="profile-info">
      <div class="level-block">
        <span class="level-label">Niveau</span>
        <span class="level-number" id="levelNumber">—</span>
      </div>
      <div class="title-chip" id="titleChip" style="display:none" aria-label="Aktiv titel"></div>
      <div class="theme-badge" id="themeBadge">
        <!-- rendered by JS -->
      </div>
      <div class="xp-section">
        <div class="xp-bar-track">
          <div class="xp-bar-fill" id="xpBarFill"
               role="progressbar" aria-valuenow="0" aria-valuemax="100"></div>
        </div>
        <div class="xp-label" id="xpLabel">...</div>
      </div>
      <div class="stat-chips">
        <div class="stat-chip stat-chip--coins">
          <span class="stat-chip-icon">🪙</span>
          <span class="stat-chip-value" id="statCoins">—</span>
          <span class="stat-chip-label">Mønter</span>
        </div>
        <div class="stat-chip stat-chip--correct">
          <span class="stat-chip-icon">✓</span>
          <span class="stat-chip-value" id="statCorrect">—</span>
          <span class="stat-chip-label">Rigtige svar</span>
        </div>
        <div class="stat-chip stat-chip--streak" title="Daglig streak – vend tilbage næste dag for at holde den i live">
          <span class="stat-chip-icon">🔥</span>
          <span class="stat-chip-value" id="statStreak">—</span>
          <span class="streak-best" id="statStreakBest">Rekord: —</span>
          <span class="stat-chip-label">Dage i træk</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Teacher spotlight banner — shown only when teacher has spotlighted this student -->
  <div id="spotlightBanner" hidden aria-live="polite" aria-label="Lærer-fremhævelse"></div>

  <!-- Next Goal card — lightweight, client-side progress hint -->
  <div id="nextGoalCard" hidden aria-live="polite"></div>

  <!-- Bottom: navigation + collection -->
  <div class="hub-bottom">

    <nav class="menu">
      <button id="playBtn">🎮 Spil</button>
      <button id="shopBtn">🛒 Butik</button>
      <button id="avatarBtn">👤 Avatar</button>
      <button id="themesBtn">🎨 Temaer</button>
      <button id="collectionBtn">📖 Samling</button>
      <button id="leaderboardBtn">🏆 Rangliste</button>
      <button id="docsBtn" style="display:none">📚 Docs</button>
      <button id="logoutBtn">🚪 Log ud</button>
    </nav>

    <div class="collection-panel" id="collectionPanel">
      <div class="collection-header">
        <span class="collection-title">Min samling</span>
        <span class="collection-pct" id="collectionPct">—</span>
      </div>
      <div class="category-bars">
        <div class="category-row">
          <div class="category-label-row">
            <span class="category-label">Items</span>
            <span class="category-count" id="itemsCount">—</span>
          </div>
          <div class="category-track">
            <div class="category-fill" id="itemsFill"
                 role="progressbar" aria-valuenow="0" aria-valuemax="100"></div>
          </div>
        </div>
        <div class="category-row">
          <div class="category-label-row">
            <span class="category-label">Temaer</span>
            <span class="category-count" id="themesCount">—</span>
          </div>
          <div class="category-track">
            <div class="category-fill" id="themesFill"
                 role="progressbar" aria-valuenow="0" aria-valuemax="100"></div>
          </div>
        </div>
        <div class="category-row">
          <div class="category-label-row">
            <span class="category-label">Præstationer</span>
            <span class="category-count" id="achCount">—</span>
          </div>
          <div class="category-track">
            <div class="category-fill" id="achFill"
                 role="progressbar" aria-valuenow="0" aria-valuemax="100"></div>
          </div>
        </div>
        <div class="category-row">
          <div class="category-label-row">
            <span class="category-label">Titler</span>
            <span class="category-count" id="titlesCount">—</span>
          </div>
          <div class="category-track">
            <div class="category-fill" id="titlesFill"
                 role="progressbar" aria-valuenow="0" aria-valuemax="100"></div>
          </div>
        </div>
      </div>
      <div class="prestige-row">
        <span class="prestige-label">Prestige</span>
        <span class="prestige-score" id="prestigeScore">—</span>
      </div>
      <div class="rarity-chips" id="rarityChips">
        <!-- rendered by JS -->
      </div>
    </div>

  </div>

  <!-- Retention: daily reward + daily quests -->
  <div class="retention-section">

    <div class="daily-reward-card" id="dailyRewardCard">
      <!-- rendered by JS -->
    </div>

    <div class="quest-panel">
      <div class="quest-panel-header">
        <span class="quest-panel-title">Daglige mål</span>
      </div>
      <div id="questList"><!-- rendered by JS --></div>
    </div>

  </div>

  <!-- Weekly quests -->
  <div class="weekly-panel">
    <div class="weekly-panel-header">
      <span class="weekly-panel-title">Ugentlige mål</span>
      <span class="weekly-week-chip" id="weeklyWeekChip"></span>
    </div>
    <div id="weeklyQuestList"><!-- rendered by JS --></div>
  </div>

  <!-- Achievements: permanent trophy shelf — click opens achievements.html -->
  <div class="achievement-panel"
       onclick="window.location.href='achievements.html'"
       tabindex="0"
       role="button"
       aria-label="Se alle præstationer">
    <div class="achievement-panel-header">
      <span class="achievement-panel-title">Præstationer</span>
      <div class="ach-header-right">
        <span class="achievement-count" id="achievementCount">— / 16</span>
        <span class="ach-see-all-arrow" aria-hidden="true">&#8250;</span>
      </div>
    </div>
    <div class="achievement-grid" id="achievementGrid">
      <!-- rendered by JS -->
    </div>
  </div>

</div>

<!-- Daily reward modal overlay -->
<div id="dailyRewardOverlay" class="daily-reward-overlay"
     role="dialog" aria-modal="true" aria-label="Daglig belønning" aria-hidden="true">
  <div class="daily-reward-modal">
    <div class="dro-title">Daglig belønning</div>
    <div class="dro-coins" id="droCoins">+0 🪙</div>
    <div class="dro-streak-info" id="droStreakInfo"></div>
    <div class="dro-context-line" id="droContextLine"></div>
    <button class="dro-btn" id="droDismissBtn">Hent!</button>
  </div>
</div>

<script type="module">
  import { supabase }  from "./supabaseClient.js";
  import { loadTheme } from "./js/themeManager.js";
  import { getXPProgressInLevel } from "./js/progression.js";
  import { showToast } from "./js/toast.js";
  import { playSound } from "./js/audio.js";
  import { ALL_SLOTS, SLOT_Z, baseLayersFor, skinToneFor, RARITY_ORDER, RARITY_ICONS, isAvatarV2, isAvatarR2ActiveFor } from "./js/avatar-layers.js";
  import { mountC2Avatar, c2CosmeticLayers } from "./js/avatar-render-c2.js";
  import { ExpressionEngine } from "./js/avatar-expression-engine.js";
  import { PresenceEngine }   from "./js/avatar-presence-engine.js";
  import { BlinkEngine }      from "./js/avatar-blink-engine.js";

  // ── Auth ──────────────────────────────────────────────────────────────────────

  const { data: sessionData } = await supabase.auth.getSession();
  if (!sessionData.session) {
    window.location.replace("login.html");
    throw new Error("Unauthorized");
  }

  const userId = sessionData.session.user.id;

  loadTheme().catch(() => {});

  window.addEventListener("pageshow", async (event) => {
    if (event.persisted) {
      const { data } = await supabase.auth.getSession();
      if (!data.session) window.location.replace("login.html");
    }
  });

  // ── Navigation ────────────────────────────────────────────────────────────────

  document.getElementById("playBtn").onclick        = () => { window.location.href = "index.html"; };
  document.getElementById("shopBtn").onclick        = () => { window.location.href = "shop.html"; };
  document.getElementById("avatarBtn").onclick      = () => { window.location.href = "avatar.html"; };
  document.getElementById("themesBtn").onclick      = () => { window.location.href = "themes.html"; };
  document.getElementById("docsBtn").onclick        = () => { window.location.href = "docs.html"; };
  document.getElementById("collectionBtn").onclick  = () => { window.location.href = "collection.html"; };
  document.getElementById("leaderboardBtn").onclick = () => { window.location.href = "leaderboard.html"; };
  document.getElementById("logoutBtn").onclick = async () => {
    await supabase.auth.signOut();
    window.location.replace("login.html");
  };

  // ── Constants ─────────────────────────────────────────────────────────────────

  // ALL_SLOTS, SLOT_Z, baseLayersFor, RARITY_ORDER, RARITY_ICONS — imported from ./js/avatar-layers.js

  const RARITY_CHIP_CFG = {
    legendary: { label: "Legendarisk", icon: "✦", cls: "rarity-chip--legendary" },
    rare:      { label: "Sjælden",     icon: "★", cls: "rarity-chip--rare"      },
    uncommon:  { label: "Ualmindelig", icon: "◆", cls: "rarity-chip--uncommon"  },
    common:    { label: "Almindelig",  icon: "○", cls: "rarity-chip--common"    },
  };

  // Client-side achievement catalog — must match DB seed in achievements table.
  const ACHIEVEMENT_DEFS = [
    { id: "first_correct",   label: "Første svar",     icon: "✓",  sortOrder: 1,  rarity: "common",    hidden: false },
    { id: "correct_10",      label: "10 svar",          icon: "◎",  sortOrder: 2,  rarity: "common",    hidden: false },
    { id: "correct_100",     label: "100 svar",         icon: "★",  sortOrder: 3,  rarity: "rare",      hidden: false },
    { id: "first_theme",     label: "Tema",             icon: "◈",  sortOrder: 4,  rarity: "common",    hidden: false },
    { id: "first_legendary", label: "Legendarisk",     icon: "✦",  sortOrder: 5,  rarity: "rare",      hidden: false },
    { id: "streak_7",        label: "7 dage",           icon: "🔥", sortOrder: 6,  rarity: "rare",      hidden: false },
    { id: "level_10",        label: "Niveau 10",        icon: "▲",  sortOrder: 7,  rarity: "rare",      hidden: false },
    { id: "first_purchase",  label: "Første køb",      icon: "🛒", sortOrder: 8,  rarity: "common",    hidden: false },
    { id: "collector_5",     label: "5 items",          icon: "💎", sortOrder: 9,  rarity: "rare",      hidden: false },
    { id: "themes_3",        label: "3 temaer",         icon: "🎨", sortOrder: 10, rarity: "rare",      hidden: false },
    { id: "streak_30",       label: "30 dage",          icon: "⚡", sortOrder: 11, rarity: "legendary", hidden: false },
    { id: "correct_1000",    label: "1000 svar",        icon: "🏆", sortOrder: 12, rarity: "legendary", hidden: false },
    { id: "night_owl",       label: "Natteuglen",       icon: "🌙", sortOrder: 13, rarity: "rare",      hidden: true  },
    { id: "perfect_five",    label: "Perfekt Fem",      icon: "⭐", sortOrder: 14, rarity: "rare",      hidden: true  },
    { id: "legendary_combo", label: "Den Store Samler", icon: "👑", sortOrder: 15, rarity: "legendary", hidden: true  },
    { id: "fast_learner",    label: "Hurtiglærer",      icon: "🚀", sortOrder: 16, rarity: "legendary", hidden: true  },
  ];

  // ── Today (UTC) — used for quest date queries ─────────────────────────────────

  const todayUTC = new Date().toISOString().slice(0, 10);

  // Returns ISO week key matching PostgreSQL TO_CHAR(CURRENT_DATE, 'IYYY-IW')
  // e.g. "2026-21" for the week containing 2026-05-23
  function getISOWeekKey() {
    const d = new Date();
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
    const year = date.getUTCFullYear();
    const startOfYear = new Date(Date.UTC(year, 0, 1));
    const weekNum = Math.ceil(((date - startOfYear) / 86400000 + 1) / 7);
    return year + "-" + String(weekNum).padStart(2, "0");
  }

  const currentWeekKey = getISOWeekKey();

  // ── Data fetch (all in parallel) ──────────────────────────────────────────────

  const [
    profileResult,
    progressResult,
    userItemsResult,
    shopItemsResult,
    userThemesResult,
    themesResult,
    rewardResult,
    questsResult,
    questProgressResult,
    userAchievementsResult,
    titlesResult,
    userTitlesResult,
    prestigeResult,
    spotlightResult,
    weeklyQuestsResult,
    weeklyQuestProgressResult,
  ] = await Promise.all([
    supabase.from("profiles").select("equipped_slots, active_theme, active_title, avatar_gender, avatar_identity, role").eq("id", userId).maybeSingle(),
    supabase.from("student_progress").select("xp, coins, current_streak, longest_streak, correct_answers").eq("student_id", userId),
    supabase.from("user_items").select("item_id").eq("user_id", userId),
    supabase.from("shop_items").select("id, rarity, slot_type, image_url"),
    supabase.from("user_themes").select("theme_id").eq("user_id", userId),
    supabase.from("themes").select("id, name, rarity, always_owned"),
    supabase.from("daily_login_rewards").select("last_claimed_date").eq("student_id", userId).maybeSingle(),
    supabase.from("daily_quests").select("id, quest_key, type, target, reward_coins, label, sort_order").eq("is_active", true).order("sort_order"),
    supabase.from("student_quest_progress").select("quest_id, progress, completed, claimed").eq("student_id", userId).eq("quest_date", todayUTC),
    supabase.from("user_achievements").select("achievement_id").eq("student_id", userId),
    supabase.from("titles").select("id, name, rarity"),
    supabase.from("user_titles").select("title_id").eq("user_id", userId),
    supabase.rpc("recalculate_prestige", { p_user_id: userId }),
    supabase.rpc("get_my_spotlight"),
    supabase.from("weekly_quests").select("id, quest_key, type, target, reward_coins, label, sort_order").eq("is_active", true).order("sort_order"),
    supabase.from("student_weekly_quest_progress").select("quest_id, progress, completed, claimed").eq("student_id", userId).eq("week_key", currentWeekKey),
  ]);

  // ── Parse profile ─────────────────────────────────────────────────────────────

  const equippedSlots  = profileResult.data?.equipped_slots ?? {};
  const activeThemeId  = profileResult.data?.active_theme ?? "default";
  const avatarGender   = profileResult.data?.avatar_gender ?? 'neutral';
  const avatarIdentity = profileResult.data?.avatar_identity ?? null;   // Section 152A

  // Internal docs link — super_admin only. Default hidden (students/teachers never see it);
  // fail-soft: any missing/errored role keeps it hidden.
  if ((profileResult.data?.role ?? null) === "super_admin") {
    const docsBtn = document.getElementById("docsBtn");
    if (docsBtn) docsBtn.style.display = "";
  }

  // ── Parse progression ─────────────────────────────────────────────────────────

  const xp            = progressResult.data?.[0]?.xp             ?? 0;
  const coins         = progressResult.data?.[0]?.coins          ?? 0;
  const currentStreak = progressResult.data?.[0]?.current_streak ?? 0;
  const longestStreak = progressResult.data?.[0]?.longest_streak ?? 0;
  const correctCount  = progressResult.data?.[0]?.correct_answers ?? 0;

  // ── Parse retention data ──────────────────────────────────────────────────────

  const alreadyClaimedToday = (rewardResult.data?.last_claimed_date === todayUTC);
  const nextRewardCoins = Math.min(150, 25 + currentStreak * 15);

  // ── Parse items ───────────────────────────────────────────────────────────────

  const allShopItems    = shopItemsResult.data ?? [];
  const ownedItemIds    = new Set((userItemsResult.data ?? []).map(r => r.item_id));
  const equipableItems  = allShopItems.filter(i => !!i.slot_type);
  const totalItems      = equipableItems.length;
  const ownedItems      = equipableItems.filter(i => ownedItemIds.has(i.id));
  const ownedItemsCount = ownedItems.length;

  // ── Parse themes ──────────────────────────────────────────────────────────────

  const allThemes     = themesResult.data ?? [];
  const ownedThemeSet = new Set((userThemesResult.data ?? []).map(r => r.theme_id));
  allThemes.forEach(t => { if (t.always_owned) ownedThemeSet.add(t.id); });

  const totalThemes      = allThemes.length;
  const ownedThemesCount = ownedThemeSet.size;

  const activeThemeObj  = allThemes.find(t => t.id === activeThemeId) ?? null;
  const activeThemeName = activeThemeObj?.name ?? activeThemeId;
  const activeThemeRarity = activeThemeObj?.rarity ?? "common";

  // ── Parse active title ────────────────────────────────────────────────────────

  const activeTitleId    = profileResult.data?.active_title ?? null;
  const allTitles        = titlesResult.data ?? [];
  const activeTitleDef   = activeTitleId ? (allTitles.find(t => t.id === activeTitleId) ?? null) : null;
  const ownedTitleIds    = new Set((userTitlesResult.data ?? []).map(r => r.title_id));
  const ownedTitles      = allTitles.filter(t => ownedTitleIds.has(t.id));
  const totalTitles      = allTitles.length;
  const ownedTitlesCount = ownedTitles.length;

  // ── Parse achievements ────────────────────────────────────────────────────────

  const earnedAchievementIds = new Set(
    (userAchievementsResult.data ?? []).map(r => r.achievement_id)
  );

  // ── Rarity breakdown (owned items + owned themes) ─────────────────────────────

  const rarityCounts = { legendary: 0, rare: 0, uncommon: 0, common: 0 };

  for (const item of ownedItems) {
    const r = item.rarity;
    if (r !== null && r !== undefined && r in rarityCounts) rarityCounts[r]++;
  }

  for (const theme of allThemes) {
    if (!ownedThemeSet.has(theme.id)) continue;
    const r = theme.rarity;
    if (r !== null && r !== undefined && r in rarityCounts) rarityCounts[r]++;
  }

  for (const def of ACHIEVEMENT_DEFS) {
    if (!earnedAchievementIds.has(def.id)) continue;
    const r = def.rarity ?? "common";
    if (r in rarityCounts) rarityCounts[r]++;
  }

  for (const title of ownedTitles) {
    const r = title.rarity ?? "common";
    if (r in rarityCounts) rarityCounts[r]++;
  }

  // ── Prestige score (server-authoritative) ────────────────────────────────────

  const prestigeScore = prestigeResult.data ?? 0;

  // ── Teacher spotlight banner ──────────────────────────────────────────────────

  const spotlight = Array.isArray(spotlightResult.data) ? (spotlightResult.data[0] ?? null) : null;
  const spotlightBannerEl = document.getElementById("spotlightBanner");
  if (spotlight && spotlightBannerEl) {
    const label   = spotlight.label   ?? "Fremhævet";

    spotlightBannerEl.innerHTML =
      `<div class="spotlight-banner">` +
        `<div class="spotlight-icon" aria-hidden="true">✦</div>` +
        `<div class="spotlight-content">` +
          `<div class="spotlight-label">${label.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div>` +

          `</div>` +
        `</div>` +

  // ── Completion calculations ───────────────────────────────────────────────────

  const totalAchievements       = ACHIEVEMENT_DEFS.length;
  const earnedAchievementsCount = ACHIEVEMENT_DEFS.filter(d => earnedAchievementIds.has(d.id)).length;

  const itemsPct        = totalItems        > 0 ? Math.round((ownedItemsCount        / totalItems)        * 100) : 0;
  const themesPct       = totalThemes       > 0 ? Math.round((ownedThemesCount       / totalThemes)       * 100) : 0;
  const achievementsPct = totalAchievements > 0 ? Math.round((earnedAchievementsCount / totalAchievements) * 100) : 0;
  const titlesPct       = totalTitles       > 0 ? Math.round((ownedTitlesCount       / totalTitles)       * 100) : 0;

  const totalAll = totalItems + totalThemes + totalAchievements + totalTitles;
  const ownedAll = ownedItemsCount + ownedThemesCount + earnedAchievementsCount + ownedTitlesCount;
  const totalPct = totalAll > 0 ? Math.round((ownedAll / totalAll) * 100) : 0;

  // ── Helpers ───────────────────────────────────────────────────────────────────

  function getHighestEquippedRarity() {
    const rarities = ALL_SLOTS
      .map(slot => equippedSlots[slot])
      .filter(Boolean)
      .map(id => allShopItems.find(i => i.id === id)?.rarity)
      .filter(Boolean);

    for (const r of RARITY_ORDER) {
      if (rarities.includes(r)) return r;
    }
    return null;
  }

  // ── Avatar life engines (Section 151B) ────────────────────────────────────────
  // Same engines as the quiz page and avatar.html — expression, breathing, blink.
  // Non-fatal: any engine failure leaves the hub fully functional.

  let exprEngine     = null;
  let presenceEngine = null;
  let blinkEngine    = null;
  let reactionTimer  = null;

  function initAvatarLifeEngines() {
    const avatarEl = document.getElementById("profileAvatar");
    if (!avatarEl) return;
    // Only init once the base body layer is rendered — if the avatar never
    // rendered, the hub stays static (no floating expression overlay).
    if (!avatarEl.querySelector("img.profile-avatar-layer")) return;

    // 167A Phase-1 guard: skip expression + blink when the raster baked base is active
    // (face is baked). Presence/breathing stays. C2/SVG path unchanged.
    const r2Active = isAvatarR2ActiveFor(avatarIdentity);
    if (!r2Active) {
      try { exprEngine   = new ExpressionEngine(avatarEl); } catch (e) { console.warn("EXPR ENGINE INIT FAILED:", e); }
    }
    try { presenceEngine = new PresenceEngine(avatarEl);   } catch (e) { console.warn("PRESENCE ENGINE INIT FAILED:", e); }
    if (!r2Active) {
      try { blinkEngine  = new BlinkEngine(avatarEl, skinToneFor(avatarIdentity)); } catch (e) { console.warn("BLINK ENGINE INIT FAILED:", e); }
    }
  }

  // How long the reaction state stays observable on #avatarShowcase (matches the
  // expression engine hold durations for each event).
  const REACTION_HOLD_MS = {
    "achievement":  3200,
    "reward":       2200,
    "welcome-back": 1600,
  };

  function triggerAvatarReaction(reaction, engineEvent) {
    exprEngine?.onGameEvent(engineEvent);
    presenceEngine?.onGameEvent(engineEvent);

    // Reaction state on the showcase — observable for tests and future CSS hooks.
    const showcase = document.getElementById("avatarShowcase");
    if (!showcase) return;
    if (reactionTimer) { clearTimeout(reactionTimer); reactionTimer = null; }
    showcase.dataset.avatarReaction = reaction;
    reactionTimer = setTimeout(() => {
      reactionTimer = null;
      delete showcase.dataset.avatarReaction;
    }, REACTION_HOLD_MS[reaction] ?? 2200);
  }

  // ── Profile avatar rendering ──────────────────────────────────────────────────

  async function renderProfileAvatar() {
    const avatarEl   = document.getElementById("profileAvatar");
    const showcaseEl = document.getElementById("avatarShowcase");
    if (!avatarEl || !showcaseEl) return;

    avatarEl.innerHTML = "";

    // Section 155G: C2 render pipeline behind AVATAR_V2 (default OFF). Base + hair
    // via the shared module; cosmetics deferred to a later C2 section. After the
    // async mount we (re-)init the life engines once — the external
    // initAvatarLifeEngines() call runs while this mount is still pending and
    // no-ops on the missing base, so the (!blinkEngine) guard prevents a double init.
    if (isAvatarV2()) {
      const cosmetics = c2CosmeticLayers(equippedSlots, id => allShopItems.find(i => i.id === id)?.image_url);
      await mountC2Avatar(avatarEl, avatarIdentity, { layerClass: "profile-avatar-layer", cosmetics });
      showcaseEl.dataset.rarity = getHighestEquippedRarity() ?? "";
      showcaseEl.dataset.gender = avatarGender;
      if (!blinkEngine) initAvatarLifeEngines();
      return;
    }

    // Collect all layers, sort by z ascending, insert in that order so DOM
    // paint order matches z-order (back items before body before front items)
    // Section 152A/152B: identity base = body + hair from the shared helper
    const layers = [...baseLayersFor(avatarIdentity)];

    ALL_SLOTS.forEach(slot => {
      const itemId = equippedSlots[slot];
      if (!itemId) return;
      const item = allShopItems.find(i => i.id === itemId);
      if (!item || !item.image_url) return;
      layers.push({ src: item.image_url, z: SLOT_Z[slot] ?? 1 });
    });

    layers.sort((a, b) => a.z - b.z);

    layers.forEach(({ src, z }) => {
      const img = document.createElement("img");
      img.className = "profile-avatar-layer";
      img.src = src;
      img.style.zIndex = String(z);
      img.alt = "";
      avatarEl.appendChild(img);
    });

    // Rarity aura + border on showcase wrapper
    showcaseEl.dataset.rarity = getHighestEquippedRarity() ?? "";
    // Gender-aware background tint (mirrors avatar.html)
    showcaseEl.dataset.gender = avatarGender;
  }

  // ── Identity rendering ────────────────────────────────────────────────────────

    const streakBestEl = document.getElementById("statStreakBest");

  // Section 151B: reaction queued by a successful daily claim, fired when the
  // reward modal is dismissed — the avatar is occluded while the modal is open.
  // Streak milestones (3/7/14/30 days) upgrade the reaction to achievement weight.
  const STREAK_MILESTONES = [3, 7, 14, 30];
  let pendingDailyRewardReaction = null;

  // Auto-claim daily reward (idempotent — safe to call on every page load)
  async function claimDailyReward() {
    const { data, error } = await supabase.rpc("claim_daily_reward");
    if (error) return;
    if (data?.status !== "claimed") return;

    const claimedCoins  = data.coins  ?? 0;
    const claimedStreak = data.streak ?? 0;

    pendingDailyRewardReaction = STREAK_MILESTONES.includes(claimedStreak)
      ? "achievement"
      : "reward";

    // Show modal
    const overlay = document.getElementById("dailyRewardOverlay");
    if (overlay) {
      const droCoins = document.getElementById("droCoins");
      if (droCoins) droCoins.textContent = "+" + claimedCoins + " 🪙";

      const droStreak = document.getElementById("droStreakInfo");
      if (droStreak) {
        droStreak.textContent = claimedStreak > 0
          ? claimedStreak + " dages streak! 🔥"
          : "Velkommen tilbage!";
      }

      // Context nudge: find the nearest-done daily or weekly quest
      const droContextEl = document.getElementById("droContextLine");
      if (droContextEl) {
        const allQuests = questsResult.data ?? [];
        const qProgMap  = {};
        for (const row of (questProgressResult.data ?? [])) qProgMap[row.quest_id] = row;

        const nearDaily = allQuests
          .map(q => {
            const p = qProgMap[q.id] ?? { progress: 0, completed: false };
            const pct = q.target > 0 ? Math.min(1, p.progress / q.target) : 0;
            return { ...q, completed: !!p.completed, pct };
          })
          .filter(q => !q.completed && q.pct > 0)
          .sort((a, b) => b.pct - a.pct)[0] ?? null;

        const allWeeklyQuests = weeklyQuestsResult.data ?? [];
        const wProgMap = {};
        for (const row of (weeklyQuestProgressResult.data ?? [])) wProgMap[row.quest_id] = row;

        const nearWeekly = allWeeklyQuests
          .map(q => {
            const p = wProgMap[q.id] ?? { progress: 0, completed: false };
            const pct = q.target > 0 ? Math.min(1, p.progress / q.target) : 0;
            return { ...q, completed: !!p.completed, pct };
          })
          .filter(q => !q.completed && q.pct > 0)
          .sort((a, b) => b.pct - a.pct)[0] ?? null;

        if (nearDaily && nearDaily.pct >= 0.5) {
          const left = nearDaily.target - Math.min(nearDaily.progress ?? 0, nearDaily.target);
          droContextEl.textContent = left + " mere for at færdiggøre: " + nearDaily.label;
        } else if (nearWeekly && nearWeekly.pct >= 0.5) {
          const left = nearWeekly.target - Math.min(nearWeekly.progress ?? 0, nearWeekly.target);
          droContextEl.textContent = left + " mere for ugemål: " + nearWeekly.label;
        } else {
          droContextEl.textContent = "";
        }
      }

      overlay.classList.add("visible");
      overlay.setAttribute("aria-hidden", "false");
      playSound("buy");
    }

    // Update coins chip to reflect awarded coins
    const coinsEl = document.getElementById("statCoins");
    if (coinsEl) {
      const current = parseInt(coinsEl.textContent, 10) || 0;
      coinsEl.textContent = current + claimedCoins;
    }

    renderDailyRewardCard(true);
  }

  // ── Quest rendering ───────────────────────────────────────────────────────────

  function renderQuests() {
    const quests = questsResult.data ?? [];
    const progressMap = {};
    for (const row of (questProgressResult.data ?? [])) {
      progressMap[row.quest_id] = row;
    }

    const listEl = document.getElementById("questList");
    if (!listEl) return;
    listEl.innerHTML = "";

    if (quests.length === 0) {
      listEl.innerHTML =
        `<p style="font-size:12px;color:var(--text-muted)">Ingen aktive mål i dag</p>`;
      return;
    }

    for (const quest of quests) {
      const prog   = progressMap[quest.id] ?? { progress: 0, completed: false, claimed: false };
      const capped = Math.min(prog.progress, quest.target);
      const pct    = quest.target > 0
        ? Math.min(100, Math.round((capped / quest.target) * 100))
        : 0;

      const claimBtnHtml = prog.claimed
        ? `<button class="quest-claim-btn" disabled>&#10003; Hentet</button>`
        : (prog.completed
          ? `<button class="quest-claim-btn" data-quest-id="${quest.id}">Hent!</button>`
          : `<button class="quest-claim-btn" disabled>${capped}&thinsp;/&thinsp;${quest.target}</button>`);

      const row = document.createElement("div");
      row.className = "quest-row";
      row.innerHTML =
        `<div class="quest-row-top">` +
          `<span class="quest-label">${quest.label}</span>` +
          `<span class="quest-reward-badge">+${quest.reward_coins}&thinsp;&#x1FA99;</span>` +
        `</div>` +
        `<div class="quest-progress-track">` +
          `<div class="quest-progress-fill" style="width:${pct}%"></div>` +
        `</div>` +
        `<div class="quest-row-bottom">` +
          `<span class="quest-progress-text">${capped} / ${quest.target}</span>` +
          claimBtnHtml +
        `</div>`;

      listEl.appendChild(row);
    }

    // Wire claim buttons
    listEl.querySelectorAll(".quest-claim-btn[data-quest-id]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const questId = btn.dataset.questId;
        await claimQuestReward(questId, btn);
      });
    });
  }

  async function claimQuestReward(questId, btnEl) {
    btnEl.disabled = true;

    const { data, error } = await supabase.rpc("claim_quest_reward", {
      p_quest_id:   questId,
      p_quest_date: todayUTC,
    });

    if (error) {
      showToast("Fejl ved hentning af belønning", "error");
      btnEl.disabled = false;
      return;
    }

    if (data?.status === "claimed") {
      const coinsWon = data.coins ?? 0;
      showToast("+" + coinsWon + " mønter! Mål gennemført 🎯", "success");
      playSound("buy");

      // Update coins chip live
      const coinsEl = document.getElementById("statCoins");
      if (coinsEl) {
        const current = parseInt(coinsEl.textContent, 10) || 0;
        coinsEl.textContent = current + coinsWon;
      }

      btnEl.textContent = "✓ Hentet";
      btnEl.disabled = true;

      // Section 151B: avatar reacts after the claim has fully completed
      triggerAvatarReaction("reward", "REWARD_CLAIMED");
    } else {
      showToast("Målet er ikke fuldført endnu", "info");
      btnEl.disabled = false;
    }
  }

  // ── Achievement rendering ─────────────────────────────────────────────────────

  function renderAchievements() {
    const gridEl  = document.getElementById("achievementGrid");
    const countEl = document.getElementById("achievementCount");
    if (!gridEl) return;

    const earnedCount = ACHIEVEMENT_DEFS.filter(d => earnedAchievementIds.has(d.id)).length;
    const totalCount  = ACHIEVEMENT_DEFS.length;

    if (countEl) countEl.textContent = earnedCount + " / " + totalCount;

    gridEl.innerHTML = "";
    for (const def of ACHIEVEMENT_DEFS) {
      const unlocked       = earnedAchievementIds.has(def.id);
      const isHiddenLocked = (def.hidden ?? false) && !unlocked;

      const badge = document.createElement("div");
      badge.id = "ach-" + def.id;

      if (isHiddenLocked) {
        badge.className = "ach-badge ach-badge--locked ach-badge--hidden-locked";
        badge.title = "Hemmeligt";
        badge.dataset.rarity = "";
        badge.innerHTML =
          `<span class="ach-badge-icon" aria-hidden="true">?</span>` +
          `<span class="ach-badge-label">???</span>`;
      } else {
        badge.className = "ach-badge " + (unlocked ? "ach-badge--unlocked" : "ach-badge--locked");
        badge.title = def.label;
        badge.dataset.rarity = def.rarity ?? "common";
        badge.innerHTML =
          `<span class="ach-badge-icon">${def.icon}</span>` +
          `<span class="ach-badge-label">${def.label}</span>`;
      }

      gridEl.appendChild(badge);
    }
  }

  const REWARD_NAMES = {
    "forest":           "Skov-tema",
    "crown-silver":     "Sølvkrone",
    "rookie":           "Rookie",
    "vedholdende":      "Vedholdende",
    "natugle":          "Natugle",
    "hurtiglaerer":     "Hurtiglærer",
    "den-store-samler": "Den Store Samler",
  };

  function formatRewardToast(grant) {
    if (!grant) return "";
    if (grant.reward_type === "coins") return "+" + (grant.reward_amount ?? 0) + " mønter! 🪙";
    if (grant.reward_type === "theme") return "Tema optjent: " + (REWARD_NAMES[grant.reward_value] ?? grant.reward_value) + "! 🎨";
    if (grant.reward_type === "item")  return "Item optjent: "  + (REWARD_NAMES[grant.reward_value] ?? grant.reward_value) + "! 🎁";
    if (grant.reward_type === "title") return "Titel optjent: " + (REWARD_NAMES[grant.reward_value] ?? grant.reward_value) + "! 🏅";
    return "";
  }

  const RARITY_WEIGHT = { legendary: 4, rare: 3, uncommon: 2, common: 1 };

  function playSoundForRarity(rarity) {
    if (rarity === "legendary") {
      playSound("equip");
      setTimeout(() => playSound("buy"), 70);
    } else if (rarity === "rare") {
      playSound("equip");
    } else {
      playSound("buy");
    }
  }

  function toastTypeForRarity(rarity) {
    if (rarity === "legendary") return "legendary";
    if (rarity === "rare")      return "rare";
    if (rarity === "uncommon")  return "uncommon";
    return "success";
  }

  function toastDurationForRarity(rarity) {
    if (rarity === "legendary") return 4500;
    if (rarity === "rare")      return 3800;
    if (rarity === "uncommon")  return 3200;
    return 2800;
  }

  // Evaluate achievements on hub load; notify for anything newly unlocked.
  async function evaluateAndNotifyAchievements() {
    const { data: newlyUnlocked, error: evalError } = await supabase.rpc("evaluate_achievements");
    const hasNewUnlocks = !evalError && Array.isArray(newlyUnlocked) && newlyUnlocked.length > 0;

    // Grant all unclaimed rewards — newly unlocked AND historical backfill.
    const allEarned = hasNewUnlocks
      ? [...new Set([...Array.from(earnedAchievementIds), ...newlyUnlocked])]
      : Array.from(earnedAchievementIds);

    let newUnlockedGrants = [];
    if (allEarned.length > 0) {
      const { data: grants } = await supabase.rpc("grant_achievement_rewards", {
        p_achievement_ids: allEarned,
      });
      if (hasNewUnlocks && Array.isArray(grants) && grants.length > 0) {
        newUnlockedGrants = grants.filter(g => newlyUnlocked.includes(g.achievement_id));
      }
    }

    if (!hasNewUnlocks) return;

    // Sort by rarity descending so legendary unlocks get immediate attention
    const sorted = [...newlyUnlocked].sort((a, b) => {
      const ra = ACHIEVEMENT_DEFS.find(d => d.id === a)?.rarity ?? "common";
      const rb = ACHIEVEMENT_DEFS.find(d => d.id === b)?.rarity ?? "common";
      return (RARITY_WEIGHT[rb] ?? 1) - (RARITY_WEIGHT[ra] ?? 1);
    });

    let cumDelay = 0;
    for (let i = 0; i < sorted.length; i++) {
      const id     = sorted[i];
      const def    = ACHIEVEMENT_DEFS.find(d => d.id === id);
      if (!def) continue;
      const rarity = def.rarity ?? "common";
      const delay  = cumDelay;
      cumDelay    += (rarity === "legendary" ? 520 : 380);

      setTimeout(() => {
        const isHidden = def.hidden ?? false;
        const toastMsg = isHidden
          ? "Hemmelighed afsløret: " + def.label + " " + def.icon
          : "Præstation opnået: " + def.label + " " + def.icon;
        showToast(toastMsg, toastTypeForRarity(rarity), toastDurationForRarity(rarity));
        playSoundForRarity(rarity);

        // Section 151B: the avatar shares the moment — critical proud hold.
        // Re-triggering per staggered toast extends pride across the sequence.
        triggerAvatarReaction("achievement", "ACHIEVEMENT_UNLOCK");

        // Update local earned set and re-render the affected badge live.
        earnedAchievementIds.add(id);

        const badgeEl = document.getElementById("ach-" + id);
        if (badgeEl) {
          const wasHiddenLocked = badgeEl.classList.contains("ach-badge--hidden-locked");

          badgeEl.classList.remove("ach-badge--locked", "ach-badge--hidden-locked");
          badgeEl.classList.add("ach-badge--unlocked");
          badgeEl.dataset.rarity = rarity;
          badgeEl.title = def.label;

          if (wasHiddenLocked) {
            badgeEl.innerHTML =
              `<span class="ach-badge-icon">${def.icon}</span>` +
              `<span class="ach-badge-label">${def.label}</span>`;
            badgeEl.classList.add("ach-badge--just-revealed");
            badgeEl.addEventListener("animationend", () => {
              badgeEl.classList.remove("ach-badge--just-revealed");
            }, { once: true });
          } else {
            badgeEl.classList.add("ach-badge--just-unlocked");
            badgeEl.addEventListener("animationend", () => {
              badgeEl.classList.remove("ach-badge--just-unlocked");
            }, { once: true });
          }
        }

        // Update count chip.
        const countEl = document.getElementById("achievementCount");
        if (countEl) {
          const newEarned = ACHIEVEMENT_DEFS.filter(d => earnedAchievementIds.has(d.id)).length;
          countEl.textContent = newEarned + " / " + ACHIEVEMENT_DEFS.length;
        }
      }, delay);

      // Reward toast fires 300ms after the unlock toast for this achievement
      const grant = newUnlockedGrants.find(g => g.achievement_id === id);
      if (grant) {
        const rewardMsg = formatRewardToast(grant);
        if (rewardMsg) {
          setTimeout(() => showToast(rewardMsg, toastTypeForRarity(rarity), 3000), delay + 300);
        }
      }
    }
  }

  // ── Next Goal ─────────────────────────────────────────────────────────────────

  function unitFor(id, remaining) {
    if (id.startsWith("correct"))    return remaining === 1 ? "korrekt svar mere"  : "korrekte svar mere";
    if (id.startsWith("streak"))     return remaining === 1 ? "dag mere"           : "dage mere";
    if (id === "first_purchase" || id === "collector_5") return remaining === 1 ? "item mere" : "items mere";
    if (id === "themes_3")           return remaining === 1 ? "tema mere"          : "temaer mere";
    if (id === "level_10")           return remaining === 1 ? "niveau mere"        : "niveauer mere";
    return "mere";
  }

  function computeNextGoal() {
    const { level, xpIntoLevel, xpRequiredForLevel, progress } = getXPProgressInLevel(xp);

    const TRACKABLE = [
      { id: "first_correct",  label: "Første svar",  icon: "✓",  target: 1,    current: correctCount,     href: "index.html"  },
      { id: "correct_10",     label: "10 svar",       icon: "◎",  target: 10,   current: correctCount,     href: "index.html"  },
      { id: "correct_100",    label: "100 svar",      icon: "★",  target: 100,  current: correctCount,     href: "index.html"  },
      { id: "correct_1000",   label: "1000 svar",     icon: "🏆", target: 1000, current: correctCount,     href: "index.html"  },
      { id: "first_purchase", label: "Første køb",    icon: "🛒", target: 1,    current: ownedItemsCount,  href: "shop.html"   },
      { id: "collector_5",    label: "5 items",        icon: "💎", target: 5,    current: ownedItemsCount,  href: "shop.html"   },
      { id: "themes_3",       label: "3 temaer",       icon: "🎨", target: 3,    current: ownedThemesCount, href: "themes.html" },
      { id: "streak_7",       label: "7 dage streak",  icon: "🔥", target: 7,    current: currentStreak,    href: null          },
      { id: "streak_30",      label: "30 dage streak", icon: "⚡", target: 30,   current: currentStreak,    href: null          },
      { id: "level_10",       label: "Niveau 10",      icon: "▲",  target: 10,   current: level,            href: "index.html"  },
    ];

    const HREF_LABEL = { "index.html": "Spil →", "shop.html": "Butik →", "themes.html": "Temaer →" };

    // Achievement nearest to completion (at least 30% progress, not yet earned)
    const achCandidates = TRACKABLE
      .filter(t => !earnedAchievementIds.has(t.id) && t.current > 0 && t.current < t.target)
      .map(t => ({ ...t, pct: t.current / t.target, remaining: t.target - t.current }))
      .sort((a, b) => b.pct - a.pct);

    if (achCandidates.length > 0 && achCandidates[0].pct >= 0.3) {
      const c = achCandidates[0];
      return {
        icon: c.icon,
        text: c.remaining + " " + unitFor(c.id, c.remaining) + " for at opnå: " + c.label,
        href: c.href,
        btnLabel: c.href ? (HREF_LABEL[c.href] ?? "Gå →") : null,
      };
    }

    // XP close to leveling up
    if (progress >= 0.65) {
      const needed = xpRequiredForLevel - xpIntoLevel;
      return {
        icon: "▲",
        text: needed + " XP mere til niveau " + (level + 1),
        href: "index.html",
        btnLabel: "Spil →",
      };
    }

    // Daily quest nearly done
    const quests = questsResult.data ?? [];
    const qProgressMap = {};
    for (const row of (questProgressResult.data ?? [])) qProgressMap[row.quest_id] = row;
    const nearDoneQuest = quests
      .map(q => {
        const p = qProgressMap[q.id] ?? { progress: 0, completed: false };
        const pct = q.target > 0 ? Math.min(1, p.progress / q.target) : 0;
        return { ...q, completed: !!p.completed, pct };
      })
      .filter(q => !q.completed && q.pct >= 0.5)
      .sort((a, b) => b.pct - a.pct)[0] ?? null;

    if (nearDoneQuest) {
      return {
        icon: "🎯",
        text: "Næsten færdig: " + nearDoneQuest.label,
        href: "index.html",
        btnLabel: "Spil →",
      };
    }

    // New user: never answered a question
    if (correctCount === 0) {
      return {
        icon: "🎮",
        text: "Svar på dit første spørgsmål for at optjene XP og mønter",
        href: "index.html",
        btnLabel: "Spil →",
      };
    }

    // Has coins but no items yet
    if (ownedItemsCount === 0 && coins >= 30) {
      return {
        icon: "🛒",
        text: "Brug dine mønter i butikken og tilpas din avatar",
        href: "shop.html",
        btnLabel: "Butik →",
      };
    }

    return null;
  }

  function renderNextGoal() {
    const cardEl = document.getElementById("nextGoalCard");
    if (!cardEl) return;

    const goal = computeNextGoal();
    if (!goal) {
      cardEl.hidden = true;
      return;
    }

    const safeText = goal.text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    cardEl.innerHTML =
      `<div class="next-goal-card">` +
        `<div class="next-goal-icon" aria-hidden="true">${goal.icon}</div>` +
        `<div class="next-goal-body">` +
          `<div class="next-goal-eyebrow">Næste mål</div>` +
          `<div class="next-goal-text">${safeText}</div>` +
        `</div>` +
        (goal.href && goal.btnLabel
          ? `<button class="next-goal-btn" onclick="window.location.href='${goal.href}'">${goal.btnLabel}</button>`
          : ""
        ) +
      `</div>`;
    cardEl.hidden = false;
  }

  // ── Init ──────────────────────────────────────────────────────────────────────

  renderProfileAvatar();
  initAvatarLifeEngines();
  renderIdentity();
  renderCollection();
  renderDailyRewardCard(alreadyClaimedToday);
  renderQuests();
  renderWeeklyQuests();
  renderAchievements();
  renderNextGoal();

  // Suppress collection noise for brand-new users who have nothing yet
  if (correctCount === 0 && ownedItemsCount === 0) {
    document.getElementById("collectionPanel")?.setAttribute("data-new-user", "");
  }

  // Dismiss daily reward modal
  const droDismissBtn = document.getElementById("droDismissBtn");
  if (droDismissBtn) {
    droDismissBtn.addEventListener("click", () => {
      const overlay = document.getElementById("dailyRewardOverlay");
      if (overlay) {
        overlay.classList.remove("visible");
        overlay.setAttribute("aria-hidden", "true");
      }

      // Section 151B: fire the queued daily-reward reaction now that the
      // avatar is visible again. Milestone streaks carry achievement weight.
      if (pendingDailyRewardReaction !== null) {
        const reaction = pendingDailyRewardReaction;
        pendingDailyRewardReaction = null;
        triggerAvatarReaction(
          reaction,
          reaction === "achievement" ? "ACHIEVEMENT_UNLOCK" : "REWARD_CLAIMED"
        );
      }
    });
  }

  // Section 151B: welcome-back — the avatar notices the student returning to
  // the tab after a real absence (>= 30s hidden). Curious, never demanding.
  let hiddenSince = null;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      hiddenSince = Date.now();
      return;
    }
    if (hiddenSince !== null && Date.now() - hiddenSince >= 30000) {
      triggerAvatarReaction("welcome-back", "WELCOME_BACK");
    }
    hiddenSince = null;
  });

  // Achievement panel: keyboard navigation (Enter / Space → open page)
  const achPanel = document.querySelector(".achievement-panel");
  if (achPanel) {
    achPanel.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        window.location.href = "achievements.html";
      }
    });
  }

  // Async, non-blocking — idempotent RPCs, safe on every page load.
  claimDailyReward();
  evaluateAndNotifyAchievements();
</script>

</body>
</html>
