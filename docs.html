<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Internal engineering docs — do not index. Only an allowlisted subset is rendered here. -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Docs — Den Seje App</title>
  <style>
    :root {
      --bg: #0f1225; --panel: #1a1f3a; --panel-2: #232a4d; --border: #2f3763;
      --text: #e8ebff; --dim: #aab0d6; --accent: #6f8bff; --code-bg: #12162e;
    }
    * , *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6; padding: 24px 16px 80px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    .topbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 24px; }
    .topbar a { color: var(--accent); text-decoration: none; font-size: 14px; }
    .topbar a:hover { text-decoration: underline; }
    .topbar .sep { color: var(--dim); }
    #content h1 { font-size: 1.9rem; margin: 0.4em 0 0.5em; line-height: 1.25; }
    #content h2 { font-size: 1.45rem; margin: 1.4em 0 0.5em; border-bottom: 1px solid var(--border); padding-bottom: 0.25em; }
    #content h3 { font-size: 1.18rem; margin: 1.2em 0 0.4em; }
    #content h4, #content h5, #content h6 { font-size: 1.02rem; margin: 1em 0 0.35em; color: var(--dim); }
    #content p { margin: 0.7em 0; }
    #content a { color: var(--accent); }
    #content ul, #content ol { margin: 0.6em 0; padding-left: 1.6em; }
    #content li { margin: 0.25em 0; }
    #content hr { border: 0; border-top: 1px solid var(--border); margin: 1.6em 0; }
    #content blockquote {
      margin: 0.9em 0; padding: 0.4em 1em; border-left: 3px solid var(--accent);
      background: var(--panel); color: var(--dim); border-radius: 0 8px 8px 0;
    }
    #content code {
      background: var(--code-bg); padding: 0.12em 0.4em; border-radius: 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.88em;
    }
    #content pre {
      background: var(--code-bg); padding: 14px 16px; border-radius: 10px;
      overflow-x: auto; border: 1px solid var(--border); margin: 0.9em 0;
    }
    #content pre code { background: none; padding: 0; font-size: 0.85em; }
    .table-scroll { overflow-x: auto; margin: 0.9em 0; }
    #content table { border-collapse: collapse; width: 100%; font-size: 0.92em; }
    #content th, #content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }
    #content th { background: var(--panel-2); }
    #content tr:nth-child(even) td { background: var(--panel); }
    .doc-index { list-style: none; padding: 0; }
    .doc-index li { margin: 10px 0; }
    .doc-index a { font-size: 1.1rem; }
    .error { background: #3a1420; border: 1px solid #7a2438; color: #ffd7de; padding: 14px 16px; border-radius: 10px; }
  </style>
</head>
<body style="display:none">
  <div class="wrap">
    <div class="topbar" id="topbar"></div>
    <div id="content"><p style="color:var(--dim)">Indlæser…</p></div>
  </div>

  <script type="module">
  import { supabase } from "./supabaseClient.js";
  (function () {
    "use strict";

    // The allowlist lives in tools/publish-docs.mjs and reaches this page as manifest.json in
    // the PRIVATE bucket, so there is exactly one list and the page cannot name a document the
    // publisher never uploaded. The local documentation folder is not fetched any more: those
    // published to the CDN at all, which is what keeps them unreadable without a session.
    var DOCS = {};
    var BUCKET = "docs";
    // Reverse map: filename (lowercase) -> slug, for internal link rewriting.
    var FILE_TO_SLUG = {};
    Object.keys(DOCS).forEach(function (slug) { FILE_TO_SLUG[DOCS[slug].file.toLowerCase()] = slug; });

    // Quotes are escaped too, not just angle brackets: the result of this is interpolated into
    // the link href below, so an unescaped quote would end that attribute and let the rest of
    // link target become new attributes — an onmouseover that fires without a click.
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Rewrite a link target. The scheme list is an ALLOWLIST, not a blocklist: only http(s),
    // mailto and in-page anchors survive as themselves. Everything unrecognised — javascript:,
    // data:text/html, vbscript:, or a target crafted to break out of the attribute — becomes a
    // dead anchor. A viewer that runs in a super_admin session is the wrong place to be generous.
    function rewriteHref(u) {
      u = String(u).trim();
      if (/^(https?:\/\/|mailto:|#)/i.test(u)) return escapeHtml(u);
      var base = u.replace(/^\.?\//, "").split(/[?#]/)[0];
      var lower = base.toLowerCase();
      if (FILE_TO_SLUG[lower]) return "docs.html?doc=" + encodeURIComponent(FILE_TO_SLUG[lower]);
      // Not published: the file is not on the CDN at all, so a /docs/ link would 404 and would
      // advertise an internal path for nothing. Send the reader to the index of what IS available.
      if (/\.md$/i.test(base)) return "docs.html";
      return "#";
    }

    // Inline formatting. Order: extract code (raw) -> escape -> links -> bold -> italic -> restore code.
    function inline(text) {
      var codes = [];
      text = String(text).replace(/`([^`]+)`/g, function (m, c) { codes.push(c); return "@@RACODE" + (codes.length - 1) + "@@"; });
      text = escapeHtml(text);
      text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (m, t, u) {
        return '<a href="' + rewriteHref(u) + '">' + t + "</a>";
      });
      text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      text = text.replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,!?:;]|$)/g, "$1<em>$2</em>");
      text = text.replace(/(^|[\s(])_([^_\s][^_]*?)_(?=[\s).,!?:;]|$)/g, "$1<em>$2</em>");
      text = text.replace(/@@RACODE(\d+)@@/g, function (m, i) { return "<code>" + escapeHtml(codes[+i]) + "</code>"; });
      return text;
    }

    function isTableSep(line) { return /^\s*\|?[\s:-]*-[\s:|-]*\|?\s*$/.test(line) && line.indexOf("-") !== -1 && line.indexOf("|") !== -1; }
    function splitRow(line) {
      var s = line.trim().replace(/^\|/, "").replace(/\|$/, "");
      return s.split("|").map(function (c) { return c.trim(); });
    }

    function render(md) {
      var lines = String(md).replace(/\r\n?/g, "\n").split("\n");
      var out = [], i = 0;
      while (i < lines.length) {
        var line = lines[i];

        if (/^```/.test(line)) {
          var buf = []; i++;
          while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
          i++; // skip closing fence
          out.push("<pre><code>" + escapeHtml(buf.join("\n")) + "</code></pre>");
          continue;
        }
        if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
        var h = line.match(/^(#{1,6})\s+(.*)$/);
        if (h) { var n = h[1].length; out.push("<h" + n + ">" + inline(h[2].trim()) + "</h" + n + ">"); i++; continue; }

        if (/^>\s?/.test(line)) {
          var q = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, "")); i++; }
          out.push("<blockquote>" + inline(q.join(" ")) + "</blockquote>");
          continue;
        }

        // Table: a pipe row followed by a separator row.
        if (line.indexOf("|") !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
          var header = splitRow(line); i += 2;
          var rows = [];
          while (i < lines.length && lines[i].indexOf("|") !== -1 && lines[i].trim() !== "") { rows.push(splitRow(lines[i])); i++; }
          var t = '<div class="table-scroll"><table><thead><tr>';
          header.forEach(function (c) { t += "<th>" + inline(c) + "</th>"; });
          t += "</tr></thead><tbody>";
          rows.forEach(function (r) {
            t += "<tr>";
            for (var k = 0; k < header.length; k++) { t += "<td>" + inline(r[k] != null ? r[k] : "") + "</td>"; }
            t += "</tr>";
          });
          t += "</tbody></table></div>";
          out.push(t);
          continue;
        }

        var lu = line.match(/^\s*([-*+])\s+(.*)$/);
        var lo = line.match(/^\s*(\d+)\.\s+(.*)$/);
        if (lu || lo) {
          var ordered = !!lo, items = [];
          var re = ordered ? /^\s*\d+\.\s+(.*)$/ : /^\s*[-*+]\s+(.*)$/;
          while (i < lines.length && re.test(lines[i])) {
            var item = lines[i].replace(re, "$1"); i++;
            // Lazy continuation: fold wrapped (indented, non-item) lines into the same item,
            // so inline spans that wrap across source lines (e.g. **bold**) stay intact.
            while (i < lines.length && !/^\s*$/.test(lines[i]) && !re.test(lines[i])
                   && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i])
                   && !/^(#{1,6}\s|>|```)/.test(lines[i])
                   && !(lines[i].indexOf("|") !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1]))) {
              item += " " + lines[i].trim(); i++;
            }
            items.push(item);
          }
          var tag = ordered ? "ol" : "ul";
          out.push("<" + tag + ">" + items.map(function (it) { return "<li>" + inline(it) + "</li>"; }).join("") + "</" + tag + ">");
          continue;
        }

        if (/^\s*$/.test(line)) { i++; continue; }

        // Paragraph: gather until blank or a block-starting line.
        var para = [];
        while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6}\s|>|```|\s*(-{3,}|\*{3,}|_{3,})\s*$)/.test(lines[i])
               && !(lines[i].indexOf("|") !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1]))
               && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
          para.push(lines[i]); i++;
        }
        if (para.length) out.push("<p>" + inline(para.join(" ")) + "</p>");
        else i++;
      }
      return out.join("\n");
    }

    function renderTopbar(activeSlug) {
      var tb = document.getElementById("topbar");
      var parts = ['<a href="docs.html">📚 Docs</a>'];
      Object.keys(DOCS).forEach(function (slug) {
        parts.push('<span class="sep">·</span>');
        var label = escapeHtml(DOCS[slug].title);
        parts.push(slug === activeSlug ? "<strong>" + label + "</strong>" : '<a href="docs.html?doc=' + encodeURIComponent(slug) + '">' + label + "</a>");
      });
      tb.innerHTML = parts.join(" ");
    }

    function showIndex() {
      renderTopbar(null);
      document.title = "Docs — Den Seje App";
      var items = Object.keys(DOCS).map(function (slug) {
        return '<li><a href="docs.html?doc=' + encodeURIComponent(slug) + '">' + escapeHtml(DOCS[slug].title) + "</a></li>";
      }).join("");
      document.getElementById("content").innerHTML =
        "<h1>Docs</h1><p style='color:var(--dim)'>Intern dokumentation. Kun for administratorer.</p><ul class='doc-index'>" + items + "</ul>";
    }

    function showError(msg) {
      document.getElementById("content").innerHTML = '<div class="error">' + escapeHtml(msg) + "</div>";
    }

    function getParam(name) {
      var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
      return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : null;
    }

    function main() {
      var slug = getParam("doc");
      if (!slug) { showIndex(); return; }
      var entry = DOCS[slug];
      if (!entry) { renderTopbar(null); showError("Ukendt dokument: " + slug + " (se listen på docs.html)."); return; }

      renderTopbar(slug);
      document.title = entry.title;
      // Fetched by CONTENT HASH, not by filename: the object is immutable, so these bytes can
      // never have been swapped underneath the manifest that named them.
      supabase.storage.from(BUCKET).download(entry.key)
        .then(function (res) {
          // RLS decides this, not the page: a non-super_admin session gets an error here even
          // if it reached the URL directly.
          if (res.error || !res.data) throw new Error(res.error ? res.error.message : "tomt svar");
          return res.data.arrayBuffer().then(function (buf) {
            // Integrity: the manifest states the hash, so check it instead of trusting it.
            // Fail CLOSED on a mismatch — a document that is not what the manifest says it is
            // must not be rendered. If the browser has no SubtleCrypto (non-secure context),
            // say so rather than silently skipping the check.
            var text = new TextDecoder("utf-8").decode(buf);
            if (!entry.sha256) return text;
            if (!(window.crypto && window.crypto.subtle)) {
              throw new Error("kan ikke verificere dokumentet i denne browserkontekst");
            }
            return window.crypto.subtle.digest("SHA-256", buf).then(function (d) {
              var hex = Array.prototype.map.call(new Uint8Array(d), function (b) {
                return ("0" + b.toString(16)).slice(-2);
              }).join("");
              if (hex !== entry.sha256) throw new Error("dokumentet matcher ikke sin kontrolsum");
              return text;
            });
          });
        })
        .then(function (md) {
          try {
            document.getElementById("content").innerHTML = render(md);
          } catch (e) {
            // Fail-soft: never blank; show the raw source rather than nothing.
            document.getElementById("content").innerHTML = "<pre><code>" + escapeHtml(md) + "</code></pre>";
          }
        })
        .catch(function (e) {
          showError("Kunne ikke hente dokumentet (" + (e && e.message ? e.message : "fejl") + ").");
        });
    }

    // ── access gate ──────────────────────────────────────────────────────────────────────
    // Two independent things have to hold, and only one of them is this page's business.
    // The page checks a session and a role so the user gets an honest message instead of an
    // empty screen; the ACTUAL protection is the RLS policy on the private bucket, which does
    // not care what this script believes. Bypassing the checks below gets you nothing.
    function deny(msg) {
      document.body.style.display = "block";
      renderTopbar(null);
      showError(msg);
    }

    (async function boot() {
      try {
        var sess = await supabase.auth.getSession();
        if (!sess || !sess.data || !sess.data.session) {
          window.location.replace("login.html");
          return;
        }
        var uid = sess.data.session.user.id;
        var prof = await supabase.from("profiles").select("role").eq("id", uid).maybeSingle();
        if (prof.error) { deny("Kunne ikke slå din rolle op — prøv igen."); return; }
        if (!prof.data || prof.data.role !== "super_admin") {
          deny("Denne side er kun for administratorer.");
          return;
        }

        var man = await supabase.storage.from(BUCKET).download("manifest.json");
        if (man.error || !man.data) {
          deny("Dokumentlisten kunne ikke hentes. Er dokumenterne publiceret?");
          return;
        }
        var parsed = JSON.parse(await man.data.text());
        var list = (parsed && parsed.docs) || [];
        if (!list.length) { deny("Der er ikke publiceret nogen dokumenter endnu."); return; }
        list.forEach(function (d) {
          // `key` is the content-addressed object name; `file` is a display name only. A
          // manifest entry without a key is unusable and is skipped rather than guessed at.
          if (d && d.slug && d.key) {
            DOCS[d.slug] = { file: d.file || d.slug, key: d.key, sha256: d.sha256 || "", title: d.title || d.slug };
          }
        });

        // FILE_TO_SLUG is built at parse time, when DOCS was still empty — rebuild it now that
        // the manifest has populated DOCS, or links between published docs never resolve.
        Object.keys(DOCS).forEach(function (s) { FILE_TO_SLUG[DOCS[s].file.toLowerCase()] = s; });

        document.body.style.display = "block";
        main();
      } catch (e) {
        deny("Uventet fejl: " + (e && e.message ? e.message : "ukendt"));
      }
    })();
  })();
  </script>
</body>
</html>
