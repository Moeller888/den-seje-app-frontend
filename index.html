<!DOCTYPE html>
<html lang="da" data-theme="default">
<head>
  <!-- Anti-flicker: apply cached theme synchronously before CSS renders -->
  <script>
  (function(){var k='dsj_active_theme',v=['default','ice','inferno','void','forest','sakura','aurora','pearl','meadow','rose-gold'];try{var t=sessionStorage.getItem(k);if(t&&v.indexOf(t)!==-1)document.documentElement.dataset.theme=t;}catch{}}());
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEN SEJE APP</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/theme.css">

  <style>
    /* ── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Prevent iOS Safari auto-zoom on input focus */
    input, textarea, select { font-size: 16px; }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Game shell — single centered column ─────────────────── */
    .game-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 16px 64px;
    }

    /* ── Topbar: back + coins ─────────────────────────────────── */
    .game-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 10px;
      flex-shrink: 0;
    }

    .topbar-back {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      min-height: 32px;
      background: var(--btn-bg);
      border: 1px solid var(--border-btn);
      border-radius: 20px;
      color: var(--text-dim);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .topbar-back:hover {
      background: var(--btn-bg-hover);
      color: var(--text-main);
    }

    .topbar-coins {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 13px;
      background: var(--btn-bg);
      border: 1px solid var(--border-btn);
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      color: var(--coin);
    }

    /* ── Identity strip: avatar + level + XP ─────────────────── */
    .game-identity {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px 12px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    /* Small avatar — identity-supportive, not layout-defining */
    #avatar-display {
      --breathe-shift: -1px;
      --breathe-scale: 1.006;
      position: relative;
      isolation: isolate;
      width: 52px;
      height: 78px;
      border-radius: 8px;
      /* Dual-gradient background: overhead light highlight + themed atmosphere */
      background:
        radial-gradient(ellipse at 50% 18%, rgba(255,255,255,0.05) 0%, transparent 52%),
        radial-gradient(ellipse at 50% 35%, var(--avatar-inner) 0%, var(--avatar-outer) 100%);
      border: 1.5px solid var(--border);
      /* Multi-layer shadow: ambient glow + inner vignette depth + contact grounding */
      box-shadow:
        var(--avatar-ambient),
        inset 0 0 9px rgba(0,0,0,0.26),
        0 3px 7px rgba(0,0,0,0.40),
        0 1px 2px rgba(0,0,0,0.30);
      overflow: visible;
      flex-shrink: 0;
      animation: avatarBreathe 3.5s linear infinite;
    }

    /* Rim light overlay — subtle directional lighting from upper-left */
    #avatar-display::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 6px;
      background: linear-gradient(
        148deg,
        rgba(255,255,255,0.06) 0%,
        rgba(255,255,255,0.015) 28%,
        transparent 52%,
        rgba(0,0,0,0.05) 100%
      );
      z-index: 9;
      pointer-events: none;
    }

    .quiz-avatar-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* Secondary motion — back items (capes) drift with cloth inertia */
    .avatar-slot-back {
      transform-origin: 50% 0%;
      animation: avatarCapeDrift 5.3s ease-in-out infinite;
    }

    /* Aura independent breath — out of phase with character breathing */
    .avatar-slot-aura {
      transform-origin: 50% 38%;
      animation: avatarAuraBreath 4.7s ease-in-out infinite;
    }

    /* Level + XP section */
    .identity-progress {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .identity-level-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .identity-level {
      font-size: 13px;
      color: var(--text-dim);
    }

    .identity-level b {
      font-size: 20px;
      font-weight: bold;
      color: var(--text-bright);
      line-height: 1;
    }

    .identity-xp-label {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    #xp-bar-container {
      height: 8px;
      background: var(--xp-track);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
    }

    #xp-bar {
      height: 100%;
      background: var(--success);
      border-radius: 4px;
      width: 0%;
      transition: width 350ms ease;
    }

    /* ── Question card — the visual focal point ──────────────── */
    .game-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 16px;
      padding: 24px 20px 20px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    #question {
      font-size: 20px;
      line-height: 1.55;
      color: var(--text-bright);
      min-height: 60px;
      transition: opacity 300ms ease;
    }

    #question[data-state="loading"] {
      opacity: 0.45;
      animation: questionPulse 1.4s ease-in-out infinite;
    }

    #question[data-state="reflecting"] {
      opacity: 0.3;
    }

    @keyframes avatarBreathe {
      0%   { transform: translateY(0) scale(1); animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1); }
      38%  { transform: translateY(var(--breathe-shift, -1px)) scale(var(--breathe-scale, 1.006)); animation-timing-function: cubic-bezier(0.15, 0, 0.25, 1); }
      100% { transform: translateY(0) scale(1); }
    }

    /* Section 58 — Cape cloth inertia: asymmetric drift with settle */
    @keyframes avatarCapeDrift {
      0%   { transform: rotate(0deg)     skewY(0deg);     animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1); }
      40%  { transform: rotate(0.35deg)  skewY(0.12deg);  animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1); }
      75%  { transform: rotate(-0.22deg) skewY(-0.07deg); animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1); }
      100% { transform: rotate(0deg)     skewY(0deg); }
    }

    /* Section 58 — Aura secondary breath: independent of character cycle */
    @keyframes avatarAuraBreath {
      0%   { opacity: 0.78; transform: scale(0.99);  animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1); }
      55%  { opacity: 1.0;  transform: scale(1.035); animation-timing-function: cubic-bezier(0.25, 0, 0.35, 1); }
      100% { opacity: 0.78; transform: scale(0.99); }
    }

    @keyframes questionPulse {
      0%, 100% { opacity: 0.35; }
      50%       { opacity: 0.55; }
    }

    #question[data-state="empty"] {
      color: var(--text-muted);
      font-size: 17px;
      text-align: center;
      padding: 8px 0 12px;
      min-height: 0;
    }

    #question[data-state="error"] {
      color: var(--error-bright);
      font-size: 15px;
      min-height: 0;
    }

    #feedback {
      margin-top: 14px;
      font-size: 14px;
      font-weight: bold;
      min-height: 20px;
      line-height: 1.4;
      transition: color 150ms ease;
    }
    /* Hidden when empty — layout placeholder preserved via min-height */
    #feedback:empty { visibility: hidden; }

    .feedback-correct { color: var(--success-text); }
    .feedback-error   { color: var(--error-bright); }
    .feedback-pending { color: var(--coin); }
    .feedback-reflect { color: var(--text-muted); font-weight: normal; }

    /* ── Reflection panel — shown during REFLECTING state ────── */
    #review-feedback {
      display: none;
      margin-top: 16px;
      font-size: 16px;
      line-height: 1.75;
      color: var(--text-main);
      padding: 16px 18px;
      background: var(--bg-main);
      border-radius: 10px;
      border-left: 3px solid var(--accent);
    }

    #review-feedback.visible {
      display: block;
      animation: reflectIn 300ms ease forwards;
    }

    @keyframes reflectIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Continue button — shown during REFLECTING state ─────── */
    #reflection-continue {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 14px 18px;
      background: var(--btn-bg);
      border: 1.5px solid var(--border-btn);
      border-radius: 12px;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
      text-align: center;
    }

    #reflection-continue:hover {
      background: var(--btn-bg-hover);
      color: var(--text-main);
      border-color: var(--border);
    }

    #reflection-continue:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ── Answer area ─────────────────────────────────────────── */
    .answer-area {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    /* MC option buttons */
    #options button {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 52px;
      padding: 14px 18px;
      margin: 0;
      background: var(--btn-bg);
      color: var(--text-dim);
      border: 1.5px solid var(--border-btn);
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      text-align: left;
      line-height: 1.3;
      transition: background 0.1s, color 0.1s, border-color 0.1s, transform 0.08s;
    }

    #options button:hover:not(:disabled) {
      background: var(--btn-bg-hover);
      color: var(--text-main);
      border-color: var(--border);
    }

    #options button:active:not(:disabled) {
      transform: scale(0.98);
    }

    #options button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Primary submit button (text / number answer types) */
    #options button.submit-btn {
      justify-content: center;
      background: var(--accent);
      color: #fff;
      border-color: transparent;
      font-weight: bold;
    }

    #options button.submit-btn:hover:not(:disabled) {
      opacity: 0.88;
      color: #fff;
      border-color: transparent;
    }

    /* Text / number inputs */
    #options input[type="text"],
    #options textarea {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg-card);
      color: var(--text-main);
      border: 1.5px solid var(--border-btn);
      border-radius: 12px;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.4;
      resize: none;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    #options input[type="text"]:focus,
    #options textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(21, 101, 192, 0.18);
    }

    /* ── Answer flash animations ─────────────────────────────── */
    .correct-flash {
      background: var(--correct-bg) !important;
      border-color: var(--success) !important;
      color: var(--success-text) !important;
      animation: pop 0.25s ease;
    }

    .incorrect-flash {
      background: var(--error-bg) !important;
      border-color: var(--error) !important;
      color: var(--error-bright) !important;
      animation: shake 0.25s ease;
    }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.025); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%   { transform: translateX(0); }
      25%  { transform: translateX(-5px); }
      50%  { transform: translateX(5px); }
      75%  { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    /* ── XP / coin popup ─────────────────────────────────────── */
    #xp-popup {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      font-size: 36px;
      font-weight: bold;
      color: var(--coin);
      opacity: 0;
      pointer-events: none;
      z-index: 999;
    }

    .xp-show { animation: xpPop 0.8s ease forwards; }

    @keyframes xpPop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      50%  { opacity: 1; transform: translate(-50%, -60%) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
    }

    /* ── Level-up overlay ────────────────────────────────────── */
    #level-up-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: var(--coin);
      text-align: center;
      transition: opacity 250ms ease;
    }

    .level-up-title {
      font-size: 48px;
      font-weight: bold;
      text-shadow: 0 0 20px var(--coin);
      margin-bottom: 10px;
    }

    .level-up-subtitle {
      font-size: 24px;
      color: var(--text-bright);
    }

    /* ── Grade selector overlay ─────────────────────────────── */
    #grade-selector-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 14, 23, 0.97);
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
    }
    #grade-selector-overlay h2 {
      color: var(--text-primary, #f0edf8);
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      margin: 0;
    }
    #grade-selector-overlay p {
      color: var(--text-secondary, #8e8aa8);
      font-size: 0.95rem;
      text-align: center;
      margin: 0 0 8px;
      max-width: 280px;
    }
    .grade-btn {
      width: 200px;
      padding: 14px 0;
      border: 2px solid var(--accent-primary, #7c3aed);
      border-radius: 12px;
      background: transparent;
      color: var(--text-primary, #f0edf8);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .grade-btn:hover,
    .grade-btn:focus {
      background: var(--accent-primary, #7c3aed);
      outline: none;
    }
    .grade-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Identity selection overlay (Section 152C) ──────────── */
    #identity-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 14, 23, 0.97);
      z-index: 1002;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
    }
    #identity-overlay h2 {
      color: var(--text-primary, #f0edf8);
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      margin: 0;
    }
    #identity-overlay p {
      color: var(--text-secondary, #8e8aa8);
      font-size: 0.95rem;
      text-align: center;
      margin: 0 0 8px;
      max-width: 300px;
    }
    .identity-cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }
    .identity-card {
      width: 104px;
      padding: 12px 8px 10px;
      border: 2px solid var(--accent-primary, #7c3aed);
      border-radius: 12px;
      background: transparent;
      color: var(--text-primary, #f0edf8);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: background 0.15s, border-color 0.15s;
    }
    .identity-card:hover,
    .identity-card:focus {
      background: rgba(124, 58, 237, 0.25);
      outline: none;
    }
    .identity-card:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .identity-card--current {
      border-color: #4caf50;
    }
    .identity-card-preview {
      position: relative;
      width: 64px;
      height: 96px;
      pointer-events: none;
    }
    .identity-card-preview img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .identity-card-current-badge {
      font-size: 0.7rem;
      font-weight: 700;
      color: #4caf50;
      min-height: 1em;
      letter-spacing: 0.5px;
    }
    #identity-later-btn {
      background: none;
      border: none;
      color: var(--text-secondary, #8e8aa8);
      font-size: 0.9rem;
      text-decoration: underline;
      cursor: pointer;
      padding: 8px 16px;
    }
    #identity-later-btn:hover,
    #identity-later-btn:focus {
      color: var(--text-primary, #f0edf8);
      outline: none;
    }
    #identity-later-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Placement assessment overlay ────────────────────────── */
    #placement-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 14, 23, 0.99);
      z-index: 1001;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .placement-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .placement-header {
      text-align: center;
    }
    .placement-title {
      color: var(--text-primary, #f0edf8);
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 6px;
    }
    .placement-sub {
      color: var(--text-secondary, #8e8aa8);
      font-size: 0.875rem;
      margin: 0;
    }
    .placement-progress-wrap {
      width: 100%;
      height: 5px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    #placement-progress-bar {
      height: 100%;
      background: var(--accent-primary, #7c3aed);
      border-radius: 3px;
      width: 0%;
      transition: width 0.3s ease;
    }
    #placement-count {
      color: var(--text-secondary, #8e8aa8);
      font-size: 0.8rem;
      text-align: center;
    }
    #placement-question {
      color: var(--text-primary, #f0edf8);
      font-size: 1.05rem;
      line-height: 1.55;
      text-align: center;
      min-height: 64px;
    }
    #placement-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .placement-option-btn {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      color: var(--text-primary, #f0edf8);
      font-size: 0.9rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .placement-option-btn:hover:not(:disabled),
    .placement-option-btn:focus:not(:disabled) {
      background: rgba(124,58,237,0.18);
      border-color: var(--accent-primary, #7c3aed);
      outline: none;
    }
    .placement-option-btn:disabled {
      cursor: default;
    }
    .placement-option-btn.placement-correct {
      border-color: #22c55e;
      background: rgba(34,197,94,0.14);
    }
    .placement-option-btn.placement-incorrect {
      border-color: #ef4444;
      background: rgba(239,68,68,0.10);
    }

    /* ── Reduced motion ──────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      #xp-bar { transition: none; }
      #question { transition: none; }
      .correct-flash,
      .incorrect-flash,
      #question[data-state="loading"],
      #review-feedback.visible,
      #avatar-display,
      .avatar-slot-back,
      .avatar-slot-aura { animation: none; }
      #avatar-blink-layer { display: none; }
    }

    /* ── Desktop: slightly more breathing room ───────────────── */
    @media (min-width: 600px) {
      .game-shell { padding: 0 0 64px; }
      .game-card  { padding: 28px 24px 22px; }
    }
  </style>
</head>

<body>

<div class="game-shell">

  <!-- Topbar: navigation + live coin count -->
  <div class="game-topbar">
    <button class="topbar-back" id="menu-btn">&#8592; Hub</button>
    <div class="topbar-coins">&#x1FA99; <span id="coins">&#8212;</span></div>
  </div>

  <!-- Identity strip: compact avatar + level + XP bar -->
  <div class="game-identity">
    <div id="avatar-display"></div>
    <div class="identity-progress">
      <div class="identity-level-row">
        <span class="identity-level">Niveau <b id="level">&#8212;</b></span>
        <span class="identity-xp-label"><span id="xp">&#8212;</span> XP</span>
      </div>
      <div id="xp-bar-container"
           role="progressbar" aria-valuenow="0" aria-valuemax="100"
           aria-label="XP fremskridt">
        <div id="xp-bar"></div>
      </div>
    </div>
  </div>

  <!-- Domain focus indicator — shown when teacher has assigned specific domains -->
  <div id="domain-focus-bar" style="display:none;text-align:center;padding:4px 0 8px;font-size:12px;color:var(--text-dim)">
    <span id="domain-focus-text"></span>
  </div>

  <!-- Question card: the visual and interaction focal point -->
  <div class="game-card" id="game-card">
    <div id="question">Indl&#230;ser&hellip;</div>
    <div id="feedback"></div>
    <div id="review-feedback"></div>
    <button type="button" id="reflection-continue">Videre &#8594;</button>
  </div>

  <!-- Answer area: MC buttons or text/number input + submit -->
  <div id="options" class="answer-area"></div>

</div>

<!-- XP / coin earned popup -->
<div id="xp-popup"></div>

<!-- Level-up fullscreen overlay -->
<div id="level-up-overlay">
  <div class="level-up-title">NY DYBDE &#127775;</div>
  <div class="level-up-subtitle" id="level-up-text"></div>
</div>

<!-- Logout button — hidden visually, wired by app.js -->
<button id="logout-btn" style="display:none" aria-hidden="true"></button>

<!-- Identity selection overlay (Section 152C) — soft prompt for students
     who have never explicitly chosen an avatar identity (chosen_at null).
     "Vælg senere" dismisses without writing; re-prompts at next login. -->
<div id="identity-overlay">
  <h2>V&#230;lg din avatar</h2>
  <p>Du kan altid &#230;ndre det senere p&#229; din avatar-side</p>
  <div class="identity-cards">
    <button class="identity-card" data-body-type="male">
      <span class="identity-card-preview">
        <img src="/assets/avatar/base/body-male.svg" alt="">
        <img src="/assets/avatar/hair/hair-default.svg" alt="">
      </span>
      <span>Dreng</span>
      <span class="identity-card-current-badge"></span>
    </button>
    <button class="identity-card" data-body-type="female">
      <span class="identity-card-preview">
        <img src="/assets/avatar/base/body-female.svg" alt="">
        <img src="/assets/avatar/hair/hair-default.svg" alt="">
      </span>
      <span>Pige</span>
      <span class="identity-card-current-badge"></span>
    </button>
    <button class="identity-card" data-body-type="neutral">
      <span class="identity-card-preview">
        <img src="/assets/avatar/base/body.svg" alt="">
        <img src="/assets/avatar/hair/hair-default.svg" alt="">
      </span>
      <span>Neutral</span>
      <span class="identity-card-current-badge"></span>
    </button>
  </div>
  <button id="identity-later-btn">V&#230;lg senere</button>
  <p id="identity-status" style="min-height:1.4em;font-size:0.9rem;margin:0;"></p>
</div>

<!-- Grade selector overlay — shown once on first visit if selected_grade is null -->
<div id="grade-selector-overlay">
  <h2>Vælg dit klassetrin</h2>
  <p>Du f&#229;r sp&#248;rgsm&#229;l, der passer til dit niveau</p>
  <button class="grade-btn" data-grade="7">7. klasse</button>
  <button class="grade-btn" data-grade="8">8. klasse</button>
  <button class="grade-btn" data-grade="9">9. klasse</button>
  <p id="grade-status" style="min-height:1.4em;font-size:0.9rem;margin:0;"></p>
</div>

<!-- Placement assessment overlay — shown once after grade selection -->
<div id="placement-overlay">
  <div class="placement-container">
    <div class="placement-header">
      <p class="placement-title">Hj&#230;lp opdageren med at finde vejen</p>
      <p class="placement-sub">10 korte sp&#248;rgsm&#229;l &#8212; vi finder dit rette udgangspunkt</p>
    </div>
    <div class="placement-progress-wrap">
      <div id="placement-progress-bar"></div>
    </div>
    <div id="placement-count"></div>
    <div id="placement-question"></div>
    <div id="placement-options"></div>
  </div>
</div>

<script type="module">
  document.getElementById("menu-btn").onclick = () => {
    window.location.href = "hub.html";
  };
</script>

<!-- Load active theme from server (non-blocking, falls back to cached/default) -->
<script type="module">
  import { loadTheme } from "./js/themeManager.js";
  loadTheme().catch(() => {});
</script>

<script type="module" src="supabaseClient.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
