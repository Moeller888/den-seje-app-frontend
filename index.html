<!DOCTYPE html>
<html lang="da" data-theme="default">
<head>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/theme.css">
  <meta charset="UTF-8">
  <title>DEN SEJE APP</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    #menu-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      cursor: pointer;
    }

    #logout-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      cursor: pointer;
    }

    h1 {
      margin-bottom: 20px;
    }

    .top-bar {
      display: flex;
      gap: 30px;
      align-items: center;
      margin-bottom: 20px;
    }

    #xp-bar-container {
      flex: 1;
      height: 20px;
      background: var(--xp-track);
    }

    #xp-bar {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 350ms ease;
    }

    .game-container {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    /* ── Quiz avatar ─────────────────────────────────────────── */

    .avatar-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    #avatar-display {
      position: relative;
      width: 160px;
      height: 240px;
      border-radius: 12px;
      background: radial-gradient(ellipse at 50% 35%, var(--avatar-inner) 0%, var(--avatar-outer) 100%);
      border: 2px solid var(--border);
      overflow: visible;
    }

    .quiz-avatar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .avatar-link {
      font-size: 11px;
      color: var(--link);
      text-decoration: none;
      text-align: center;
      letter-spacing: 0.3px;
    }

    .avatar-link:hover { color: var(--link-hover); }

    /* ── Question area ───────────────────────────────────────── */

    .question-box {
      flex: 1;
      padding: 15px;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    #question {
      font-size: 22px;
      margin-bottom: 15px;
    }

    .answer-row {
      display: flex;
      gap: 10px;
    }

    .answer-row input,
    .answer-row textarea {
      flex: 1;
      padding: 10px;
    }

    .answer-row button {
      padding: 10px 20px;
      cursor: pointer;
    }

    #options button {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 10px;
    }

    .correct-flash {
      background: var(--correct-bg) !important;
      animation: pop 0.25s ease;
    }

    .incorrect-flash {
      background: var(--error-bg) !important;
      animation: shake 0.25s ease;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    /* XP POPUP */
    #xp-popup {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      font-size: 40px;
      font-weight: bold;
      color: var(--coin);
      opacity: 0;
      pointer-events: none;
      z-index: 999;
    }

    .xp-show {
      animation: xpPop 0.8s ease forwards;
    }

    @keyframes xpPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -60%) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -80%) scale(1);
      }
    }

    /* LEVEL UP OVERLAY */
    #level-up-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: var(--coin);
      text-align: center;
      transition: opacity 250ms ease;
    }

    #level-up-overlay .level-up-title {
      font-size: 48px;
      font-weight: bold;
      text-shadow: 0 0 20px var(--coin);
      margin-bottom: 10px;
    }

    #level-up-overlay .level-up-subtitle {
      font-size: 24px;
      color: var(--text-bright);
    }

    #feedback {
      transition: color 150ms ease;
      min-height: 1.5em;
    }

    /* Responsive: narrow screens stack avatar above question */
    @media (max-width: 520px) {
      .game-container {
        flex-direction: column;
        align-items: center;
      }
      #avatar-display {
        width: 120px;
        height: 180px;
      }
    }
  </style>
</head>

<body>

  <button id="menu-btn">☰ Menu</button>
  <button id="logout-btn">Log ud</button>

  <h1>DEN SEJE APP</h1>

  <div class="top-bar">
    <span>Level: <b id="level">1</b></span>
    <span>XP: <b id="xp">0</b></span>

    <div id="xp-bar-container">
      <div id="xp-bar"></div>
    </div>

    <span>Mønter: <b id="coins">0</b></span>
  </div>

  <div class="game-container">

    <div class="avatar-box">
      <div id="avatar-display"></div>
      <a href="avatar.html" class="avatar-link">&#128084; Skift udseende</a>
    </div>

    <div class="question-box">
      <div id="question">Indlæser...</div>
      <div id="feedback"></div>
      <div id="options"></div>
      <div id="review-feedback"></div>
    </div>

  </div>

  <!-- 🔥 XP POPUP -->
  <div id="xp-popup"></div>

  <!-- 🔥 LEVEL UP OVERLAY -->
  <div id="level-up-overlay">
    <div class="level-up-title">LEVEL UP! 🎉</div>
    <div class="level-up-subtitle" id="level-up-text"></div>
  </div>

  <script type="module">
    document.getElementById("menu-btn").onclick = () => {
      window.location.href = "hub.html";
    };
  </script>

  <script type="module" src="supabaseClient.js"></script>
  <script type="module" src="app.js"></script>

</body>
</html>
