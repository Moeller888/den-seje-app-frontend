<!DOCTYPE html>
<html lang="da" data-theme="default">
<head>
  <script>
  (function(){var k='dsj_active_theme',v=['default','ice','inferno','void','forest','sakura','aurora','pearl','meadow','rose-gold'];try{var t=sessionStorage.getItem(k);if(t&&v.indexOf(t)!==-1)document.documentElement.dataset.theme=t;}catch{}}());
  </script>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Videnkamp – DEN SEJE APP</title>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    input, textarea, select { font-size: 16px; }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
    }

    .kamp-shell {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 12px 16px 48px;
      display: flex;
      flex-direction: column;
    }

    .kamp-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0 12px;
    }

    .kamp-back {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      min-height: 32px;
      background: var(--btn-bg);
      border: 1px solid var(--border-btn);
      border-radius: 20px;
      color: var(--text-dim);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }
    .kamp-back:hover { background: var(--btn-bg-hover); color: var(--text-main); }
    .kamp-back:focus-visible,
    .kamp-cta:focus-visible,
    .kamp-option:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .kamp-title {
      font-size: 15px;
      font-weight: bold;
      color: var(--text-bright);
      letter-spacing: 0.2px;
    }

    .kamp-top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .kamp-coins {
      font-size: 14px;
      font-weight: bold;
      color: var(--coin);
      white-space: nowrap;
    }

    .kamp-mute {
      padding: 6px 10px;
      font-size: 12px;
      font-family: inherit;
      background: var(--btn-bg);
      color: var(--text-dim);
      border: 1px solid var(--border-btn);
      border-radius: 16px;
      cursor: pointer;
    }
    .kamp-mute:hover { background: var(--btn-bg-hover); color: var(--text-main); }

    /* ── Arena ─────────────────────────────────────────── */
    .kamp-arena {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 8px;
      min-height: 210px;
      padding: 18px 8px 10px;
      margin-bottom: 12px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background:
        radial-gradient(ellipse at 50% 118%, color-mix(in srgb, var(--accent) 22%, transparent) 0%, transparent 54%),
        radial-gradient(ellipse at 50% 0%, var(--avatar-inner) 0%, var(--bg-panel) 72%);
      overflow: hidden;
    }

    .kamp-floor {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 10px;
      height: 56px;
      border-radius: 50%;
      border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
      box-shadow:
        inset 0 0 0 6px color-mix(in srgb, var(--accent) 12%, transparent),
        0 0 24px color-mix(in srgb, var(--accent) 18%, transparent);
      pointer-events: none;
    }

    .kamp-fighter {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .kamp-avatar-wrap[data-gender="boy"]  { --avatar-inner: #b8d4f8; --avatar-outer: #0d2a5a; }
    .kamp-avatar-wrap[data-gender="girl"] { --avatar-inner: #f8b8d4; --avatar-outer: #5a0d2a; }

    .kamp-avatar {
      position: relative;
      isolation: isolate;
      width: 100px;
      height: 150px;
      border-radius: 10px;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(255,255,255,0.05) 0%, transparent 52%),
        radial-gradient(ellipse at 50% 35%, var(--avatar-inner) 0%, var(--avatar-outer) 100%);
      box-shadow: var(--avatar-ambient), 0 8px 18px rgba(0,0,0,0.35);
      overflow: visible;
      animation: kampBreathe 3.5s linear infinite;
    }

    .kamp-avatar-layer,
    .quiz-avatar-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .kamp-name {
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--text-label);
    }

    .kamp-vs {
      position: relative;
      z-index: 2;
      align-self: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--text-bright);
      background: var(--bg-card);
      border: 1px solid var(--border);
      margin-bottom: 28px;
    }

    /* ── Gåden ─────────────────────────────────────────── */
    .kamp-gaade {
      position: relative;
      width: 118px;
      height: 150px;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.4));
    }

    .kamp-gaade svg { width: 100%; height: 100%; display: block; overflow: visible; }

    .kamp-gaade .boss-art { display: none; }
    .kamp-gaade[data-boss="gaade"] .boss-art[data-boss-art="gaade"],
    .kamp-gaade[data-boss="jarl"]  .boss-art[data-boss-art="jarl"],
    .kamp-gaade[data-boss="skygg"] .boss-art[data-boss-art="skygg"],
    .kamp-gaade[data-boss="mur"]   .boss-art[data-boss-art="mur"],
    .kamp-gaade[data-boss="kedel"] .boss-art[data-boss-art="kedel"],
    .kamp-gaade[data-boss="ting"]  .boss-art[data-boss-art="ting"] { display: inline; }

    .kamp-arena[data-boss="jarl"]  { --avatar-inner: #3a2a18; }
    .kamp-arena[data-boss="skygg"] { --avatar-inner: #1a2430; }
    .kamp-arena[data-boss="mur"]   { --avatar-inner: #241830; }
    .kamp-arena[data-boss="kedel"] { --avatar-inner: #2a2218; }
    .kamp-arena[data-boss="ting"]  { --avatar-inner: #182430; }

    .gaade-spin {
      transform-origin: 50px 54px;
      animation: gaadeSpin 14s linear infinite;
    }

    .gaade-core {
      transform-origin: 50px 62px;
      animation: gaadePulse 2.8s ease-in-out infinite;
    }

    .gaade-crack { opacity: 0; transition: opacity 0.35s ease; }
    .kamp-gaade[data-hits="1"] .c1,
    .kamp-gaade[data-hits="2"] .c1,
    .kamp-gaade[data-hits="3"] .c1,
    .kamp-gaade[data-hits="4"] .c1,
    .kamp-gaade[data-hits="5"] .c1,
    .kamp-gaade[data-hits="6"] .c1,
    .kamp-gaade[data-hits="7"] .c1 { opacity: 1; }
    .kamp-gaade[data-hits="2"] .c2,
    .kamp-gaade[data-hits="3"] .c2,
    .kamp-gaade[data-hits="4"] .c2,
    .kamp-gaade[data-hits="5"] .c2,
    .kamp-gaade[data-hits="6"] .c2,
    .kamp-gaade[data-hits="7"] .c2 { opacity: 1; }
    .kamp-gaade[data-hits="3"] .c3,
    .kamp-gaade[data-hits="4"] .c3,
    .kamp-gaade[data-hits="5"] .c3,
    .kamp-gaade[data-hits="6"] .c3,
    .kamp-gaade[data-hits="7"] .c3 { opacity: 1; }
    .kamp-gaade[data-hits="4"] .c4,
    .kamp-gaade[data-hits="5"] .c4,
    .kamp-gaade[data-hits="6"] .c4,
    .kamp-gaade[data-hits="7"] .c4 { opacity: 1; }
    .kamp-gaade[data-hits="5"] .c5,
    .kamp-gaade[data-hits="6"] .c5,
    .kamp-gaade[data-hits="7"] .c5 { opacity: 1; }
    .kamp-gaade[data-hits="6"] .c6,
    .kamp-gaade[data-hits="7"] .c6 { opacity: 1; }
    .kamp-gaade[data-hits="7"] .c7 { opacity: 1; }

    .spark {
      position: absolute;
      left: 50%;
      top: 42%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--coin);
      pointer-events: none;
      animation: sparkFly 0.55s ease-out forwards;
    }

    .kamp-arena.is-hit { animation: arenaHit 0.42s ease-out; }
    .kamp-arena.is-miss { animation: arenaMiss 0.5s ease-out; }

    /* ── Tablet ────────────────────────────────────────── */
    .kamp-hud {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .kamp-round {
      font-size: 12px;
      color: var(--text-dim);
    }

    .kamp-combo {
      font-size: 12px;
      font-weight: bold;
      color: var(--coin);
    }

    .kamp-topic {
      font-size: 11px;
      color: var(--text-label);
    }

    .kamp-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 16px;
      padding: 22px 18px 16px;
    }

    .kamp-prompt {
      font-size: 20px;
      line-height: 1.5;
      color: var(--text-bright);
      min-height: 3em;
      margin-bottom: 16px;
    }

    .kamp-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .kamp-option {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text-main);
      background: var(--btn-bg);
      border: 1px solid var(--border-btn);
      border-radius: 10px;
      cursor: pointer;
    }
    .kamp-option:hover:not(:disabled) { background: var(--btn-bg-hover); }
    .kamp-option:disabled { cursor: default; }
    .kamp-option.is-correct {
      background: var(--correct-bg);
      border-color: var(--success);
      color: var(--success-text);
    }
    .kamp-option.is-wrong {
      background: var(--error-bg);
      border-color: var(--error);
    }
    .kamp-option.is-reveal {
      border-color: var(--success);
      color: var(--success-text);
    }

    .kamp-text {
      width: 100%;
      min-height: 72px;
      padding: 10px 12px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text-main);
      background: var(--bg-card);
      border: 1px solid var(--border-btn);
      border-radius: 10px;
      resize: vertical;
    }

    .kamp-feedback {
      min-height: 1.4em;
      margin-top: 12px;
      font-size: 14px;
      color: var(--text-dim);
    }
    .kamp-feedback.is-correct { color: var(--success-text); }
    .kamp-feedback.is-wrong { color: var(--info-text); }

    /* ── Intro / result ────────────────────────────────── */
    .kamp-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
      padding: 24px 8px;
    }

    .kamp-kicker {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--text-label);
    }

    .kamp-hero {
      font-size: 34px;
      line-height: 1.1;
      color: var(--text-bright);
      font-weight: bold;
    }

    .kamp-lead {
      max-width: 28em;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text-dim);
    }

    .kamp-cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .kamp-cta {
      padding: 12px 20px;
      font-size: 15px;
      font-family: inherit;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--border-btn);
      background: var(--btn-bg);
      color: var(--text-main);
    }
    .kamp-cta--primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .kamp-cta--primary:hover { filter: brightness(1.08); }
    .kamp-cta:hover { background: var(--btn-bg-hover); }
    .kamp-cta--primary:hover { background: var(--accent); }

    .kamp-note {
      font-size: 12px;
      color: var(--text-muted);
    }

    .kamp-score {
      font-size: 22px;
      font-weight: bold;
      color: var(--coin);
    }

    .kamp-boot-error {
      padding: 24px;
      color: var(--error-bright);
    }

    @keyframes kampBreathe {
      0%   { transform: translateY(0) scale(1); animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1); }
      38%  { transform: translateY(-1px) scale(1.006); animation-timing-function: cubic-bezier(0.15, 0, 0.25, 1); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes gaadeSpin { to { transform: rotate(360deg); } }
    @keyframes gaadePulse {
      0%, 100% { transform: scale(1); opacity: 0.92; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes sparkFly {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--sx), var(--sy)) scale(0.2); opacity: 0; }
    }
    @keyframes arenaHit {
      0% { filter: brightness(1.35); }
      100% { filter: brightness(1); }
    }
    @keyframes arenaMiss {
      0% { filter: saturate(0.7); }
      100% { filter: saturate(1); }
    }

    @media (max-width: 560px) {
      .kamp-arena { min-height: 176px; padding: 12px 4px 8px; }
      .kamp-avatar { width: 72px; height: 108px; }
      .kamp-gaade { width: 88px; height: 112px; }
      .kamp-prompt { font-size: 18px; }
      .kamp-hero { font-size: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .kamp-avatar, .gaade-spin, .gaade-core { animation: none; }
      .kamp-arena.is-hit, .kamp-arena.is-miss, .spark { animation: none; }
    }
  </style>
</head>
<body>
<div class="kamp-shell" id="kamp-root" data-screen="intro">

  <div class="kamp-topbar">
    <button type="button" class="kamp-back" id="kamp-back">← Spil</button>
    <div class="kamp-title">Videnkamp</div>
    <div class="kamp-top-right">
      <span class="kamp-coins" id="kamp-coins">—</span>
      <button type="button" class="kamp-mute" id="kamp-mute" aria-pressed="false">Lyd fra</button>
    </div>
  </div>

  <div class="kamp-arena" id="kamp-arena" aria-hidden="false">
    <div class="kamp-floor" aria-hidden="true"></div>

    <div class="kamp-fighter">
      <div class="kamp-avatar-wrap" id="kamp-avatar-wrap">
        <div class="kamp-avatar" id="kamp-avatar"></div>
      </div>
      <div class="kamp-name">Dig</div>
    </div>

    <div class="kamp-vs" aria-hidden="true">VS</div>

    <div class="kamp-fighter">
      <div class="kamp-gaade" id="kamp-gaade" data-boss="gaade" data-hits="0" aria-label="Gåden">
        <svg viewBox="0 0 100 128" role="img">
          <defs>
            <linearGradient id="gaadeBody" x1="20" y1="8" x2="88" y2="120">
              <stop offset="0%" stop-color="#8ec8ff"/>
              <stop offset="45%" stop-color="#3a6ad4"/>
              <stop offset="100%" stop-color="#1a2458"/>
            </linearGradient>
            <linearGradient id="jarlBody" x1="20" y1="8" x2="80" y2="120">
              <stop offset="0%" stop-color="#e8c48a"/>
              <stop offset="55%" stop-color="#8a5a28"/>
              <stop offset="100%" stop-color="#3a2410"/>
            </linearGradient>
            <linearGradient id="skyggBody" x1="10" y1="0" x2="90" y2="120">
              <stop offset="0%" stop-color="#9ab0c8"/>
              <stop offset="50%" stop-color="#3a4a5c"/>
              <stop offset="100%" stop-color="#101820"/>
            </linearGradient>
            <linearGradient id="murBody" x1="0" y1="0" x2="100" y2="120">
              <stop offset="0%" stop-color="#d0b8e0"/>
              <stop offset="50%" stop-color="#5a3a78"/>
              <stop offset="100%" stop-color="#1a1028"/>
            </linearGradient>
            <linearGradient id="kedelBody" x1="20" y1="0" x2="80" y2="120">
              <stop offset="0%" stop-color="#e0c090"/>
              <stop offset="50%" stop-color="#8a6030"/>
              <stop offset="100%" stop-color="#2a1c10"/>
            </linearGradient>
            <linearGradient id="tingBody" x1="20" y1="0" x2="80" y2="120">
              <stop offset="0%" stop-color="#c8d8f0"/>
              <stop offset="50%" stop-color="#4a6a9a"/>
              <stop offset="100%" stop-color="#142038"/>
            </linearGradient>
            <radialGradient id="gaadeCore" cx="50%" cy="45%" r="50%">
              <stop offset="0%" stop-color="#fff6c8"/>
              <stop offset="55%" stop-color="#ffd54a"/>
              <stop offset="100%" stop-color="#c47a10"/>
            </radialGradient>
          </defs>

          <g class="boss-art" data-boss-art="gaade">
            <polygon points="50,6 88,38 74,118 26,118 12,38" fill="url(#gaadeBody)" stroke="#cfe4ff" stroke-width="1.2"/>
            <polygon points="50,18 72,40 64,102 36,102 28,40" fill="#15204a" opacity="0.35"/>
            <g class="gaade-spin"><circle cx="50" cy="54" r="22" fill="none" stroke="#d7ecff" stroke-width="1.1" stroke-dasharray="3 5" opacity="0.85"/></g>
          </g>

          <g class="boss-art" data-boss-art="jarl">
            <path d="M50 8 C62 22 70 34 72 52 L78 118 L22 118 L28 52 C30 34 38 22 50 8 Z" fill="url(#jarlBody)" stroke="#f0d7a8" stroke-width="1.2"/>
            <path d="M50 8 C58 4 70 14 74 28 C66 22 58 16 50 18 C42 16 34 22 26 28 C30 14 42 4 50 8 Z" fill="#c48a3a" stroke="#f0d7a8" stroke-width="1"/>
            <circle cx="50" cy="64" r="16" fill="#2a1a0c" stroke="#f0d7a8" stroke-width="1.1"/>
          </g>

          <g class="boss-art" data-boss-art="skygg">
            <polygon points="18,118 82,118 74,70 26,70" fill="url(#skyggBody)" stroke="#c8d8e8" stroke-width="1.1"/>
            <polygon points="34,70 66,70 58,28 42,28" fill="#1c2834" stroke="#c8d8e8" stroke-width="1"/>
            <polygon points="50,28 88,8 50,44 12,8" fill="#d8e8ff" opacity="0.28"/>
          </g>

          <g class="boss-art" data-boss-art="mur">
            <rect x="12" y="36" width="32" height="82" fill="url(#murBody)" stroke="#e0d0f0" stroke-width="1.1"/>
            <rect x="56" y="28" width="32" height="90" fill="url(#murBody)" stroke="#e0d0f0" stroke-width="1.1"/>
            <line x1="50" y1="18" x2="50" y2="118" stroke="#f4e8ff" stroke-width="1.4" stroke-dasharray="3 4"/>
            <rect x="46" y="8" width="8" height="14" fill="#d8c0f0"/>
          </g>

          <g class="boss-art" data-boss-art="kedel">
            <rect x="22" y="58" width="56" height="60" rx="4" fill="url(#kedelBody)" stroke="#f0d8a8" stroke-width="1.1"/>
            <rect x="30" y="22" width="12" height="40" fill="#6a4a24" stroke="#f0d8a8" stroke-width="1"/>
            <rect x="58" y="14" width="12" height="48" fill="#6a4a24" stroke="#f0d8a8" stroke-width="1"/>
            <circle cx="50" cy="78" r="14" fill="none" stroke="#f0d8a8" stroke-width="2"/>
            <circle cx="50" cy="78" r="4" fill="#f0d8a8"/>
          </g>

          <g class="boss-art" data-boss-art="ting">
            <polygon points="12,40 50,10 88,40" fill="url(#tingBody)" stroke="#dce8f8" stroke-width="1.1"/>
            <rect x="20" y="40" width="12" height="78" fill="#2a3c58" stroke="#dce8f8" stroke-width="1"/>
            <rect x="44" y="40" width="12" height="78" fill="#2a3c58" stroke="#dce8f8" stroke-width="1"/>
            <rect x="68" y="40" width="12" height="78" fill="#2a3c58" stroke="#dce8f8" stroke-width="1"/>
          </g>

          <circle class="gaade-core" cx="50" cy="62" r="11" fill="url(#gaadeCore)"/>
          <path class="gaade-crack c1" d="M48 20 L52 44 L44 70" fill="none" stroke="#fff8d0" stroke-width="1.4"/>
          <path class="gaade-crack c2" d="M62 36 L70 78 L58 110" fill="none" stroke="#fff8d0" stroke-width="1.3"/>
          <path class="gaade-crack c3" d="M38 48 L30 86" fill="none" stroke="#fff8d0" stroke-width="1.2"/>
          <path class="gaade-crack c4" d="M54 74 L60 112" fill="none" stroke="#fff8d0" stroke-width="1.3"/>
          <path class="gaade-crack c5" d="M42 28 L34 58 L46 88" fill="none" stroke="#fff8d0" stroke-width="1.1"/>
          <path class="gaade-crack c6" d="M70 50 L78 92" fill="none" stroke="#fff8d0" stroke-width="1.2"/>
          <path class="gaade-crack c7" d="M50 8 L50 118" fill="none" stroke="#fffde8" stroke-width="1.6"/>
        </svg>
      </div>
      <div class="kamp-name" id="kamp-boss-name">Gåden</div>
    </div>
  </div>

  <section data-screen-panel="intro" class="kamp-center">
    <div class="kamp-kicker">Dagligt raid</div>
    <h1 class="kamp-hero">Træd ind i ringen</h1>
    <p class="kamp-lead">Syv slag. Din avatar. En gåde der skifter ansigt med emnet. Rigtige svar tæller som i spillet — mønter og XP følger med.</p>
    <p class="kamp-note" id="kamp-intro-best"></p>
    <div class="kamp-cta-row">
      <button type="button" class="kamp-cta kamp-cta--primary" id="kamp-start">Træd ind</button>
    </div>
  </section>

  <section data-screen-panel="fight" hidden>
    <div class="kamp-hud">
      <span class="kamp-round" id="kamp-round">Slag 1 af 7</span>
      <span class="kamp-topic" id="kamp-topic"></span>
      <span class="kamp-combo" id="kamp-combo" hidden>Kæde</span>
    </div>
    <div class="kamp-card">
      <div class="kamp-prompt" id="kamp-prompt"></div>
      <div class="kamp-options" id="kamp-options"></div>
      <div class="kamp-feedback" id="kamp-feedback" aria-live="polite"></div>
    </div>
  </section>

  <section data-screen-panel="result" class="kamp-center" hidden>
    <div class="kamp-kicker">Raid slut</div>
    <h2 class="kamp-hero" id="kamp-result-title">Gåden venter</h2>
    <p class="kamp-lead" id="kamp-result-line"></p>
    <p class="kamp-score" id="kamp-result-score"></p>
    <p class="kamp-note" id="kamp-result-chain" hidden></p>
    <p class="kamp-note" id="kamp-result-best"></p>
    <p class="kamp-note" id="kamp-result-coins"></p>
    <div class="kamp-cta-row">
      <button type="button" class="kamp-cta kamp-cta--primary" id="kamp-again">Igen</button>
      <button type="button" class="kamp-cta" id="kamp-to-quiz">Åbn quizzen</button>
      <button type="button" class="kamp-cta" id="kamp-to-hub">Tilbage til hub</button>
    </div>
  </section>

</div>

<script type="module" src="js/kamp.js"></script>
</body>
</html>
