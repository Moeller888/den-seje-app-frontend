name: Queue probe (TEMPORARY)

# TEMPORARY — removed again before this PR is ready. Empirical check that job-level
# `concurrency.queue: max` is accepted and that three waiting jobs in one group are run one at a
# time without displacement, with `queue: single` as the control (expected: one cancelled).
# No checkout, no secrets, no token permissions, no Supabase. Groups are per-run, so it cannot
# touch e2e-shared-supabase or any other run.
on:
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  max-a:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: { group: "queue-probe-max-${{ github.run_id }}", cancel-in-progress: false, queue: max }
    steps:
      - run: date -u +%T; sleep 45; date -u +%T
  max-b:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: { group: "queue-probe-max-${{ github.run_id }}", cancel-in-progress: false, queue: max }
    steps:
      - run: date -u +%T; sleep 45; date -u +%T
  max-c:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: { group: "queue-probe-max-${{ github.run_id }}", cancel-in-progress: false, queue: max }
    steps:
      - run: date -u +%T; sleep 45; date -u +%T
  single-a:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: { group: "queue-probe-single-${{ github.run_id }}", cancel-in-progress: false }
    steps:
      - run: date -u +%T; sleep 45; date -u +%T
  single-b:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: { group: "queue-probe-single-${{ github.run_id }}", cancel-in-progress: false }
    steps:
      - run: date -u +%T; sleep 45; date -u +%T
  single-c:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: { group: "queue-probe-single-${{ github.run_id }}", cancel-in-progress: false }
    steps:
      - run: date -u +%T; sleep 45; date -u +%T
