name: E2E prod key check

# A7: skrivebeskyttet kontrol af de tre Supabase-secrets i GitHub-environmentet e2e-prod.
# Logikken og begrundelserne står i .github/ci/e2e-prod-key-check.mjs; kontrakten i
# tests/unit/ci-e2e-prod-key-check.test.mjs.
#
# - Kun manuel start (workflow_dispatch), og jobbet kører kun fra main. e2e-prod kræver desuden
#   godkendelse af en reviewer og tillader kun branchen main.
# - Kun GET og HEAD mod Supabase: ingen global-setup, ingen Playwright, intet login, ingen afhængigheder
#   (intet npm ci), ingen skrivning i produktionen.
# - Kun de tre secrets nedenfor. Intet secret, ingen URL og ingen response body logges.
# - Den delte E2E-lås: alle workflows, der får service-nøglen, tager låsen (tests/unit/ci-e2e-queue.test.mjs).
#   Kontrollen skriver intet, men holder sig til samme regel i stedet for en undtagelse.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: e2e-prod
    concurrency:
      group: e2e-shared-supabase
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/ci
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Kontrollér Supabase-secrets (kun GET/HEAD)
        env:
          E2E_PROD_SUPABASE_URL: ${{ secrets.E2E_PROD_SUPABASE_URL }}
          E2E_PROD_SUPABASE_ANON_KEY: ${{ secrets.E2E_PROD_SUPABASE_ANON_KEY }}
          E2E_PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_PROD_SUPABASE_SERVICE_ROLE_KEY }}
        run: node .github/ci/e2e-prod-key-check.mjs
