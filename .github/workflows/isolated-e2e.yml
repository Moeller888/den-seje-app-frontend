name: Isolated E2E
# D-110 — the EXISTING Playwright suite against a throwaway local Supabase stack, per job, with no shared
# database, no shared E2E lock, no production account, secret or repository variable.
#
# Every matrix entry is a complete, independent environment on its own runner: its own Postgres
# (schema built from the repository: tests/isolated/schema/), its own Auth with synthetic @e2e.invalid
# accounts, its own Edge Runtime serving the repository's Edge Functions, its own mail catcher. N
# entries run at the same time and share nothing — that is the whole point (nine terminals, nine PRs).
#
# Fail-closed towards production, in layers:
#   guard        tests/isolated/isolation-guard.mjs refuses any environment that names production,
#                carries a provider key or a production secret NAME;
#   hosts        production and provider host names resolve to 0.0.0.0 on the runner;
#   firewall     after all downloads, the test group and every container may reach loopback and
#                private (Docker) addresses only — verified, or the job fails;
#   tripwire     every browser goes through a refusing proxy; one request fails the run;
#   seed guard   schema and seed run only against the database carrying this run's token and id.
# Providers: no OpenAI/Azure/Resend key exists here. Edge Functions take their "not configured" paths;
# the bundle server answers /api/tts like the Worker without an Azure key (503 azure_not_configured).
on:
  # Every pull request to main gets one isolated job, `isolated-e2e (run 1)` (D-241 transition step A:
  # observation next to the old suite; no paths filter, so the check exists on every PR — a required
  # check that a PR never receives would make it unmergeable).
  pull_request:
    branches: [ main ]
  push:
    # main (D-110 phase D1): every push to main gets exactly one isolated run of what landed, next to
    # the old production-facing push suite in playwright.yml, which stays unchanged for now.
    branches: [ main, "d110/**" ]
  workflow_dispatch:
    inputs:
      parallel:
        description: "Independent isolated runs at the same time"
        type: choice
        options: [ "1", "3", "6", "9" ]
        default: "3"
      # D-362 / F-07 (owner GO 2026-11-14): "f07" runs ONLY the F07 lane — one job, replay profile f07, production's
      # selection settings, the F-07 spec alone, verified test counts. "standard" (and every pull_request/push) is
      # exactly the matrix this workflow always had. Never reachable from a pull_request or push event.
      profile:
        description: "standard = the usual lanes; f07 = only the dispatch-only F-07 lane (D-362)"
        type: choice
        options: [ "standard", "f07" ]
        default: "standard"

permissions:
  contents: read

# One group per event and ref: a newer push to the same branch (main included) or a newer commit on
# the same PR cancels the overtaken run. A manual dispatch gets a group of its own (its run id), so a
# push to main never cancels a dispatched run on main, and a dispatch never cancels a push run.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
      && format('isolated-e2e-dispatch-{0}', github.run_id)
      || format('isolated-e2e-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

env:
  ISOLATED_E2E: "1"
  ISOLATED_BASE_URL: http://127.0.0.1:8788
  ISOLATED_SUPABASE_URL: http://127.0.0.1:54321
  ISOLATED_MAIL_URL: http://127.0.0.1:54324
  ISOLATED_GROUP: e2eiso
  # Supabase's images from Docker Hub instead of public.ecr.aws: N runners pulling at once were
  # rate-limited there ("toomanyrequests"); Docker Hub does not rate-limit GitHub-hosted runners.
  SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.n.outputs.runs }}
      profiles: ${{ steps.n.outputs.profiles }}
      include: ${{ steps.n.outputs.include }}
      scope: ${{ steps.scope.outputs.scope }}
      files_b64: ${{ steps.scope.outputs.files_b64 }}
    steps:
      # Depth 2: the pull_request checkout is the PR's merge commit; its two parents are the base and
      # the PR head, so `HEAD^1..HEAD` is exactly the PR's change set — no token, no API.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Pure-Markdown docs PRs take a fast, re-validated path; everything else, and every doubt, takes
      # the full isolated suite (tests/isolated/scope.mjs). The job below runs on both paths, so the
      # check `isolated-e2e (run 1)` reports on every pull request.
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tests/isolated/scope.mjs plan
      - id: n
        env:
          PARALLEL: ${{ github.event.inputs.parallel }}
          PROFILE: ${{ github.event.inputs.profile }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # One isolated job per PR — and per d110/par-* branch, which stand in for nine terminals'
          # PRs in the independent-workflows measurement — and per push to main (D1: one run of what
          # landed). Dispatch chooses; other pushes run 3.
          default=3
          if [ "$EVENT" = "pull_request" ]; then default=1; fi
          if [ "$EVENT" = "push" ] && [ "$REF_NAME" = "main" ]; then default=1; fi
          case "$REF_NAME" in d110/par-*) default=1 ;; esac
          n="${PARALLEL:-$default}"
          case "$n" in 1|3|6|9) ;; *) echo "invalid parallel: $n" >&2; exit 1 ;; esac
          # Lanes. Default: the production mirror × runs plus ONE K1 entry — exactly as before. The F07 lane only on
          # an explicit dispatch with profile=f07, and then it is the only job (one run, no mirror, no K1).
          profile="${PROFILE:-standard}"
          case "$profile" in standard|f07) ;; *) echo "invalid profile: $profile" >&2; exit 1 ;; esac
          if [ "$profile" = "f07" ]; then
            [ "$EVENT" = "workflow_dispatch" ] || { echo "the F07 lane runs only on workflow_dispatch" >&2; exit 1; }
            n=1; profiles='["f07"]'; include='[]'
          else
            profiles='["production"]'; include='[{"run":1,"profile":"k1"}]'
          fi
          echo "runs=$(node -e "console.log(JSON.stringify(Array.from({length: $n}, (_, i) => i + 1)))")" >> "$GITHUB_OUTPUT"
          echo "profiles=$profiles" >> "$GITHUB_OUTPUT"
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "lanes: runs=$n profiles=$profiles include=$include"

  isolated-e2e:
    needs: plan
    # The production-mirror entries keep their exact check name "isolated-e2e (run N)". The K1 lane
    # (owner GO 2026-11-07, F10-B2) is ONE extra entry with replay profile k1: the same isolated stack
    # plus L1 K1 (NOT applied in production), running only the isolated specs (tests/isolated), where
    # the H5 tests live. tests/isolated/schema/replay-plan.mjs TEST_PROFILES documents the rules.
    # The F07 lane (owner GO 2026-11-14, D-362) is dispatch-only (input profile=f07) and then the only job.
    name: isolated-e2e (run ${{ matrix.run }}${{ matrix.profile == 'k1' && ', K1-testprofil' || '' }}${{ matrix.profile == 'f07' && ', F07-testprofil' || '' }})
    # Pinned: ubuntu-latest became ubuntu-26.04 (image 20261101.186.1), where Playwright 1.59.1 does not support chromium
    # ("Playwright does not support chromium on ubuntu26.04-x64", 2026-11-12). Unpin together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
        # Default (every pull_request and push): profile [production] and include [{ run: 1, profile: k1 }].
        profile: ${{ fromJSON(needs.plan.outputs.profiles) }}
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
      # Pinned to 24 (CI-01): lts/* moved to Node 26, and Playwright 1.59.1's zip extraction never
      # finishes on Node 26.13.0 — a cold `playwright install` hung after "100% of 170.4 MiB" until the
      # 15-min step timeout (runs 41898476479, 41966246165, 41971066554). The last cold install that
      # worked ran on v24.22.0 (run 41125092989). Revisit when Playwright is upgraded.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Guard — refuse anything that is not isolated
        run: |
          node --input-type=module -e "import('./tests/isolated/isolation-guard.mjs').then(m => { m.assertIsolated(process.env); console.log('isolation guard: OK'); })"

      # Fast path, ONLY when plan said exactly "docs-md": re-validate the very list it used; any
      # disagreement fails this job (red, never green). Every step below runs unless scope is exactly
      # "docs-md" — an empty, missing or unexpected value always means the full suite.
      - name: Docs-only fast path — re-validate that every changed path is Markdown under docs/
        if: needs.plan.outputs.scope == 'docs-md'
        env:
          FILES_B64: ${{ needs.plan.outputs.files_b64 }}
        run: node tests/isolated/scope.mjs recheck

      - name: Egress — blackhole production and provider host names
        if: needs.plan.outputs.scope != 'docs-md'
        run: |
          set -euo pipefail
          node tests/isolated/egress-blackhole.mjs --hosts-lines | sudo tee -a /etc/hosts > /dev/null
          node tests/isolated/egress-blackhole.mjs --verify

      - name: Install dependencies
        if: needs.plan.outputs.scope != 'docs-md'
        run: npm ci

      # Browsers + apt .debs from main's cache entry (same key, same paths as playwright.yml). The Ubuntu
      # mirror stalled here for 12+ minutes on a miss. Since D-261 playwright.yml no longer runs on push,
      # so a push to main of THIS workflow writes the entry on a miss (the key changes with every runner
      # image); pull requests and dispatches only read it.
      - name: Playwright and runner image versions
        if: needs.plan.outputs.scope != 'docs-md'
        id: pwver
        run: |
          v="$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
          echo "key=pw-browsers-apt-${ImageOS:-unknown}-${ImageVersion:-unknown}-playwright-${v}" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browser and apt cache
        if: needs.plan.outputs.scope != 'docs-md'
        id: pwcache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/pw-apt
          key: ${{ steps.pwver.outputs.key }}
      - name: Install Playwright browsers
        if: needs.plan.outputs.scope != 'docs-md'
        timeout-minutes: 15
        env:
          # Logs each download/extract phase, so a stall shows WHERE it stopped (CI-01).
          DEBUG: pw:install
        run: |
          set -euo pipefail
          # Keep what apt downloads, so a miss on main can refill the cache (same as playwright.yml).
          # Mirror path only: a connection that delivers nothing for 30 s fails and is retried at most 3 times
          # (apt's own default waits 120 s), instead of stalling silently until the step timeout.
          printf '%s\n' 'APT::Keep-Downloaded-Packages "true";' 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99-keep-downloaded-debs > /dev/null
          mkdir -p ~/.cache/pw-apt
          seeded=$(find ~/.cache/pw-apt -maxdepth 1 -name '*.deb' | wc -l)
          echo "apt: ${seeded} cached .deb file(s)"
          # CACHE FIRST, NO UBUNTU MIRROR (CI stability, 2026-11-11). `--with-deps` always runs `apt-get update`
          # (13 MB of indexes from the Ubuntu mirrors) even on a cache hit, so every run depended on them: on
          # 2026-11-11 16:02–17:10 UTC no ubuntu.com name resolved on the runners and every install failed or
          # hung, while npm and the cache worked. The cached .deb set is the system-package closure THIS runner
          # image needed when the entry was written (the key includes ImageVersion), so it is installed from the
          # files alone (--no-download), the browsers come from ~/.cache/ms-playwright, and all three must then
          # really start (tests/support/browser-launch-check.mjs). Any failure falls back to the old path below.
          # TRUST: an Actions cache entry carries no signature. This one is written only by a push to main on a key miss
          # (the save step needs a push event; PR runs cannot write main's scope; a written key is never overwritten), from the .debs apt had
          # just checked against Ubuntu's signed index. Installing those files offline skips that check, so the trust anchor
          # is "who can push to main" - the same as for the cached browsers. The launch check proves function, not integrity.
          path=mirrors
          if [ "$seeded" -gt 0 ]; then
            # Audit trail (no integrity proof - see TRUST above): one digest of the restored .deb set, so runs on the same
            # key can be compared, and the cache entry can be matched to the main run that wrote it.
            echo "apt: cached .deb set sha256 $(cd ~/.cache/pw-apt && sha256sum -- *.deb | sha256sum | cut -c1-64)"
            # apt counts a package as already fetched only when its .deb lies in /var/cache/apt/archives under apt's own
            # file name (apt-pkg pkgAcqArchive). A .deb named on the command line from anywhere else is still queued as a
            # fetch, and --no-download drops every queued fetch: "E: Unable to fetch some archives" in 2 s, before apt
            # prints its package list (run 43089224884). So the files go into the archive directory first; the
            # names in ~/.cache/pw-apt are the ones apt gave them when it downloaded them on main.
            sudo cp ~/.cache/pw-apt/*.deb /var/cache/apt/archives/
            # --no-download: never a mirror. --no-remove: apt aborts instead of removing any installed package.
            if sudo apt-get install -y --no-download --no-remove --no-install-recommends ~/.cache/pw-apt/*.deb > "$RUNNER_TEMP/apt-cache-install.log" 2>&1 \
               && timeout --kill-after=30s 3m npx playwright install > "$RUNNER_TEMP/pw-cache-install.log" 2>&1 \
               && node tests/support/browser-launch-check.mjs; then
              path=cache
              # The whole apt output, so every run shows what was installed and that nothing was fetched ("Need to get 0 B").
              echo "::group::apt output of the cache install"; cat "$RUNNER_TEMP/apt-cache-install.log"; echo "::endgroup::"
            else
              echo "::warning title=INFRA-CACHE::cache-first install did not complete; falling back to the Ubuntu mirrors"
              # The whole output, not a tail: a tail hid which archive apt was missing in run 43089224884.
              for log in "$RUNNER_TEMP/apt-cache-install.log" "$RUNNER_TEMP/pw-cache-install.log"; do
                if [ -f "$log" ]; then echo "--- ${log##*/}"; cat "$log"; fi
              done
              # A cache install that stopped inside dpkg leaves half-configured packages, and apt then refuses all work.
              # Finish it here, or fail closed: never hand a broken dpkg state to the fallback.
              if ! sudo dpkg --configure -a; then
                echo "::error title=INFRA-INSTALL::dpkg could not finish the interrupted cache install - no test ran"
                exit 1
              fi
            fi
          fi
          if [ "$path" = mirrors ]; then
            # The cached .debs are already in /var/cache/apt/archives (above), so apt fetches only what differs.
            # Bounded: a cold install takes a few minutes; 10 min leaves the 15-min step room for the launch check.
            if ! timeout --kill-after=30s 10m npx playwright install --with-deps; then
              echo "::error title=INFRA-INSTALL::npx playwright install --with-deps failed or ran past 10 min (Ubuntu mirror, runner DNS or network) - no test ran"
              exit 1
            fi
            if ! node tests/support/browser-launch-check.mjs; then
              echo "::error title=INFRA-INSTALL::a browser cannot start after the mirror install - no test ran"
              exit 1
            fi
            find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} ~/.cache/pw-apt/ \;
          fi
          echo "::notice title=INFRA-INSTALL-PATH::playwright install: system packages from the ${path}"
          docker pull curlimages/curl:8.11.1 > /dev/null
      # Only a push to main writes the ~557 MB entry, and only on a miss — nine PRs saving their own would
      # evict it from the 10 GB cache. Runs before the egress lock; it carries no secret and changes
      # nothing the suite reads.
      - name: Save Playwright browser and apt cache
        if: needs.plan.outputs.scope != 'docs-md' && steps.pwcache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/pw-apt
          key: ${{ steps.pwver.outputs.key }}

      - uses: supabase/setup-cli@v1
        if: needs.plan.outputs.scope != 'docs-md'
        with:
          version: 2.101.0

      - name: Start a bare local Supabase (no migrations, no Edge Runtime yet)
        if: needs.plan.outputs.scope != 'docs-md'
        id: start
        env:
          RUN: ${{ matrix.run }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/held-migrations"
          mv supabase/migrations/* "$RUNNER_TEMP/held-migrations/"
          t0=$(date +%s)
          # N runners pull the same images at once and the registry rate-limits them
          # ("toomanyrequests"). Stagger by run number and retry ONLY the start/pull, at most 4 times;
          # nothing after this step is ever retried.
          sleep $(( (RUN - 1) * 15 ))
          for attempt in 1 2 3 4; do
            if supabase start -x studio,imgproxy,vector,logflare,realtime,storage-api,postgres-meta,edge-runtime; then break; fi
            supabase stop --no-backup > /dev/null 2>&1 || true
            [ "$attempt" = 4 ] && { echo "local stack did not start after 4 attempts" >&2; exit 1; }
            sleep $(( attempt * 45 + RUN * 7 ))
          done
          mv "$RUNNER_TEMP/held-migrations/"* supabase/migrations/
          echo "start_seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
          supabase status -o env > "$RUNNER_TEMP/stack.env"
          get() { grep -E "^($1)=" "$RUNNER_TEMP/stack.env" | head -1 | cut -d= -f2- | tr -d '"'; }
          anon=$(get 'ANON_KEY|PUBLISHABLE_KEY'); service=$(get 'SERVICE_ROLE_KEY|SECRET_KEY'); db=$(get 'DB_URL')
          echo "::add-mask::$anon"; echo "::add-mask::$service"
          {
            echo "ISOLATED_SUPABASE_ANON_KEY=$anon"
            echo "ISOLATED_SUPABASE_SERVICE_KEY=$service"
            echo "ISOLATED_DB_URL=$db"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/stack.env"

      - name: Bootstrap — mark this run's database (token + cluster id), enable pg_cron
        if: needs.plan.outputs.scope != 'docs-md'
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          node --input-type=module -e "import('./tests/isolated/seed/seed-guard.mjs').then(m => process.stdout.write(m.bootstrapMarkerSql(process.argv[1])))" "$token" \
            | psql "$ISOLATED_DB_URL" -X -q -v ON_ERROR_STOP=1 -f -
          psql "$ISOLATED_DB_URL" -X -q -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_cron;"
          sysid=$(psql "$ISOLATED_DB_URL" -X -A -t -c "SELECT system_identifier FROM pg_control_system()")
          { echo "ISOLATED_DB_TOKEN=$token"; echo "ISOLATED_DB_SYSID=$sysid"; } >> "$GITHUB_ENV"

      - name: Schema — CI baseline, CI stubs and the replay plan (fails on any error)
        if: needs.plan.outputs.scope != 'docs-md'
        env:
          REPLAY_PROFILE: ${{ matrix.profile }}
        run: node tests/isolated/schema/replay.mjs --db-url "$ISOLATED_DB_URL" --summary "$GITHUB_STEP_SUMMARY" --profile "$REPLAY_PROFILE"

      # Fail loud if the lane does not have the schema it claims: K1's columns must exist in the k1
      # lane and must NOT exist in the production mirror (which would mean K1 leaked into it).
      - name: Schema — verify the replay profile (K1 present only in the K1 lane)
        if: needs.plan.outputs.scope != 'docs-md'
        env:
          REPLAY_PROFILE: ${{ matrix.profile }}
        run: |
          n=$(psql "$ISOLATED_DB_URL" -X -A -t -c "SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'question_attempts' AND column_name IN ('mode', 'hints_used')")
          echo "replay profile $REPLAY_PROFILE: K1 columns on question_attempts = $n"
          if [ "$REPLAY_PROFILE" = "k1" ]; then [ "$n" = "2" ] || { echo "K1 lane without K1" >&2; exit 1; }
          else [ "$n" = "0" ] || { echo "K1 leaked into the production-mirror lane" >&2; exit 1; }; fi
          # D-362 / F-07: the phase repeat RPC (20261113170000, NOT_IN_PRODUCTION) exists in the f07 lane only.
          r=$(psql "$ISOLATED_DB_URL" -X -A -t -c "SELECT count(*) FROM pg_proc p JOIN pg_namespace s ON s.oid = p.pronamespace WHERE s.nspname = 'public' AND p.proname = 'request_repeat_phase_question_for_student'")
          echo "replay profile $REPLAY_PROFILE: F-07 phase repeat RPC = $r"
          if [ "$REPLAY_PROFILE" = "f07" ]; then [ "$r" = "1" ] || { echo "F07 lane without the phase repeat RPC" >&2; exit 1; }
          else [ "$r" = "0" ] || { echo "the F-07 phase repeat RPC leaked into the $REPLAY_PROFILE lane" >&2; exit 1; }; fi

      - name: Seed — synthetic questions (INSERT-only, behind the target check)
        if: needs.plan.outputs.scope != 'docs-md'
        run: node tests/isolated/seed/seed.mjs --db-url "$ISOLATED_DB_URL"

      - name: Edge Functions — serve this commit's functions locally, warm every module
        if: needs.plan.outputs.scope != 'docs-md'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          # The edge-runtime container can die while booting (SIGBUS, "Bus error (core dumped)", exit 135:
          # 2 of 9 jobs in run 40650983690). Like the stack start, ONLY the server start is retried, at
          # most 3 times and logged; no test is ever retried, and a runtime that never serves fails here.
          # D-329: objective targeting is ON in the isolated stack only (the secret is unset — off — everywhere
          # else). No existing client sends learning_objective, so the frontend suite still runs today's path.
          echo 'LAERLIGVERSE_OBJECTIVE_TARGETING=on' > "$RUNNER_TEMP/functions.env"
          # D-338: the server-directed sequence, likewise ON only in the isolated stack.
          echo 'LAERLIGVERSE_SEQUENCE=on' >> "$RUNNER_TEMP/functions.env"
          # D-362 / F-07: the F07 lane uses production's selection settings instead (LEVEL_ENGINE=v1,
          # QUESTION_MIX_ENGINE=shadow, no Lærligverse flag). Every other lane keeps the two lines above.
          if [ "$PROFILE" = "f07" ]; then
            printf '%s\n' 'LEVEL_ENGINE=v1' 'QUESTION_MIX_ENGINE=shadow' > "$RUNNER_TEMP/functions.env"
          fi
          echo "functions.env ($PROFILE): $(cut -d= -f1 "$RUNNER_TEMP/functions.env" | tr '\n' ' ')"
          ready=no
          for attempt in 1 2 3; do
            nohup supabase functions serve --env-file "$RUNNER_TEMP/functions.env" >> "$RUNNER_TEMP/functions.log" 2>&1 &
            pid=$!
            for i in $(seq 1 60); do
              # Ready = the function's OWN code answered: get-next-question's preflight handler returns
              # 200 with the body "ok" (supabase/functions/get-next-question/index.ts). Any other status,
              # or a gateway page, is not ready.
              reply=$(curl -s --max-time 10 -X OPTIONS -w '\n%{http_code}' "$ISOLATED_SUPABASE_URL/functions/v1/get-next-question" || true)
              if [ "$(printf '%s' "$reply" | tail -n 1)" = "200" ] && [ "$(printf '%s' "$reply" | head -n 1)" = "ok" ]; then ready=yes; break; fi
              kill -0 "$pid" 2> /dev/null || break   # the CLI exits when the runtime container dies
              sleep 2
            done
            if [ "$ready" = yes ]; then echo "edge-runtime: serving after start attempt $attempt"; break; fi
            echo "::warning::Edge Runtime not serving (start attempt $attempt): $(tail -n 3 "$RUNNER_TEMP/functions.log" | tr '\n' ' ')"
            # Evidence for a systematic cause (SIGBUS): runner memory, disk, /dev/shm, the container.
            if ! { echo "--- edge-runtime start attempt $attempt failed: runner resources and container"
              free -m; df -h / /dev/shm; docker ps -a --filter "name=edge_runtime" --format '{{.Names}} {{.Image}} {{.Status}}'
              for c in $(docker ps -aq --filter "name=edge_runtime"); do docker logs --tail 30 "$c" 2>&1; done
            } | sed 's/^/  /'; then echo "  (diagnostics incomplete)"; fi
            if kill -0 "$pid" 2> /dev/null; then kill "$pid"; fi
            sleep 5
          done
          [ "$ready" = yes ] || { echo "Edge Runtime did not serve after 3 start attempts" >&2; exit 1; }
          # Every function with a preflight handler (detected in its source) must answer it with a 2xx.
          # A function without one runs its normal path on an empty OPTIONS request — question-context is
          # Supabase's hello-world template, `await req.json()` on an empty body throws, and the worker may
          # close the connection (000, run 40654226681) — so its answer is logged, not evaluated: it says
          # nothing about the runtime, which the readiness check and the handlers already prove.
          down=0
          for d in supabase/functions/*/; do
            fn=$(basename "$d"); [ -f "$d/index.ts" ] || continue
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 -X OPTIONS "$ISOLATED_SUPABASE_URL/functions/v1/$fn" || true)
            if grep -qE 'method === "OPTIONS"' "$d/index.ts"; then
              echo "warm $fn: $code (preflight handler: 2xx required)"
              if [ "${code#2}" = "$code" ]; then down=$((down + 1)); fi
            else
              echo "warm $fn: $code (no preflight handler: not evaluated)"
            fi
          done
          [ "$down" = 0 ] || { echo "$down function(s) not served correctly by the Edge Runtime" >&2; exit 1; }

      - name: Build this commit's deploy bundle and serve it on loopback
        if: needs.plan.outputs.scope != 'docs-md'
        run: |
          set -euo pipefail
          # Traced: a failing check here must name its command (keys and URLs are masked by Actions).
          set -x
          node tools/cloudflare-build-static.mjs
          # The CDN modules the frontend imports (supabase-js), fetched once before the network lock and
          # served from loopback (tests/isolated/cdn-mirror.mjs).
          node tests/isolated/cdn-mirror.mjs --fetch dist-cloudflare "$RUNNER_TEMP/cdn-mirror"
          echo "ISOLATED_CDN_MIRROR=$RUNNER_TEMP/cdn-mirror" >> "$GITHUB_ENV"
          ISOLATED_CDN_MIRROR="$RUNNER_TEMP/cdn-mirror" nohup node tests/isolated/serve-build.mjs > "$RUNNER_TEMP/serve.log" 2>&1 &
          # Specs that serve the raw repository import supabase-js from https://cdn.jsdelivr.net itself:
          # answer those two hosts locally with the same mirrored bytes (tests/isolated/cdn-https.mjs).
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=cdn.jsdelivr.net" -addext "subjectAltName=DNS:cdn.jsdelivr.net,DNS:esm.sh"             -keyout "$RUNNER_TEMP/cdn-key.pem" -out "$RUNNER_TEMP/cdn-cert.pem" 2> /dev/null
          nohup node tests/isolated/cdn-https.mjs "$RUNNER_TEMP/cdn-mirror" "$RUNNER_TEMP/cdn-cert.pem" "$RUNNER_TEMP/cdn-key.pem" 8443 > "$RUNNER_TEMP/cdn.log" 2>&1 &
          # Both address families: with an IPv4 line only, an IPv6 lookup falls through to DNS and gets
          # the real CDN (CI, 2026-10-28) — map, redirect and serve ::1 as well as 127.0.0.1.
          sudo iptables -w 30 -t nat -A OUTPUT -o lo -d 127.0.0.1 -p tcp --dport 443 -j REDIRECT --to-ports 8443
          sudo ip6tables -w 30 -t nat -A OUTPUT -o lo -d ::1 -p tcp --dport 443 -j REDIRECT --to-ports 8443
          echo "127.0.0.1 cdn.jsdelivr.net esm.sh" | sudo tee -a /etc/hosts > /dev/null
          echo "::1 cdn.jsdelivr.net esm.sh" | sudo tee -a /etc/hosts > /dev/null
          for i in $(seq 1 30); do curl -sf "$ISOLATED_BASE_URL/login.html" > /dev/null && break; sleep 1; done
          # Fetch to a file first, then grep: under pipefail `curl | grep -q` can fail on SIGPIPE, and the
          # negated form could pass on a failed fetch.
          curl -sf "$ISOLATED_BASE_URL/js/supabase.js" -o "$RUNNER_TEMP/served-supabase.js"
          grep -q "$ISOLATED_SUPABASE_URL" "$RUNNER_TEMP/served-supabase.js"
          ! grep -q "supabase.co" "$RUNNER_TEMP/served-supabase.js"
          ! grep -q "https://cdn.jsdelivr.net" "$RUNNER_TEMP/served-supabase.js"
          for i in $(seq 1 15); do curl -skf "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm" > /dev/null && break; sleep 1; done
          for h in cdn.jsdelivr.net esm.sh; do
            [ "$(getent ahostsv4 "$h" | awk '{print $1}' | sort -u)" = "127.0.0.1" ]
            [ "$(getent ahostsv6 "$h" | awk '{print $1}' | sort -u)" = "::1" ]
            # Each family is answered by the local stand-in (the root path is a 404 from it: -f is off).
            [ "$(curl -4 -sk "https://$h/" -o /dev/null -w '%{remote_ip}')" = "127.0.0.1" ]
            [ "$(curl -6 -sk "https://$h/" -o /dev/null -w '%{remote_ip}')" = "::1" ]
          done
          curl -skf "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm" -o "$RUNNER_TEMP/cdn-supabase.js"
          grep -q "createClient" "$RUNNER_TEMP/cdn-supabase.js"
          curl -skf "https://esm.sh/@supabase/supabase-js@2" > /dev/null

      # Every protection run against a deliberately wrong configuration must refuse it; a control that
      # passes fails the job (a vacuous check is caught in every run). No control contacts production.
      - name: Negative controls — before the lock
        if: needs.plan.outputs.scope != 'docs-md'
        run: bash tests/isolated/negative-controls.sh pre-lock

      - name: Network lock — test group and containers reach loopback/private only (verified)
        if: needs.plan.outputs.scope != 'docs-md'
        run: |
          set -euo pipefail
          sudo groupadd "$ISOLATED_GROUP"
          sudo usermod -a -G "$ISOLATED_GROUP" "$USER"
          bash tests/isolated/egress-firewall.sh lock
          bash tests/isolated/egress-firewall.sh verify

      - name: Negative controls — after the lock
        if: needs.plan.outputs.scope != 'docs-md'
        run: bash tests/isolated/negative-controls.sh post-lock

      - name: Isolated smoke — login against local Auth, recovery mail into the local catcher
        if: needs.plan.outputs.scope != 'docs-md' && matrix.profile != 'f07'
        run: |
          sg "$ISOLATED_GROUP" -c "npx playwright test -c tests/isolated/playwright.isolated.config.mjs"

      # D-362 / F-07 (owner GO 2026-11-14): ONLY the F-07 spec, Chromium first, then Firefox, then WebKit (every
      # browser runs even if an earlier one fails), each with a JSON report; then f07-lane-check.mjs fails the job
      # unless every expected test executed with the expected outcome — an all-skipped run is never green.
      - name: F07 lane — the F-07 spec per browser, then the verified test counts
        if: needs.plan.outputs.scope != 'docs-md' && matrix.profile == 'f07'
        env:
          # The spec fails (never skips) when the phase repeat RPC is missing in this lane.
          F07_LANE: "1"
        run: |
          set -uo pipefail
          status=0
          for b in chromium firefox webkit; do
            echo "::group::F-07 spec — $b"
            export PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/f07-$b.json"
            sg "$ISOLATED_GROUP" -c "npx playwright test -c tests/isolated/playwright.isolated.config.mjs tests/isolated/f07-phase-progression.isolated.spec.mjs --project=$b --reporter=list,json" || { status=1; echo "::error::F-07 spec failed on $b"; }
            echo "::endgroup::"
          done
          mkdir -p test-results-isolated/f07-reports && cp "$RUNNER_TEMP"/f07-*.json test-results-isolated/f07-reports/ || status=1
          node tests/isolated/f07-lane-check.mjs "$RUNNER_TEMP/f07-chromium.json" "$RUNNER_TEMP/f07-firefox.json" "$RUNNER_TEMP/f07-webkit.json" | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          exit "$status"

      - name: Existing Playwright suite against the isolated stack
        if: needs.plan.outputs.scope != 'docs-md' && matrix.profile == 'production'
        id: suite
        run: |
          sg "$ISOLATED_GROUP" -c "node tests/isolated/run-suite.mjs"

      - name: Diagnostics (on failure)
        if: failure() && needs.plan.outputs.scope != 'docs-md'
        run: |
          tail -80 "$RUNNER_TEMP/functions.log" || true
          tail -40 "$RUNNER_TEMP/serve.log" || true
          tail -20 "$RUNNER_TEMP/cdn.log" || true

      - name: Upload report
        if: always() && needs.plan.outputs.scope != 'docs-md'
        uses: actions/upload-artifact@v4
        with:
          name: isolated-report-run-${{ matrix.run }}${{ matrix.profile == 'k1' && '-k1' || '' }}${{ matrix.profile == 'f07' && '-f07' || '' }}
          path: |
            playwright-report-isolated/
            test-results-isolated/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop local Supabase
        if: always() && needs.plan.outputs.scope != 'docs-md'
        run: supabase stop --no-backup || true
