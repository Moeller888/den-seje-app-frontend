# Adventure engine (adventure-engine/): its own checks, separate from the host app's CI.
#
# Runs only when adventure-engine/ (or this file) changes. Not a required check: with the paths
# filter, PRs that do not touch adventure-engine/ never receive it (see
# adventure-engine/docs/release-readiness.md before making it required).
#
# Jobs:
#   check   typecheck, lint + CR-02, unit/property tests with coverage thresholds, 9 scenarios with
#           golden traces, content CLI (validate/build/schema), production builds and the
#           devtools build boundary.
#   cr01    CR-01 against the external denylist. Runs when the repository variable
#           REQUIRE_CLEAN_ROOM_DENYLIST is "1". The list is too large for one secret (48 KB), so it is
#           split at whole lines into the private secrets CLEAN_ROOM_DENYLIST_01 … _08; the job
#           reassembles them in the runner's temp folder (never in the checkout, umask 077, no shell
#           tracing, nothing printed), checks the expected entry count and SHA-256, runs CR-01 with
#           REQUIRE_CLEAN_ROOM_DENYLIST=1 and always removes the file. A missing part, a wrong count or
#           checksum, or a CR-01 hit fails the job. Pull requests from forks get no secrets: the job
#           reports SKIP for them and never references the secrets.
#   e2e     Playwright, functional specs, one worker. Chromium on pull requests; all three browsers when
#           started by hand. The screenshot baselines are made on Windows, so screenshot tests are
#           switched off here (E2E_SCREENSHOTS=off); they run in the documented local workflow.
name: Adventure engine

on:
  pull_request:
    branches: [ main ]
    paths: [ "adventure-engine/**", ".github/workflows/adventure-engine.yml" ]
  push:
    branches: [ main ]
    paths: [ "adventure-engine/**", ".github/workflows/adventure-engine.yml" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adventure-engine-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: adventure-engine

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  check:
    name: adventure-engine / check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies (pnpm 9.15.4, frozen lockfile)
        run: corepack pnpm@9.15.4 install --frozen-lockfile
      - name: Typecheck
        run: corepack pnpm@9.15.4 typecheck
      - name: Lint, CR-02 and CR-01 (SKIP without the external denylist)
        run: corepack pnpm@9.15.4 lint
      - name: Unit and property tests with coverage thresholds
        run: corepack pnpm@9.15.4 coverage
      - name: Scenarios and golden traces
        run: corepack pnpm@9.15.4 scenarios
      - name: Content CLI on the editor fixture
        run: |
          corepack pnpm@9.15.4 content validate packages/content-tools/fixtures/editor-demo --strict
          corepack pnpm@9.15.4 content format packages/content-tools/fixtures/editor-demo --check
          corepack pnpm@9.15.4 content build packages/content-tools/fixtures/editor-demo --out "$RUNNER_TEMP/bundle/bundle.json" --strict
          corepack pnpm@9.15.4 content validate "$RUNNER_TEMP/bundle/bundle.json" --strict
          corepack pnpm@9.15.4 content schema --out packages/content-tools/schemas --check
      - name: Production builds (game, devtools game, editor)
        run: |
          corepack pnpm@9.15.4 build
          DEV_TOOLS=true corepack pnpm@9.15.4 build
          corepack pnpm@9.15.4 --filter @adventure-engine/editor build
      - name: Build boundary (no devtools or editor in the production game)
        run: node tools/check-build-boundary.mjs

  cr01:
    name: adventure-engine / CR-01
    if: vars.REQUIRE_CLEAN_ROOM_DENYLIST == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The expected denylist: parts, entries (non-empty, non-comment lines) and SHA-256 of the whole file.
      # They identify the list without revealing it; change them together with the secrets.
      DENYLIST_PARTS: "8"
      DENYLIST_ENTRIES: "9588"
      DENYLIST_SHA256: "8c19bc1e8616075e0a829eb8056fa4a813c290825765579d52f85fb217e1f4ff"
      FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Pull request from a fork (no secrets, CR-01 SKIP)
        if: env.FORK_PR == 'true'
        working-directory: .
        run: |
          echo "::notice title=CR-01 SKIP::pull requests from forks get no secrets; CR-01 runs once the change is in this repository"
          echo "### CR-01: SKIP (pull request from a fork: no secrets)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.FORK_PR != 'true'
      - uses: actions/setup-node@v4
        if: env.FORK_PR != 'true'
        with:
          node-version: 24
      - name: CR-01 against the external denylist
        if: env.FORK_PR != 'true'
        shell: bash
        env:
          P01: ${{ secrets.CLEAN_ROOM_DENYLIST_01 }}
          P02: ${{ secrets.CLEAN_ROOM_DENYLIST_02 }}
          P03: ${{ secrets.CLEAN_ROOM_DENYLIST_03 }}
          P04: ${{ secrets.CLEAN_ROOM_DENYLIST_04 }}
          P05: ${{ secrets.CLEAN_ROOM_DENYLIST_05 }}
          P06: ${{ secrets.CLEAN_ROOM_DENYLIST_06 }}
          P07: ${{ secrets.CLEAN_ROOM_DENYLIST_07 }}
          P08: ${{ secrets.CLEAN_ROOM_DENYLIST_08 }}
        run: |
          # No "set -x" anywhere: the parts must never reach the log.
          set -euo pipefail
          umask 077
          list="$RUNNER_TEMP/clean-room-denylist.txt"
          trap 'rm -f "$list"' EXIT
          : > "$list"
          missing=""
          for i in $(seq 1 "$DENYLIST_PARTS"); do
            n=$(printf '%02d' "$i")
            var="P$n"
            if [ -z "${!var:-}" ]; then
              missing="$missing CLEAN_ROOM_DENYLIST_$n"
              continue
            fi
            # Each part is whole lines without the final line break.
            printf '%s\n' "${!var}" >> "$list"
          done
          if [ -n "$missing" ]; then
            echo "::error title=CR-01::missing or empty secret(s):$missing"
            exit 1
          fi
          entries=$(grep -cvE '^[[:space:]]*(#|$)' "$list" || true)
          # Via stdin: sha256sum escapes the output line when the file name contains a backslash.
          sha=$(sha256sum < "$list" | cut -d' ' -f1)
          if [ "$entries" != "$DENYLIST_ENTRIES" ]; then
            echo "::error title=CR-01::the reassembled denylist has $entries entries, expected $DENYLIST_ENTRIES"
            exit 1
          fi
          if [ "$sha" != "$DENYLIST_SHA256" ]; then
            echo "::error title=CR-01::the reassembled denylist does not have the expected SHA-256"
            exit 1
          fi
          echo "CR-01: denylist reassembled from $DENYLIST_PARTS parts: $entries entries, SHA-256 verified"
          CLEAN_ROOM_DENYLIST_PATH="$list" REQUIRE_CLEAN_ROOM_DENYLIST=1 node tools/check-clean-room.mjs
      - name: Remove the reassembled denylist
        if: always()
        working-directory: .
        shell: bash
        run: rm -f "$RUNNER_TEMP/clean-room-denylist.txt"

  e2e:
    name: adventure-engine / e2e (${{ matrix.browser }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    env:
      E2E_SCREENSHOTS: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies (pnpm 9.15.4, frozen lockfile)
        run: corepack pnpm@9.15.4 install --frozen-lockfile
      - name: Install the Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Playwright (one worker)
        run: npx playwright test --project=${{ matrix.browser }} --workers=1
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: adventure-engine-playwright-${{ matrix.browser }}
          path: |
            adventure-engine/playwright-report
            adventure-engine/test-results
          retention-days: 7
